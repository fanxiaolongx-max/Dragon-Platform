name: Build Desktop App

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'tools-platform/backend/builtin-tools/**'
    tags:
      - 'v*' # Trigger build on version tags like v1.0.0
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools-platform/package-lock.json
            tools-platform/backend/package-lock.json

      # Skip postinstall (it rebuilds native modules for Electron); tests run on plain Node.
      - name: Install dependencies
        working-directory: tools-platform
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild sqlite3
          npm ci --prefix backend --no-audit --no-fund

      - name: Verify published lesson media
        working-directory: tools-platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run datacom:verify-videos

      - name: Run tests
        working-directory: tools-platform
        run: npm test

  prepare-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
            release_version="${release_tag#v}"
            echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cd tools-platform
          while true; do
            npm version patch --no-git-tag-version --ignore-scripts
            release_version="$(node -p "require('./package.json').version")"
            release_tag="v${release_version}"
            if ! git rev-parse "${release_tag}" >/dev/null 2>&1; then
              break
            fi
            echo "Tag ${release_tag} already exists; trying the next patch version."
          done
          cd ..

          git add tools-platform/package.json tools-platform/package-lock.json
          git commit -m "chore: release ${release_tag} [skip ci]"
          git tag "${release_tag}"
          git push origin HEAD:main
          git push origin "${release_tag}"

          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare-release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: tools-platform
        run: npm install

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('tools-platform/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Build Application (Windows)
        working-directory: tools-platform
        shell: pwsh
        run: |
          for ($i=1; $i -le 3; $i++) {
            Write-Host "Starting build attempt $i of 3..."
            npm run build:win
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Build succeeded on attempt $i."
              break
            }
            if ($i -eq 3) {
              Write-Error "Build failed after 3 attempts."
              exit 1
            }
            Write-Host "Build attempt $i failed. Retrying in 10s..."
            Start-Sleep -Seconds 10
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-app-windows
          path: |
            tools-platform/dist/*.exe
            tools-platform/dist/*.yml
            tools-platform/dist/*.blockmap
            tools-platform/frontend/downloads/uivision-extension-9.6.1.zip

      - name: Release Windows
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: ${{ needs.prepare-release.outputs.release_tag }}
          files: |
            tools-platform/dist/*.exe
            tools-platform/dist/*.yml
            tools-platform/dist/*.blockmap
            tools-platform/frontend/downloads/uivision-extension-9.6.1.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    needs: prepare-release
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: tools-platform
        run: npm install

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('tools-platform/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Setup macOS Keychain for Code Signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: "builder_keychain_${{ github.run_id }}"
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"

          # 1. Decode certificate
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          # 2. Create custom keychain with known password
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 3. Import certificate & private key
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 4. Set as default and add to keychain search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Build Application (macOS)
        working-directory: tools-platform
        shell: bash
        run: |
          check_timestamp_service() {
            echo "Checking Apple Timestamp server connectivity..."
            for attempt in 1 2 3 4 5; do
              if curl -sI -m 8 http://timestamp.apple.com/ts01 >/dev/null 2>&1; then
                echo "Apple Timestamp service is reachable."
                return 0
              fi
              echo "Timestamp service check $attempt/5 failed, waiting 5s..."
              sleep 5
            done
            echo "Warning: Apple Timestamp service check timed out, proceeding anyway..."
            return 0
          }

          for i in 1 2 3 4; do
            echo "=========================================="
            echo "Starting build attempt $i of 4..."
            echo "=========================================="
            check_timestamp_service
            if npm run build:mac; then
              echo "Build succeeded on attempt $i."
              break
            fi
            if [ "$i" -eq 4 ]; then
              echo "Build failed after 4 attempts."
              exit 1
            fi
            delay=$((i * 30))
            echo "Build attempt $i failed. Cleaning dist directory and retrying in ${delay}s..."
            rm -rf dist/mac dist/*.dmg dist/*.zip dist/latest-mac.yml dist/*.blockmap
            sleep "$delay"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEYCHAIN: ${{ runner.temp }}/build.keychain
          CSC_KEYCHAIN_PASSWORD: "builder_keychain_${{ github.run_id }}"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Clean up Keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -f "$RUNNER_TEMP/build_cert.p12" || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-app-macos
          path: |
            tools-platform/dist/*.dmg
            tools-platform/dist/*.zip
            tools-platform/dist/latest-mac.yml
            tools-platform/dist/*.blockmap

      - name: Release macOS
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: ${{ needs.prepare-release.outputs.release_tag }}
          files: |
            tools-platform/dist/*.dmg
            tools-platform/dist/*.zip
            tools-platform/dist/latest-mac.yml
            tools-platform/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Python Universal Packager EXE

on:
  push:
    branches:
      - main
    paths:
      - 'python-packager/**'
      - '.github/workflows/package-python-exe.yml'
  workflow_dispatch:
    inputs:
      build_tag:
        description: '构建版本标签 (如 v1.0.0，留空则自动读取 version.json)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: python-packager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Package Universal Shell EXE (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python-packager/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-packager/requirements.txt
          pip install pyinstaller

      - name: Read Version Metadata
        id: meta
        shell: pwsh
        run: |
          $verJson = Get-Content "python-packager/version.json" -Raw | ConvertFrom-Json
          $version = if ("${{ github.event.inputs.build_tag }}" -ne "") {
            "${{ github.event.inputs.build_tag }}".TrimStart("v")
          } else {
            $verJson.version
          }
          if (-not $version) { $version = "1.0.0" }
          $zipName = "PR报告抽查工具-v$version-Windows-x64.zip"
          Write-Host "Resolved Version: $version"
          Write-Host "Output Zip Name: $zipName"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT

      - name: Compile Universal Shell with PyInstaller
        shell: pwsh
        run: |
          cd python-packager
          pyinstaller --noconfirm --onedir --windowed `
            --name "PR报告抽查工具" `
            --add-data "core_script.py;." `
            --add-data "version.json;." `
            --add-data "updater_config.json;." `
            universal_shell.py

      - name: Assemble Portable Distribution
        shell: pwsh
        run: |
          $distDir = "python-packager/dist/PR报告抽查工具"
          Copy-Item -Path "python-packager/core_script.py" -Destination $distDir -Force
          Copy-Item -Path "python-packager/version.json" -Destination $distDir -Force
          Copy-Item -Path "python-packager/updater_config.json" -Destination $distDir -Force
          Copy-Item -Path "python-packager/README.md" -Destination $distDir -Force

          # 制作便携 ZIP
          $zipPath = "python-packager/dist/${{ steps.meta.outputs.ZIP_NAME }}"
          Compress-Archive -Path "$distDir/*" -DestinationPath $zipPath -Force
          Write-Host "Created archive: $zipPath"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.ZIP_NAME }}
          path: python-packager/dist/${{ steps.meta.outputs.ZIP_NAME }}
          retention-days: 30

      - name: Output Job Summary
        shell: pwsh
        run: |
          $summary = @"
          ## 🚀 Python 通用外壳热更新打包完成！

          | 项目 | 详情 |
          |---|---|
          | **发布包文件** | `${{ steps.meta.outputs.ZIP_NAME }}` |
          | **核心版本** | `v${{ steps.meta.outputs.VERSION }}` |
          | **架构模式** | 通用外壳框架 + 动态核心逻辑脚本 (`core_script.py`) |
          | **热更新源** | 默认 GitHub 官方 Raw，支持国内镜像源与自定义源 |

          ### 💡 极速热更新使用说明：
          1. 用户仅需首次下载安装包/绿色包；
          2. 后续更新核心脚本（如 `core_script.py`）后推送到 GitHub，用户无需重新下载 EXE；
          3. 用户启动程序后点击 **【🔄 检查并在线热更新】**，即可秒级拉取最新脚本逻辑！
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

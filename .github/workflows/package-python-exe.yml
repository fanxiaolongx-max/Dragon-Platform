name: Build Python Universal Packager EXE

on:
  push:
    branches:
      - main
    paths:
      - 'python-packager/**'
      - '.github/workflows/package-python-exe.yml'
  workflow_dispatch:
    inputs:
      build_tag:
        description: '构建版本标签 (如 v1.0.0，留空则自动读取 version.json)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: python-packager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Package Universal Shell EXE (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Preserve LF for hot-update SHA256
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python-packager/requirements.txt'

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r python-packager/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Python and Verify Release Metadata
        shell: pwsh
        run: |
          python -m unittest discover -s python-packager/tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python python-packager/build_exe.py --check-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read Version Metadata
        id: meta
        shell: pwsh
        env:
          BUILD_TAG: ${{ github.event.inputs.build_tag }}
        run: |
          $verJson = Get-Content "python-packager/version.json" -Raw | ConvertFrom-Json
          $version = if ($env:BUILD_TAG) {
            $env:BUILD_TAG.TrimStart("v")
          } else {
            $verJson.version
          }
          if (-not $version -or $version -notmatch '^[0-9A-Za-z][0-9A-Za-z._-]*$') {
            throw "Invalid release version"
          }
          if ($version -ne $verJson.version) {
            throw "build_tag must match version.json to keep the portable release and hot-update metadata consistent"
          }
          $zipName = "PR报告抽查工具-v$version-Windows-x64.zip"
          Write-Host "Resolved Version: $version"
          Write-Host "Output Zip Name: $zipName"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT

      - name: Build and Smoke Test Portable EXE
        shell: pwsh
        run: |
          [Console]::InputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          python python-packager/build_exe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive Verified Portable Distribution
        shell: pwsh
        run: |
          [Console]::InputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8

          $distDir = "python-packager/dist/PR-Audit-Sampler"
          # build_exe.py has assembled both entry names and passed isolated
          # menu/UTF-8/Excel smoke tests before this archive can be published.
          $zipPath = "python-packager/dist/${{ steps.meta.outputs.ZIP_NAME }}"
          Compress-Archive -Path "$distDir/*" -DestinationPath $zipPath -Force
          Write-Host "Created archive: $zipPath"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.ZIP_NAME }}
          path: python-packager/dist/${{ steps.meta.outputs.ZIP_NAME }}
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: python-sampler-v${{ steps.meta.outputs.VERSION }}
          name: "PR 报告抽查工具 v${{ steps.meta.outputs.VERSION }} (Windows 独立绿色版)"
          body: |
            ### 🚀 PR 报告抽查工具 Windows 独立绿色版 (v${{ steps.meta.outputs.VERSION }})

            - **架构特点**：通用外壳 + 动态业务脚本 (`core_script.py`)
            - **极速热更新**：支持在线一键秒级更新，后续更新业务代码无需重复下载或重装客户端！
            - **本版修复与验证**：
              - 主界面无控制台，后台 worker 不显示窗口；内置终端直接输入、菜单清屏和进度原位重绘
              - 支持选择并保存数据目录，真实 GUI 输入、菜单重绘和窗口模式检查通过后发布
              - 修复外置核心脚本依赖未进入 EXE 的问题（包括 glob、pandas、openpyxl 和 .xls 引擎 xlrd）
              - 保留内置终端的标准输入输出，并验证中文及空格路径下的菜单交互和 Excel 读写
              - 核心脚本与版本 SHA256 校验、Python 测试、真实 EXE 冒烟全部通过后发布
            - **业务功能**：
              - 默认按来源类型和单号去重后抽查；菜单 4 可切换按记录抽查，同号冲突时停止并提示核对
              - 自动合并按源文件清单和内容 SHA256 检测变化，覆盖新增、删除及保留旧时间的替换
              - 🌟 多文件/多文件夹自动扫描（不限制特定文件夹名称）
              - 🧠 表头特征列指纹加权智能分类（自动识别风险、整改、RFC、SR 表格）
              - ⚠️ 模糊表格交互提示手动指派
              - 🍎 内置美观苹果 macOS 风格交互控制台，直观展示实时进度与彩色 ANSI 报告

            #### 📦 使用说明：
            1. 下载下方 Assets 中的 `${{ steps.meta.outputs.ZIP_NAME }}` 并解压；
            2. 双击运行 `PR-Audit-Sampler.exe`（或 `PR报告抽查工具.exe`）即可；
            3. 将待抽查数据放入 `data/` 目录，或点击 **【设置数据目录】** 选择文件夹；保留包内 `PR-Audit-Worker.exe` 和 `_internal/`；
            4. 后续有脚本更新只需在界面点击 **【🔄 检查并在线热更新】** 即可一键热替换。
          files: |
            python-packager/dist/${{ steps.meta.outputs.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Job Summary
        shell: pwsh
        run: |
          $summary = @"
          ## 🚀 Python 通用外壳热更新打包并发布完成！

          | 项目 | 详情 |
          |---|---|
          | **发布包文件** | `${{ steps.meta.outputs.ZIP_NAME }}` |
          | **核心版本** | `v${{ steps.meta.outputs.VERSION }}` |
          | **架构模式** | 通用外壳框架 + 动态核心逻辑脚本 (`core_script.py`) |
          | **Release 标签** | `python-sampler-v${{ steps.meta.outputs.VERSION }}` |
          | **热更新源** | 默认 GitHub 官方 Raw，支持国内镜像源与自定义源 |

          ### 💡 极速热更新使用说明：
          1. 用户仅需首次下载安装包/绿色包；
          2. 后续更新核心脚本（如 `core_script.py`）并同步版本 SHA256 后推送到 GitHub；新增依赖时需要重新下载 EXE；
          3. 用户启动程序后点击 **【🔄 检查并在线热更新】**，即可秒级拉取最新脚本逻辑！
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

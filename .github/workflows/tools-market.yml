name: Publish Tools Market

on:
  push:
    branches: [main]
    paths:
      - 'tools-platform/backend/builtin-tools/**'
      - 'tools-platform/backend/models/tool-content-fingerprint.js'
      - 'tools-platform/scripts/build-tools-market.js'
      - '.github/workflows/tools-market.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tools-market-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools-platform/package-lock.json

      - name: Install dependencies
        working-directory: tools-platform
        run: |
          npm ci --ignore-scripts
          npm rebuild sqlite3

      - name: Validate built-in tools
        working-directory: tools-platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run datacom:verify-videos
          node backend/test_builtin_tools_sync.js
          node backend/test_custom_tools_market_service.js

      - name: Build market catalog and packages
        working-directory: tools-platform
        env:
          TOOLS_MARKET_SIGNING_PRIVATE_KEY: ${{ secrets.TOOLS_MARKET_SIGNING_PRIVATE_KEY }}
          TOOLS_MARKET_SIGNING_KEY_ID: official-1
        run: npm run tools:market:build -- market-output

      - name: Publish tool-market branch
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -R tools-platform/market-output/. "$publish_dir/"
          cd "$publish_dir"
          git init -b tool-market
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "publish: tools market ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin tool-market
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <title>Dragon downloads</title>
    <style>
        :root{
            --card:#ffffff;--line:#e5e7eb;--ink:#111827;--ink2:#6b7280;--hover:#f3f4f6;
            --accent:#2563eb;--ok:#16a34a;--bad:#dc2626;--track:#e5e7eb;
            --shadow:0 10px 28px rgba(15,23,42,.14),0 2px 6px rgba(15,23,42,.06);
            color-scheme:light;
        }
        [data-theme=dark]{
            --card:#1d1f24;--line:#ffffff17;--ink:#f1f5f9;--ink2:#94a3b8;--hover:#ffffff0d;
            --accent:#60a5fa;--ok:#4ade80;--bad:#f87171;--track:#ffffff1a;
            --shadow:0 12px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
            color-scheme:dark;
        }
        html,body{margin:0;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}
        body{font:12px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
        #stack{padding:6px 12px 14px;display:flex;flex-direction:column}
        #stack:empty{padding:0}
        .slot{padding-bottom:8px;box-sizing:border-box}
        .slot:last-child{padding-bottom:0}
        .card{position:relative;display:flex;align-items:center;gap:10px;height:54px;box-sizing:border-box;padding:8px 8px 8px 9px;
            border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;cursor:default;
            transition:border-color .18s ease}
        .card.is-openable{cursor:pointer}
        .card.is-openable:hover{background:linear-gradient(var(--hover),var(--hover)),var(--card)}
        .tile{position:relative;flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;
            font-size:9px;font-weight:700;letter-spacing:.02em;background:var(--tile,#64748b)}
        .tile .ext{max-width:30px;overflow:hidden;text-overflow:clip;white-space:nowrap}
        .badge{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;
            background:var(--ok);color:#fff;box-shadow:0 0 0 2px var(--card);transform:scale(0);opacity:0}
        .badge svg{width:10px;height:10px}
        .card[data-state=completed] .badge{animation:badgePop .46s cubic-bezier(.3,1.6,.5,1) .08s forwards}
        .card[data-state=failed] .badge,.card[data-state=interrupted] .badge{background:var(--bad);animation:badgePop .3s ease-out forwards}
        .meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
        .name{display:flex;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap}
        .stem{overflow:hidden;text-overflow:ellipsis;min-width:0}
        .suffix{flex:none}
        .sub{color:var(--ink2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
        .card[data-state=completed] .sub{color:var(--ok)}
        .card[data-state=failed] .sub,.card[data-state=interrupted] .sub{color:var(--bad)}
        .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--track);transition:opacity .35s ease .25s}
        .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:0 2px 2px 0;transition:width .25s ease}
        .card.is-indeterminate .bar i{width:30%;animation:slide 1.1s ease-in-out infinite}
        .card[data-state=completed] .bar,.card[data-state=failed] .bar,.card[data-state=interrupted] .bar,.card[data-state=cancelled] .bar{opacity:0}
        .actions{flex:none;display:flex;gap:2px;opacity:0;transform:translateX(4px);transition:opacity .16s ease,transform .16s ease}
        .card:hover .actions,.card:focus-within .actions{opacity:1;transform:none}
        .actions button{width:26px;height:26px;padding:0;border:0;border-radius:7px;background:transparent;color:var(--ink2);display:grid;place-items:center;cursor:pointer}
        .actions button:hover{background:var(--hover);color:var(--ink)}
        .actions button[hidden]{display:none}
        .actions svg{width:15px;height:15px}
        @keyframes badgePop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
        @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
        @media (prefers-reduced-motion:reduce){
            .card[data-state] .badge{animation:none;transform:none;opacity:1}
            .card.is-indeterminate .bar i{animation:none;width:100%;opacity:.5}
        }
    </style>
</head>
<body>
    <div id="stack" role="log" aria-live="polite"></div>
    <script src="download-toast-page.js"></script>
</body>
</html>

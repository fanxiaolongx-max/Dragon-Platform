<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'none'">
    <link rel="stylesheet" href="../frontend/css/browser-ai-presence.css">
    <style>
        html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
        #pointer{position:fixed;z-index:3;pointer-events:none;color:#7c3aed;filter:drop-shadow(0 2px 3px #0003);transition:left .16s,top .16s}
        #pointer b{position:absolute;left:18px;top:19px;border-radius:7px;background:#7c3aed;color:white;font:10px system-ui;padding:2px 5px}
        [hidden]{display:none!important}
        @media(prefers-reduced-motion:reduce){#pointer{transition:none}}
    </style>
</head>
<body>
    <div class="browser-ai-presence" aria-hidden="true">
        <div class="browser-ai-halo"></div>
        <div class="browser-ai-orb"><i></i></div>
    </div>
    <div class="browser-ai-status" role="status"></div>
    <button class="browser-ai-takeover" type="button" hidden></button>
    <div id="pointer" hidden><svg width="24" height="28" viewBox="0 0 24 28" aria-hidden="true"><path d="M2 2L20 17L12 18L8 26Z" fill="currentColor" stroke="white" stroke-width="2"/></svg><b>AI</b></div>
</body>
</html>

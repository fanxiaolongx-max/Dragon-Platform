<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon Claw · 平台 AI</title><link rel="stylesheet" href="chat.css"></head><body>
<aside><h2>🐉 Dragon Claw</h2><button id="new">＋ 新建对话 / New chat</button><nav id="history" aria-label="聊天历史"></nav></aside>
<main><header><strong>平台 AI · Platform AI</strong><select id="models" aria-label="选择模型"></select></header><div id="messages" aria-live="polite"></div><p id="error" role="alert"></p><form id="form"><textarea id="question" required maxlength="20000" placeholder="输入问题 / Ask a question" aria-label="问题"></textarea><button id="send">发送 / Send</button><button id="stop" type="button" hidden>停止 / Stop</button></form></main>
<script src="../shim.js"></script><script src="chat.js"></script></body></html>

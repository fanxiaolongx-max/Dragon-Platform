<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义工具 - Tools Platform</title>
    <link rel="stylesheet" href="/css/shared.css">
    <style>
        body {
            margin: 0;
            background: #eef3f8;
            min-height: 100vh;
            overflow: hidden;
        }
        .custom-tool-shell {
            padding-top: var(--navbar-h);
            height: 100vh;
            box-sizing: border-box;
            display: grid;
            grid-template-rows: auto 1fr;
        }
        .custom-tool-head {
            min-height: 46px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 14px;
            padding: 0 18px;
            background: #f8fafc;
            border-bottom: 1px solid #dbe5ef;
            box-sizing: border-box;
        }
        .custom-tool-title {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #172033;
            font-size: 14px;
            font-weight: 800;
        }
        .custom-tool-title span:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .custom-tool-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-end;
        }
        .custom-tool-snapshot-actions { display: flex; align-items: center; gap: 8px; }
        .tool-action-wrap { position: relative; }
        .tool-action-menu {
            position: absolute;
            top: calc(100% + 7px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 232px;
            padding: 6px;
            border: 1px solid #d8e4f1;
            border-radius: 11px;
            background: #fff;
            box-shadow: 0 14px 36px rgba(19, 43, 71, .2);
        }
        .tool-action-menu[hidden], .tool-action-wrap[hidden] { display: none; }
        .tool-action-menu button {
            width: 100%;
            padding: 9px 10px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #263d56;
            text-align: left;
            font-size: 12px;
            cursor: pointer;
        }
        .tool-action-menu button:hover, .tool-action-menu button:focus-visible { background: #eaf3ff; outline: none; }
        .tool-action-menu small { display: block; margin-top: 2px; color: #71839a; font-size: 10px; }
        .tool-action-menu .tool-action-divider { height: 1px; margin: 5px 3px; background: #e3ebf4; }
        .tool-action-menu .tool-action-empty { padding: 9px 10px; color: #71839a; font-size: 12px; }
        .tool-action:disabled { opacity: .55; cursor: wait; }
        @media (max-width: 820px) {
            .custom-tool-head { grid-template-columns: minmax(0, 1fr) auto; padding: 7px 12px; }
            .custom-tool-snapshot-actions { grid-column: 1 / -1; grid-row: 2; justify-content: center; }
            .custom-tool-actions { grid-column: 2; grid-row: 1; }
        }
        @media (max-width: 540px) {
            .tool-action { padding: 0 7px; font-size: 11px; }
            .custom-tool-actions, .custom-tool-snapshot-actions { gap: 4px; }
        }
        .tool-action {
            height: 30px;
            padding: 0 11px;
            border-radius: 7px;
            border: 1px solid #c9d6e4;
            color: #33506f;
            background: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .tool-action:hover {
            border-color: #4f8fd9;
            color: #1762ae;
            background: #f7fbff;
        }
        .tool-action[hidden] { display: none; }
        .custom-tool-frame {
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
        }
        .custom-tool-empty {
            display: grid;
            place-items: center;
            height: 100%;
            color: #637083;
            font-size: 14px;
        }
        .custom-tool-host { position: relative; min-height: 0; background: #fff; }
        .custom-tool-frame[hidden] { display: none; }
        .custom-tool-loader { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 24px; background: #eef3f8; }
        .custom-tool-loader[hidden] { display: none; }
        .custom-tool-loader-card { width: min(480px, 86vw); padding: 20px; border: 1px solid #d7e1ec; border-radius: 14px; background: #fff; box-shadow: 0 18px 48px rgba(42, 63, 86, .12); }
        .custom-tool-loader-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; color: #26384d; font-weight: 800; }
        .custom-tool-loader-percent { color: #3679bd; font-size: 12px; font-variant-numeric: tabular-nums; }
        .custom-tool-progress { height: 7px; margin-top: 14px; overflow: hidden; border-radius: 999px; background: #e8eef5; }
        .custom-tool-progress i { display: block; width: 4%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #4285cc, #64b5a8); transition: width .25s ease; }
        .custom-tool-load-log { min-height: 38px; margin-top: 12px; color: #718096; font-size: 11px; line-height: 1.7; white-space: pre-line; }
        .custom-tool-retry { display: none; margin-top: 12px; height: 32px; padding: 0 14px; border: 0; border-radius: 7px; background: #2878c7; color: #fff; font-weight: 700; cursor: pointer; }
        .custom-tool-loader.is-error .custom-tool-loader-head { color: #b33a3a; }
        .custom-tool-loader.is-error .custom-tool-progress i { background: #d45a5a; }
        .custom-tool-loader.is-error .custom-tool-retry { display: inline-flex; align-items: center; }
        @media (prefers-color-scheme: dark) {
            body, .custom-tool-loader { background: #101827; }
            .custom-tool-head { background: #151f30; border-color: #29364a; }
            .custom-tool-title { color: #e7edf6; }
            .tool-action { border-color: #34445b; background: #1b2739; color: #b9c8da; }
            .tool-action-menu { border-color: #34445b; background: #1b2739; }
            .tool-action-menu button { color: #dce6f2; }
            .tool-action-menu button:hover, .tool-action-menu button:focus-visible { background: #293d57; }
            .tool-action-menu small, .tool-action-menu .tool-action-empty { color: #a6b8cb; }
            .tool-action-menu .tool-action-divider { background: #34445b; }
            .custom-tool-loader-card { border-color: #2d3a4f; background: #182335; box-shadow: 0 18px 48px rgba(0, 0, 0, .25); }
            .custom-tool-loader-head { color: #e4ebf5; }
            .custom-tool-progress { background: #2b374a; }
        }
    </style>
</head>
<body>
    <div class="custom-tool-shell">
        <div class="custom-tool-head">
            <div class="custom-tool-title">
                <span id="toolIcon">🧩</span>
                <span id="toolName">自定义工具</span>
            </div>
            <div class="custom-tool-snapshot-actions">
                <div class="tool-action-wrap" id="downloadReadonlyWrap" hidden>
                    <button class="tool-action" id="downloadReadonlyTool" type="button" aria-expanded="false" aria-controls="downloadReadonlyMenu">下载只读页面 ▾</button>
                    <div class="tool-action-menu" id="downloadReadonlyMenu" hidden>
                        <button type="button" data-snapshot-download="single"><span>单文件 HTML</span><small>数据与附件内嵌</small></button>
                        <button type="button" data-snapshot-download="pages"><span>Pages 分离版 ZIP</span><small>HTML + JSON + 附件</small></button>
                    </div>
                </div>
                <div class="tool-action-wrap" id="publishReadonlyWrap" hidden>
                    <button class="tool-action" id="publishReadonlyTool" type="button" aria-expanded="false" aria-controls="publishReadonlyMenu">推送只读页面 ▾</button>
                    <div class="tool-action-menu" id="publishReadonlyMenu" hidden>
                        <button type="button" data-snapshot-publish="default"><span>默认推送</span><small>使用全局设置的推送格式与目标仓库</small></button>
                        <button type="button" data-snapshot-publish="force"><span>强制推送</span><small>即使无变化也触发 Pages 重新部署</small></button>
                        <div class="tool-action-divider"></div>
                        <button type="button" data-snapshot-publish="logs"><span>查看推送日志</span><small>查看本工具及全局推送历史</small></button>
                    </div>
                </div>
            </div>
            <div class="custom-tool-actions">
                <a class="tool-action" id="openRawTool" href="#" target="_blank" rel="noopener">新窗口打开</a>
                <button class="tool-action" id="refreshToolButton" onclick="location.reload()">刷新</button>
            </div>
        </div>
        <div id="toolFrameHost" class="custom-tool-host">
            <div id="toolLoader" class="custom-tool-loader" role="status" aria-live="polite">
                <div class="custom-tool-loader-card">
                    <div class="custom-tool-loader-head"><span id="toolLoadStage">正在准备自定义工具…</span><span id="toolLoadPercent" class="custom-tool-loader-percent">4%</span></div>
                    <div class="custom-tool-progress"><i id="toolLoadBar"></i></div>
                    <div id="toolLoadLog" class="custom-tool-load-log">初始化工具容器</div>
                    <button id="toolLoadRetry" class="custom-tool-retry" type="button">重试加载</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/shared/api.js"></script>
    <script src="/js/shared/toast.js"></script>
    <script src="/js/shared/platform-logo-upload.js"></script>
    <script src="/js/shared/navbar.js"></script>
    <script>
        let currentCustomTool = null;
        let toolLoadSequence = 0;
        let toolLoadController = null;
        let toolLoadLogs = [];

        function isEnglishToolShell() {
            return (window.ToolsI18n?.getLanguage?.() || localStorage.getItem('tools_lang')) === 'en-US';
        }

        function shellText(zh, en) {
            return isEnglishToolShell() ? en : zh;
        }

        function getCustomToolDisplayName(tool) {
            return isEnglishToolShell() && tool?.nameEn ? tool.nameEn : (tool?.name || shellText('自定义工具', 'Custom Tool'));
        }

        function applyCustomToolShellLanguage() {
            const displayName = getCustomToolDisplayName(currentCustomTool);
            document.documentElement.lang = isEnglishToolShell() ? 'en-US' : 'zh-CN';
            document.title = `${displayName} - Tools Platform`;
            document.getElementById('toolName').textContent = displayName;
            document.getElementById('openRawTool').textContent = shellText('新窗口打开', 'Open in New Window');
            document.getElementById('downloadReadonlyTool').textContent = shellText('下载只读页面 ▾', 'Download Snapshot ▾');
            document.getElementById('publishReadonlyTool').textContent = shellText('推送只读页面 ▾', 'Publish Snapshot ▾');
            const downloadItems = document.querySelectorAll('[data-snapshot-download]');
            downloadItems[0].querySelector('span').textContent = shellText('单文件 HTML', 'Single HTML');
            downloadItems[0].querySelector('small').textContent = shellText('数据与附件内嵌', 'Data and evidence embedded');
            downloadItems[1].querySelector('span').textContent = shellText('Pages 分离版 ZIP', 'Split Pages ZIP');
            downloadItems[1].querySelector('small').textContent = shellText('HTML + JSON + 附件', 'HTML + JSON + evidence');
            const publishItems = document.querySelectorAll('[data-snapshot-publish]');
            publishItems[0].querySelector('span').textContent = shellText('默认推送', 'Publish');
            publishItems[0].querySelector('small').textContent = shellText('使用全局设置的推送格式与目标仓库', 'Use the saved format and destination');
            publishItems[1].querySelector('span').textContent = shellText('强制推送', 'Force Publish');
            publishItems[1].querySelector('small').textContent = shellText('即使无变化也触发 Pages 重新部署', 'Redeploy Pages even without changes');
            publishItems[2].querySelector('span').textContent = shellText('查看推送日志', 'View Publishing Logs');
            publishItems[2].querySelector('small').textContent = shellText('查看本工具及全局推送历史', 'Tool and global publishing history');
            document.getElementById('refreshToolButton').textContent = shellText('刷新', 'Refresh');
            document.getElementById('toolLoadRetry').textContent = shellText('重试加载', 'Retry');
            const frame = document.querySelector('.custom-tool-frame');
            if (frame) {
                frame.title = displayName;
                frame.contentWindow?.postMessage({ type: 'tools-platform-language', lang: isEnglishToolShell() ? 'en-US' : 'zh-CN' }, window.location.origin);
            }
        }

        function getToolSlug() {
            const parts = window.location.pathname.split('/').filter(Boolean);
            return parts[0] === 'tools' ? parts[1] : '';
        }

        function setToolLoadState(stage, progress, detail, error = false) {
            const loader = document.getElementById('toolLoader');
            loader.hidden = false;
            loader.classList.toggle('is-error', error);
            document.getElementById('toolLoadStage').textContent = stage;
            document.getElementById('toolLoadPercent').textContent = Number.isFinite(progress) ? `${Math.round(progress)}%` : '';
            document.getElementById('toolLoadBar').style.width = `${Number.isFinite(progress) ? Math.max(0, Math.min(100, progress)) : 100}%`;
            if (detail && toolLoadLogs.at(-1) !== detail) toolLoadLogs.push(detail);
            document.getElementById('toolLoadLog').textContent = toolLoadLogs.slice(-3).join('\n');
        }

        async function fetchToolList(signal) {
            const token = localStorage.getItem('tools_token');
            const response = await fetch('/api/custom-tools', {
                signal,
                headers: token ? { Authorization: `Bearer ${token}` } : {}
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
            return { tools: body, requestId: response.headers.get('X-Request-Id') || '' };
        }

        async function loadCustomTool() {
            const sequence = ++toolLoadSequence;
            toolLoadController?.abort();
            toolLoadController = new AbortController();
            toolLoadLogs = [];
            const slug = getToolSlug();
            const host = document.getElementById('toolFrameHost');
            host.querySelector('.custom-tool-frame')?.remove();
            setToolLoadState(shellText('正在读取工具清单…', 'Reading tool registry…'), 12, `GET /api/custom-tools · slug=${slug || '-'}`);
            const listTimeout = setTimeout(() => toolLoadController?.abort(), 15000);
            try {
                const registry = await fetchToolList(toolLoadController.signal);
                const tools = registry.tools;
                clearTimeout(listTimeout);
                if (sequence !== toolLoadSequence) return;
                setToolLoadState(shellText('正在定位工具资源…', 'Locating tool assets…'), 42, `${shellText(`工具清单已返回，正在查找 ${slug}`, `Registry loaded; locating ${slug}`)}${registry.requestId ? ` · ${registry.requestId}` : ''}`);
                const tool = (tools || []).find(item => item.slug === slug);
                if (!tool) {
                    setToolLoadState(shellText('未找到该自定义工具', 'Custom tool not found'), 100, shellText('工具清单中不存在当前 slug', 'The current slug is missing from the registry'), true);
                    return;
                }
                currentCustomTool = tool;
                updateSnapshotActions(tool.slug);
                const displayName = getCustomToolDisplayName(tool);
                document.getElementById('toolIcon').textContent = tool.icon || '🧩';
                document.getElementById('openRawTool').href = tool.filePath;
                const allowedFeatures = tool.slug === 'optical-transfer'
                    ? 'camera; autoplay; fullscreen; microphone; display-capture'
                    : 'autoplay; fullscreen; microphone; display-capture';
                const frame = document.createElement('iframe');
                frame.className = 'custom-tool-frame';
                const cleanFilePath = tool.filePath || '';
                // 外层地址的参数（如首页「插件与脚本」入口带的 ?script=）透传给工具页，便于直达具体脚本
                const frameUrl = new URL(cleanFilePath, location.origin);
                new URLSearchParams(location.search).forEach((value, key) => frameUrl.searchParams.set(key, value));
                frameUrl.searchParams.set('_t', String(Date.now()));
                frame.src = frameUrl.origin === location.origin ? `${frameUrl.pathname}${frameUrl.search}${frameUrl.hash}` : frameUrl.href;
                frame.title = displayName;
                frame.allow = allowedFeatures;
                frame.hidden = true;
                const frameTimeout = setTimeout(() => {
                    if (sequence !== toolLoadSequence || !document.getElementById('toolLoader')) return;
                    setToolLoadState(shellText('工具页面加载超时', 'Tool page loading timed out'), 100, `${tool.filePath} · ${shellText('超过 30 秒', 'over 30 seconds')}`, true);
                }, 30000);
                frame.addEventListener('load', () => {
                    clearTimeout(frameTimeout);
                    if (sequence !== toolLoadSequence) return;
                    setToolLoadState(shellText('工具已就绪', 'Tool is ready'), 100, `Loaded ${tool.filePath}`);
                    frame.hidden = false;
                    document.getElementById('toolLoader').hidden = true;
                    applyCustomToolShellLanguage();
                }, { once: true });
                host.appendChild(frame);
                setToolLoadState(shellText('正在加载工具页面与脚本…', 'Loading tool page and scripts…'), 68, `GET ${tool.filePath}`);
                applyCustomToolShellLanguage();
            } catch (err) {
                clearTimeout(listTimeout);
                if (sequence !== toolLoadSequence) return;
                const timedOut = err.name === 'AbortError';
                setToolLoadState(
                    shellText(timedOut ? '读取工具清单超时' : '加载自定义工具失败', timedOut ? 'Tool registry request timed out' : 'Failed to load custom tool'),
                    100,
                    timedOut ? shellText('GET /api/custom-tools 超过 15 秒', 'GET /api/custom-tools exceeded 15 seconds') : err.message,
                    true
                );
            }
        }

        window.addEventListener('tools:languagechange', applyCustomToolShellLanguage);
        window.addEventListener('message', event => {
            if (event.origin !== window.location.origin || event.data?.type !== 'tools-custom-tool-language') return;
            window.ToolsI18n?.setLanguage?.(event.data.lang);
        });
        window.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                const frame = document.querySelector('.custom-tool-frame');
                frame?.contentWindow?.postMessage({ type: 'tools-platform-escape' }, '*');
            }
        }, true);
        function forwardParentClose(event) {
            const frame = document.querySelector('.custom-tool-frame');
            if (frame?.contentWindow && !frame.contains(event.target)) {
                frame.contentWindow.postMessage({ type: 'tools-platform-parent-click' }, '*');
            }
        }
        document.addEventListener('pointerdown', forwardParentClose, true);
        document.addEventListener('click', forwardParentClose, true);
        document.addEventListener('DOMContentLoaded', loadCustomTool);
        document.getElementById('toolLoadRetry').addEventListener('click', loadCustomTool);
        function snapshotHeaders() {
            const token = localStorage.getItem('tools_token');
            return token ? { Authorization: `Bearer ${token}` } : {};
        }
        async function updateSnapshotActions(slug) {
            document.getElementById('downloadReadonlyWrap').hidden = true;
            document.getElementById('publishReadonlyWrap').hidden = true;
            try {
                const response = await fetch('/api/department-reward-penalty/snapshot/settings', { headers: snapshotHeaders() });
                if (!response.ok) return;
                const settings = await response.json();
                if (currentCustomTool?.slug !== slug) return;
                const supported = (settings.tools || []).some(tool => tool.toolSlug === slug);
                document.getElementById('downloadReadonlyWrap').hidden = !supported;
                document.getElementById('publishReadonlyWrap').hidden = !supported;
            } catch (_) {}
        }
        function closeSnapshotMenus() {
            for (const name of ['downloadReadonly', 'publishReadonly']) {
                document.getElementById(name + 'Menu').hidden = true;
                document.getElementById(name + 'Tool').setAttribute('aria-expanded', 'false');
            }
        }
        function toggleSnapshotMenu(name) {
            const menu = document.getElementById(name + 'Menu');
            const opening = menu.hidden;
            closeSnapshotMenus();
            menu.hidden = !opening;
            document.getElementById(name + 'Tool').setAttribute('aria-expanded', String(opening));
        }
        async function downloadSnapshot(format) {
            const slug = currentCustomTool?.slug;
            if (!slug) return;
            const button = document.getElementById('downloadReadonlyTool');
            closeSnapshotMenus();
            button.disabled = true;
            try {
                const response = await fetch(`/api/department-reward-penalty/snapshot/download/${encodeURIComponent(slug)}?format=${format}`, { headers: snapshotHeaders() });
                if (!response.ok) { const body = await response.json().catch(() => ({})); throw new Error(body.error || `HTTP ${response.status}`); }
                const blobUrl = URL.createObjectURL(await response.blob());
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = format === 'pages' ? `${slug}-readonly-pages.zip` : `${slug}-readonly.html`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
            } catch (error) { showToast(error.message, 'error'); }
            finally { button.disabled = false; }
        }
        async function showSnapshotJobs() {
            closeSnapshotMenus();
            const slug = currentCustomTool?.slug;
            if (!slug) return;
            try {
                const response = await fetch('/api/department-reward-penalty/snapshot/jobs', { headers: snapshotHeaders() });
                const jobs = await response.json().catch(() => []);
                if (!response.ok) throw new Error(jobs.error || `HTTP ${response.status}`);
                const relevant = jobs.filter(job => !job.toolSlug || job.toolSlug === slug);
                const menu = document.getElementById('publishReadonlyMenu');
                menu.querySelectorAll('[data-snapshot-job], .tool-action-empty').forEach(node => node.remove());
                if (!relevant.length) {
                    const empty = document.createElement('div');
                    empty.className = 'tool-action-empty';
                    empty.textContent = shellText('暂无推送记录', 'No publishing runs yet');
                    menu.appendChild(empty);
                } else {
                    for (const job of relevant.slice(0, 5)) {
                        const item = document.createElement('button');
                        item.type = 'button';
                        item.dataset.snapshotJob = job.id;
                        const title = document.createElement('span');
                        title.textContent = `${job.status === 'success' ? '✓' : job.status === 'failed' ? '✕' : '…'} ${job.stage}`;
                        const detail = document.createElement('small');
                        detail.textContent = `${new Date(job.createdAt).toLocaleString()} · ${job.toolSlug || shellText('全部工具', 'All tools')}`;
                        item.append(title, detail);
                        menu.appendChild(item);
                    }
                }
                toggleSnapshotMenu('publishReadonly');
            } catch (error) { showToast(error.message, 'error'); }
        }
        document.getElementById('downloadReadonlyTool').addEventListener('click', () => toggleSnapshotMenu('downloadReadonly'));
        document.getElementById('publishReadonlyTool').addEventListener('click', () => toggleSnapshotMenu('publishReadonly'));
        document.getElementById('downloadReadonlyMenu').addEventListener('click', event => {
            const format = event.target.closest('[data-snapshot-download]')?.dataset.snapshotDownload;
            if (format) downloadSnapshot(format);
        });
        document.getElementById('publishReadonlyMenu').addEventListener('click', event => {
            const jobId = event.target.closest('[data-snapshot-job]')?.dataset.snapshotJob;
            if (jobId) { closeSnapshotMenus(); window.openSnapshotPublishProgress(jobId); return; }
            const action = event.target.closest('[data-snapshot-publish]')?.dataset.snapshotPublish;
            if (!action) return;
            if (action === 'logs') { showSnapshotJobs(); return; }
            closeSnapshotMenus();
            window.startSnapshotPublish({ toolSlug: currentCustomTool.slug, toolName: getCustomToolDisplayName(currentCustomTool), force: action === 'force' });
        });
        document.addEventListener('click', event => {
            if (!event.target.closest('.custom-tool-snapshot-actions')) closeSnapshotMenus();
        });
        document.getElementById('refreshToolButton')?.addEventListener('click', (e) => {
            e.preventDefault();
            const frame = document.querySelector('.custom-tool-frame');
            if (frame && currentCustomTool) {
                const path = currentCustomTool.filePath || '';
                frame.src = path.includes('?') ? `${path}&_t=${Date.now()}` : `${path}?_t=${Date.now()}`;
            } else {
                location.reload();
            }
        });
        window.addEventListener('beforeunload', () => toolLoadController?.abort());
    </script>
</body>
</html>

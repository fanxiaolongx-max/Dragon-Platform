<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数通协议专家</title>
    <script>
        (function () {
            var pref = 'system', dark = false;
            try { pref = localStorage.getItem('dk_theme') || 'system'; } catch (e) {}
            if (pref === 'dark') dark = true;
            else if (pref !== 'light') {
                try { dark = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches === true; } catch (e) {}
            }
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();
    </script>
    <link rel="stylesheet" href="./assets/app.css">
</head>
<body>
    <header class="dk-topbar">
        <button type="button" class="dk-icon-btn dk-nav-toggle" id="navToggle" aria-label="展开目录">☰</button>
        <a class="dk-brand" href="#/"><span class="dk-logo" aria-hidden="true">◈</span><span><b>数通协议专家</b><small>Datacom Protocol Expert · 可视化学习</small></span></a>
        <div class="dk-search">
            <input id="searchInput" type="search" placeholder="搜索协议、字段、命令，如 FA、P-bit、vrf-import…" aria-label="搜索知识库" autocomplete="off">
            <div id="searchResults" class="dk-search-results" hidden></div>
        </div>
        <button type="button" class="dk-btn ghost small dk-ai-toggle" id="aiPanelBtn" title="AI 问答与笔记侧栏">✦ AI 笔记<b></b></button>
        <button type="button" class="dk-btn ghost small" id="themeBtn">🌓 跟随系统</button>
    </header>
    <div class="dk-layout">
        <aside id="sidebar" class="dk-sidebar" aria-label="知识目录"></aside>
        <div class="dk-nav-resize" id="navResize" role="separator" aria-orientation="vertical" aria-controls="sidebar" tabindex="0" title="拖动调整目录宽度 · 双击收起/展开"><button type="button" class="dk-nav-collapse" id="navCollapse" aria-label="收起目录" title="收起目录"><i aria-hidden="true">‹</i></button></div>
        <main id="main" class="dk-main"><div class="dk-loading">正在加载知识库…</div></main>
        <aside id="aiPanel" class="dk-ai-panel" aria-label="AI 问答与笔记" hidden></aside>
    </div>
    <div id="modalRoot" hidden></div>
    <div id="toast" class="dk-toast-host" aria-live="polite"></div>
    <script src="./assets/vendor/marked.min.js"></script>
    <script type="module" src="./assets/app.js"></script>
</body>
</html>

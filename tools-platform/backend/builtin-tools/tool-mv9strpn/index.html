<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>译维Ezscan 仓储管理系统 · 服务器存储版</title>

<script src="/js/ezscan-warehouse-theme.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 12px; user-select: none; }
  body { width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: #eaedf1; color: #333; }

  /* 顶部导航栏 */
  .topbar { height: 42px; background: #1e78e6; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; flex-shrink: 0; }
  .topbar-left { display: flex; align-items: center; height: 100%; }
  .logo { font-size: 20px; font-weight: bold; letter-spacing: 1px; margin-right: 14px; display: flex; align-items: center; }
  .menu-toggle { font-size: 16px; cursor: pointer; margin-right: 18px; opacity: 0.9; }
  .top-tabs { display: flex; align-items: center; height: 100%; gap: 4px; }
  .top-tab { padding: 0 12px; height: 32px; border-radius: 3px; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #dceaff; transition: background 0.15s; font-size: 12px; }
  .top-tab:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .top-tab.active { background: rgba(0,0,0,0.16); color: #fff; font-weight: 500; }
  .top-tab .close-tab { margin-left: 4px; font-size: 11px; opacity: 0.7; }
  .top-tab .close-tab:hover { opacity: 1; color: #ffcccc; }

  .topbar-right { display: flex; align-items: center; gap: 18px; }
  .topbar-icon { cursor: pointer; font-size: 14px; opacity: 0.9; }
  .user-profile { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: #b0b8c1; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
  .user-info { line-height: 1.2; text-align: left; }
  .user-info .name { font-size: 12px; }
  .user-info .dept { font-size: 10px; opacity: 0.85; }

  /* 主体区域 */
  .main-wrapper { flex: 1; display: flex; overflow: hidden; }

  /* 左侧边栏 */
  .sidebar { width: 170px; background: #1c3650; color: #b8c7ce; display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: #34526f; }
  .nav-group { border-bottom: 1px solid rgba(255,255,255,0.03); }
  .nav-title { height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; cursor: pointer; color: #c2d0dc; transition: 0.15s; }
  .nav-title:hover { background: #15293e; color: #fff; }
  .nav-title-left { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .nav-title-left i { width: 16px; text-align: center; font-size: 14px; }
  .sub-menu { background: #132639; display: none; padding: 4px 0; }
  .nav-group.open > .sub-menu { display: block; }
  .nav-group.open > .nav-title .arrow { transform: rotate(180deg); }
  
  /* 二级文件夹与三级菜单 */
  .sub-folder { position: relative; }
  .sub-folder-title { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px 0 32px; cursor: pointer; color: #a8bccb; font-size: 12px; }
  .sub-folder-title:hover, .sub-folder.active > .sub-folder-title { background: #0e1e2e; color: #fff; }
  .sub-folder-leaf { background: #0c1824; display: none; }
  .sub-folder.open > .sub-folder-leaf { display: block; }
  .leaf-item { height: 30px; display: flex; align-items: center; padding-left: 46px; cursor: pointer; color: #92a8b9; font-size: 12px; }
  .leaf-item:hover, .leaf-item.active { color: #fff; background: #1e78e6; }

  /* 右侧内容工作区 */
  .workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f2f4f7; }
  .view-page { display: none; width: 100%; height: 100%; flex-direction: column; overflow: hidden; }
  .view-page.active { display: flex; }

  /* ====== 视图1：其他入库单（参照图2高保真还原） ====== */
  .sub-tabs-bar { height: 36px; background: #eef1f6; border-bottom: 2px solid #2b7de9; display: flex; align-items: flex-end; padding-left: 8px; gap: 4px; flex-shrink: 0; }
  .sub-tab { height: 32px; padding: 0 14px; background: #e2e6ed; border: 1px solid #d1d6df; border-bottom: none; border-radius: 3px 3px 0 0; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #555; }
  .sub-tab.active { background: #fff; color: #1e78e6; border-top: 2px solid #1e78e6; font-weight: bold; height: 34px; }
  
  /* 按钮工具条 */
  .action-bar { height: 42px; background: #f5f7fa; border-bottom: 1px solid #dcdfe6; display: flex; align-items: center; padding: 0 10px; gap: 6px; flex-shrink: 0; }
  .btn { height: 28px; padding: 0 12px; border-radius: 3px; border: 1px solid #ccc; background: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #444; }
  .btn:hover { opacity: 0.9; }
  .btn-icon-only { width: 26px; padding: 0; justify-content: center; background: #e9ecf2; border-color: #d0d5dd; }
  .btn-orange { background: #f5a623; border-color: #e59413; color: #fff; }
  .btn-green { background: #5cb85c; border-color: #4cae4c; color: #fff; }
  .btn-yellow { background: #f0ad4e; border-color: #eea236; color: #fff; }
  .btn-disabled { background: #ebedf0; border-color: #dadce0; color: #999; cursor: not-allowed; }

  /* 表单区域 */
  .form-section { background: #f2f3f5; padding: 10px 18px 8px 18px; border-bottom: 1px solid #dcdcdc; flex-shrink: 0; }
  .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 32px; row-gap: 6px; max-width: 1180px; }
  .form-row { display: flex; align-items: center; height: 26px; }
  .form-label { width: 68px; text-align: right; padding-right: 10px; color: #333; flex-shrink: 0; }
  .form-label.required { color: #1e62d0; }
  .form-control { flex: 1; display: flex; align-items: center; height: 25px; background: #e8eaed; border: 1px solid #ccc; border-radius: 2px; overflow: hidden; }
  .form-control.white { background: #fff; }
  .form-control input, .form-control select { width: 100%; height: 100%; border: none; background: transparent; padding: 0 8px; outline: none; font-size: 12px; color: #222; }
  .form-control .addon { width: 26px; height: 100%; display: flex; align-items: center; justify-content: center; border-left: 1px solid #ccc; color: #555; cursor: pointer; background: #e2e4e8; }
  .form-remark { grid-column: 1 / -1; display: flex; align-items: flex-start; margin-top: 2px; }
  .form-remark textarea { flex: 1; height: 50px; background: #e8eaed; border: 1px solid #ccc; border-radius: 2px; padding: 4px 8px; resize: none; outline: none; }

  /* 明细表区域 */
  .detail-section { flex: 1; display: flex; flex-direction: column; background: #f2f3f5; padding: 6px 10px; overflow: hidden; }
  .detail-title { font-weight: bold; color: #222; margin-bottom: 6px; padding-left: 2px; }
  .detail-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; flex-shrink: 0; }
  .detail-toolbar-left { display: flex; align-items: center; gap: 6px; }
  .barcode-input { width: 145px; height: 26px; border: 1px solid #ccc; background: #e8eaed; padding: 0 6px; border-radius: 2px; }
  .detail-toolbar-right { display: flex; align-items: center; gap: 6px; }
  .search-group { display: flex; align-items: center; height: 26px; border: 1px solid #ccc; background: #fff; border-radius: 2px; width: 210px; }
  .search-group input { flex: 1; border: none; padding: 0 8px; outline: none; }
  .search-group .addon { width: 26px; height: 100%; display: flex; align-items: center; justify-content: center; border-left: 1px solid #ccc; background: #eee; cursor: pointer; }

  /* 表格 */
  .table-container { flex: 1; border: 1px solid #d0d3d8; background: #efeff1; overflow: auto; display: flex; flex-direction: column; justify-content: space-between; }
  table.data-grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.data-grid th, table.data-grid td { border-right: 1px solid #dcdfe4; border-bottom: 1px solid #dcdfe4; height: 28px; padding: 0 8px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.data-grid th { background: #e6e8ec; color: #333; font-weight: normal; }
  table.data-grid th.req { color: #1e62d0; }
  table.data-grid td { background: #f5f6f8; }
  table.data-grid tr:hover td { background: #e8f0fe; }
  table.data-grid .col-idx { width: 34px; text-align: center; color: #666; }
  table.data-grid .col-chk { width: 32px; text-align: center; }
  table.data-grid .num { text-align: right; }

  /* ====== 视图2：首页图表看板（参照图1还原） ====== */
  .dashboard-grid { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px; overflow: hidden; }
  .dash-row-top { flex: 62; display: flex; gap: 8px; overflow: hidden; }
  .dash-row-bot { flex: 38; display: flex; gap: 8px; overflow: hidden; }
  .panel { background: #fff; border: 1px solid #dce1e7; display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { height: 34px; border-bottom: 1px solid #e5e9ef; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: #31708f; font-weight: 500; flex-shrink: 0; }
  .panel-filter { height: 38px; border-bottom: 2px solid #5aa5f0; display: flex; align-items: center; padding: 0 10px; gap: 8px; flex-shrink: 0; background: #fafafa; }
  .filter-box { display: inline-flex; align-items: center; border: 1px solid #ccc; height: 24px; background: #fff; }
  .filter-box input { width: 85px; border: none; outline: none; padding: 0 4px; }
  .filter-box i { padding: 0 6px; background: #eee; height: 100%; display: flex; align-items: center; border-left: 1px solid #ccc; cursor: pointer; }
  .panel-body { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .quick-item { height: 36px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; padding: 0 16px; gap: 8px; cursor: pointer; }
  .quick-item:hover { background: #f5f9ff; color: #1e78e6; }

  /* 弹窗提示 */
  .toast { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.78); color: #fff; padding: 8px 16px; border-radius: 4px; display: none; z-index: 999; }

function tabMenuActions(name){const tabs=db.ui.tabs,pinned=db.ui.pinned.includes(name),idx=tabs.indexOf(name),canClose=x=>!db.ui.pinned.includes(x);return `<div class="tab-menu-commands">${tabActionButton('关闭当前','close-one',name,pinned)}${tabActionButton('关闭其他','close-others',name,!tabs.some(x=>x!==name&&canClose(x)))}${tabActionButton('关闭右侧','close-right',name,!tabs.slice(idx+1).some(canClose))}${tabActionButton('关闭左侧','close-left',name,!tabs.slice(0,idx).some(canClose))}${tabActionButton('关闭未固定标签','close-all',name,!tabs.some(canClose))}${tabActionButton(pinned?'取消固定':'固定常用页面','pin',name,name==='首页')}${tabActionButton('重新打开最近关闭','reopen',name,!db.ui.closed.length)}${tabActionButton('标签设置','settings',name)}</div>`;}
function closeTabPopup(returnFocus=true){const popup=$('#tabPopup');if(!popup)return;popup.remove();$('#tabListButton')?.setAttribute('aria-expanded','false');if(returnFocus)tabPopupAnchor?.focus();tabPopupAnchor=null;}
function positionTabPopup(popup,anchor,point=null){const r=anchor?.getBoundingClientRect();const x=point?.x??(r?.right-popup.offsetWidth||12);const y=point?.y??(r?.bottom+6||80);popup.style.left=Math.max(8,Math.min(x,innerWidth-popup.offsetWidth-8))+'px';popup.style.top=Math.max(8,Math.min(y,innerHeight-popup.offsetHeight-8))+'px';}
function openTabPopup(name=moduleName,point=null){closeTabPopup(false);tabPopupAnchor=point?tabNode(name)?.querySelector('.tab-main'):$('#tabListButton');const popup=document.createElement('div');popup.id='tabPopup';popup.className='tab-popup';popup.setAttribute('role','dialog');popup.setAttribute('aria-label',point?'标签操作':'全部标签');popup.innerHTML=point?`<div class="tab-menu-title">${esc(name)}</div>${tabMenuActions(name)}`:`<div class="tab-menu-title"><b>全部标签</b><span>${db.ui.tabs.length} / ${db.settings.tabLimit}</span></div><div class="tab-search"><span aria-hidden="true">⌕</span><input id="tabSearch" placeholder="搜索页面名称" aria-label="搜索标签和页面"><kbd>Esc</kbd></div><div id="tabSearchResults" class="tab-search-results"></div>${tabMenuActions(name)}<div class="tab-menu-help">达到上限时收起最久未使用的非固定标签<br>关闭标签保留草稿与业务数据</div>`;
 document.body.appendChild(popup);if(!point)renderTabSearch('');positionTabPopup(popup,tabPopupAnchor,point);$('#tabListButton').setAttribute('aria-expanded','true');(popup.querySelector('input')||popup.querySelector('button:not(:disabled)'))?.focus();}
function tabSearchItem(name,label=''){const pinned=db.ui.pinned.includes(name),opened=db.ui.tabs.includes(name);return `<div class="tab-search-item ${name===moduleName?'current':''}"><button data-tab-action="switch" data-tab-target="${esc(name)}"><span>${pinned?'◆ ':''}${esc(name)}</span><small>${esc(label||tabGroup(name))}${name===moduleName?' · 当前':''}</small></button>${opened&&!pinned?`<button class="tab-item-close" data-tab-action="close-one" data-tab-target="${esc(name)}" aria-label="关闭${esc(name)}">×</button>`:''}</div>`;}
function renderTabSearch(q){const el=$('#tabSearchResults');if(!el)return;const text=q.trim().toLowerCase();if(text){const matches=['首页','业务流程图',...MODULES].filter(n=>n.toLowerCase().includes(text));el.innerHTML=matches.length?matches.map(n=>tabSearchItem(n,db.ui.tabs.includes(n)?'已打开':'打开页面')).join(''):'<div class="tab-search-empty">未找到页面，试试其他关键词</div>'}else{const recent=db.ui.recent.filter(n=>!db.ui.tabs.includes(n)).slice(0,4);el.innerHTML='<div class="tab-section-label">已打开</div>'+db.ui.tabs.map(n=>tabSearchItem(n)).join('')+(recent.length?'<div class="tab-section-label">最近访问</div>'+recent.map(n=>tabSearchItem(n,'点击重新打开')).join(''):'')}}
function tabSettings(){closeTabPopup(false);openModal('标签管理设置',`<div class="note">默认最多 8 个标签（包含首页）。达到上限时自动收起最久未使用的非固定标签；当前标签和固定标签会保留。</div><div class="modal-grid"><label>同时打开上限<select id="tabLimitSetting">${TAB_LIMITS.map(n=>`<option value="${n}" ${n===db.settings.tabLimit?'selected':''}>${n} 个${n===8?'（推荐）':''}</option>`).join('')}</select></label><div class="hint" style="padding-top:24px">首页始终固定。最多固定 3 个常用页面；上限为 5 时可固定 2 个。</div></div><div class="error-text" id="tabSettingsError"></div><div class="hint">标签状态、筛选条件和单据编辑位置保留在当前页面；“全部标签”可搜索所有页面，快捷键 Alt+K。</div>`,`${btn('取消','closeModal')}<button class="btn btn-blue" data-tab-action="save-settings">保存设置</button>`);}
function saveTabSettings(){const n=Number($('#tabLimitSetting').value);if(!TAB_LIMITS.includes(n))return;if(db.ui.pinned.length-1>Math.min(3,n-3))return $('#tabSettingsError').textContent='请先取消部分页面的固定，再降低标签数量上限';captureTabView();db.settings.tabLimit=n;normalizeTabs();captureTabView();closeModal();render();showToast('标签上限已设为 '+n+' 个（包含首页）');}
function handleTabAction(kind,name){if(kind==='switch')navigate(name);else if(kind.startsWith('close-'))closeTabs(kind.slice(6),name);else if(kind==='pin')pinTab(name);else if(kind==='reopen')reopenTab();else if(kind==='settings')tabSettings();else if(kind==='save-settings')saveTabSettings();else if(kind==='list'){if($('#tabPopup'))closeTabPopup();else openTabPopup()}else if(kind==='scroll-left'||kind==='scroll-right'){$('#topTabs').scrollBy({left:(kind==='scroll-left'?-1:1)*Math.max(120,$('#topTabs').clientWidth*.6),behavior:'smooth'})}}
// Capture tab controls before generic page events.
document.addEventListener('click',e=>{const control=e.target.closest('[data-tab-action]');if(control&&!control.disabled){e.preventDefault();e.stopImmediatePropagation();handleTabAction(control.dataset.tabAction,control.dataset.tabTarget||moduleName);return}const close=e.target.closest('[data-close]');if(close){e.preventDefault();e.stopImmediatePropagation();closeTabs('one',close.dataset.close);return}if($('#tabPopup')&&!e.target.closest('#tabPopup,#tabListButton'))closeTabPopup(false)},true);
document.addEventListener('contextmenu',e=>{const tab=e.target.closest('[data-tab-name]');if(tab){e.preventDefault();e.stopImmediatePropagation();openTabPopup(tab.dataset.tabName,{x:e.clientX,y:e.clientY})}},true);
document.addEventListener('input',e=>{if(e.target.id==='tabSearch')renderTabSearch(e.target.value)});
document.addEventListener('keydown',e=>{const popup=$('#tabPopup');if(e.altKey&&!e.ctrlKey&&!e.metaKey&&e.key.toLowerCase()==='k'&&!$('#modalMask')){e.preventDefault();e.stopImmediatePropagation();if(popup)closeTabPopup();else openTabPopup();return}if(popup){if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeTabPopup();return}if(['ArrowDown','ArrowUp','Enter'].includes(e.key)){const items=[...popup.querySelectorAll('.tab-search-item>button:first-child')];const index=items.indexOf(document.activeElement);if(e.key==='Enter'&&e.target.id==='tabSearch'){e.preventDefault();e.stopImmediatePropagation();items[0]?.click()}else if(items.length&&e.key!=='Enter'){e.preventDefault();e.stopImmediatePropagation();const next=e.key==='ArrowDown'?(index+1)%items.length:(index<=0?items.length-1:index-1);items[next].focus()}return}if(e.key==='Tab'){const els=[...popup.querySelectorAll('input,button:not(:disabled)')];if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0]?.focus()}}}
 const tab=e.target.closest('#topTabs .tab-main');if(!tab)return;const names=db.ui.tabs,i=names.indexOf(tab.closest('[data-tab-name]').dataset.tabName);if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const n=e.key==='Home'?names[0]:e.key==='End'?names.at(-1):names[(i+(e.key==='ArrowRight'?1:names.length-1))%names.length];navigate(n);tabNode(n)?.querySelector('.tab-main').focus()}if(e.key==='Delete'){e.preventDefault();closeTabs('one',names[i]);tabNode(moduleName)?.querySelector('.tab-main').focus()}},true);
window.addEventListener('resize',()=>{closeTabPopup(false);revealActiveTab();updateTabScroll()});

function toggleSidebar(){const s=$('#sidebar');s.style.display=s.style.display==='none'?'flex':'none'}
function toggleGroup(el){el.parentElement.classList.toggle('open')}
function toggleSubFolder(el){el.parentElement.classList.toggle('open')}
function renderNav(){
 document.querySelectorAll('#sidebar .leaf-item').forEach(el=>{const name=el.dataset.module||el.textContent.trim();el.removeAttribute('onclick');el.dataset.module=name;el.classList.toggle('active',name===moduleName);if(name===moduleName){el.closest('.nav-group')?.classList.add('open');el.closest('.sub-folder')?.classList.add('open')}});
 renderTabStrip();
}
function filters({status=[],warehouse=false,dates=false,product=false}={}){return `<div class="search-filter"><label>关键词</label><input id="q" value="${esc(query)}" placeholder="编码 / 名称 / 备注" style="width:210px">${status.length?`<label>状态</label><select id="filterStatus"><option value="">全部</option>${status.map(s=>`<option value="${esc(s)}" ${filterStatus===s?'selected':''}>${esc(s)}</option>`).join('')}</select>`:''}${warehouse?`<label>仓库</label><select id="filterWarehouse"><option value="">全部仓库</option>${db.warehouses.map(w=>`<option value="${w.id}" ${filterWarehouse===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select>`:''}${product?`<label>货品</label><select id="filterProduct" style="max-width:180px"><option value="">全部货品</option>${db.products.map(p=>`<option value="${esc(p.id)}" ${filterProduct===p.id?'selected':''}>${esc(p.code+' / '+p.name)}</option>`).join('')}</select>`:''}${dates?`<label>日期</label><input type="date" id="dateFrom" value="${dateFrom}"><span>至</span><input type="date" id="dateTo" value="${dateTo}">`:''}${btn('查询','search','btn-blue')}${btn('重置','resetFilters')}</div>`}
function filtered(rows){const q=query.trim().toLowerCase();let result=rows.filter(r=>(!q||Object.values(r).filter(v=>typeof v!=='object').join(' ').toLowerCase().includes(q))&&(!filterStatus||r.status===filterStatus)&&(!filterWarehouse||r.warehouse===filterWarehouse)&&(!filterProduct||r.product===filterProduct)&&(!dateFrom||r.date>=dateFrom)&&(!dateTo||r.date<=dateTo));if(sortKey)result.sort((a,b)=>{const av=a[sortKey],bv=b[sortKey];return sortDir*(typeof av==='number'?av-bv:String(av??'').localeCompare(String(bv??''),'zh-CN'))});return result}
let visibleRows=[], exportRows=[],tableColumns=[];
function table(rows,cols,rowActions=null,selectable=true){exportRows=filtered(rows);tableColumns=cols;const total=exportRows.length,pages=Math.max(1,Math.ceil(total/pageSize));page=Math.max(1,Math.min(page,pages));visibleRows=exportRows.slice((page-1)*pageSize,page*pageSize);
return `<div class="table-wrap"><table class="list-table"><thead><tr>${selectable?'<th style="width:35px"><input type="checkbox" id="selectAll" title="选择本页"></th>':'<th>#</th>'}${cols.map(c=>`<th data-sort="${c.key}" style="cursor:pointer">${esc(c.label)} ${sortKey===c.key?(sortDir===1?'↑':'↓'):'↕'}</th>`).join('')}${rowActions?'<th>操作</th>':''}</tr></thead><tbody>${visibleRows.length?visibleRows.map((r,i)=>`<tr data-row="${esc(r.id)}" class="${selected.has(r.id)?'selected':''}" title="${rowActions?'双击查看；右键打开操作菜单':''}"><td>${selectable?`<input type="checkbox" data-select="${esc(r.id)}" ${selected.has(r.id)?'checked':''}>`:(page-1)*pageSize+i+1}</td>${cols.map(c=>`<td class="${c.num?'num':''}">${c.render?c.render(r):esc(c.num?number(r[c.key]):r[c.key])}</td>`).join('')}${rowActions?`<td class="record-menu">${rowActions(r)}</td>`:''}</tr>`).join(''):`<tr><td class="empty" colspan="${cols.length+(rowActions?2:1)}">暂无匹配记录，请调整筛选条件${CONFIG[moduleName]||DOCS.includes(moduleName)?'或新增一条记录':''}。</td></tr>`}</tbody></table></div><div class="pager"><span>共 ${total} 条 · 已选 ${selected.size} 条${query||filterStatus||filterWarehouse||filterProduct||dateFrom||dateTo?' · 筛选结果':''}</span><div>${btn('上一页','prevPage','',page<=1)} <span>${page} / ${pages}</span> ${btn('下一页','nextPage','',page>=pages)} <select id="pageSize">${[12,25,50,100].map(n=>`<option ${n===pageSize?'selected':''}>${n}</option>`).join('')}</select> 条/页</div></div>`}
function rowBtn(label,action,id,cls='btn-link'){return `<button class="btn ${cls}" data-action="${action}" data-id="${esc(id)}">${label}</button>`}
const statusPill=s=>`<span class="pill ${['已审核','正常','已同步','已结清','启用'].includes(s)?'ok':['已提交','部分核销','待同步'].includes(s)?'pending':['库存不足','异常','停用','已逾期','仓库停用'].includes(s)?'warn':''}">${esc(s)}</span>`;
function render(){captureTabView();renderNav();const app=$('#app');visibleRows=[];exportRows=[];tableColumns=[];if(DOCS.includes(moduleName))app.innerHTML=docPage();else if(CONFIG[moduleName])app.innerHTML=masterPage();else if(moduleName==='总货品库存')app.innerHTML=stockPage();else if(moduleName==='出入明细清单')app.innerHTML=movementPage();else if(moduleName==='月度出入库统计')app.innerHTML=monthlyPage();else if(moduleName==='条码标签打印')app.innerHTML=labelPage();else if(moduleName==='业务流程图')app.innerHTML=flowPage();else app.innerHTML=homePage();updateStatus()}
function masterRows(){const cfg=CONFIG[moduleName];return db[cfg.key].map(r=>{const x={...r};if(r.enabled)x.status=r.enabled;for(const f of cfg.fields){if(['supplier','customer'].includes(f.type))x[f.key]=partnerName(r[f.key]);if(f.type==='warehouse')x.warehouseName=wname(r[f.key]);if(f.type==='product')x[f.key]=(find('products',r[f.key])?.code||'')+' '+pname(r[f.key])}if(['receivables','payables'].includes(cfg.key)){x.balance=EzscanWarehouseDomain.roundMoney(r.amount-r.paid);x.dueStatus=x.balance===0?'已结清':r.due<today()?'已逾期':'待到期';x.status=r.paid>=r.amount?'已结清':r.paid>0?'部分核销':'未核销'}return x})}
function masterPage(){const cfg=CONFIG[moduleName];const finance=['receivables','payables'].includes(cfg.key);const cols=cfg.fields.filter(f=>f.type!=='textarea'&&f.key!=='address'&&f.key!=='menus').map(f=>({key:f.type==='warehouse'?'warehouseName':f.key,label:f.label,num:f.type==='number',render:f.key==='enabled'||f.key==='status'?r=>statusPill(r[f.key]):null}));if(finance)cols.push({key:'balance',label:'未核销金额',num:true},{key:'status',label:'核销状态',render:r=>statusPill(r.status)},{key:'dueStatus',label:'到期状态',render:r=>statusPill(r.dueStatus)});
 return heading(cfg.desc)+`<div class="toolbar">${btn('＋ 新增','new','btn-orange')}${btn('编辑所选','editSelected')}${btn('删除所选','deleteSelected','btn-danger')}${btn('导出 CSV','export')}${btn('刷新','refresh')}${cfg.key==='scans'?btn('批量确认归档','syncScans','btn-green'):''}${btn('服务器数据 / 备份','dataPanel','right-tools')}</div>`+filters({status:finance?['未核销','部分核销','已结清']:cfg.key==='scans'?['待同步','已同步','异常']:cfg.key==='warehouses'||cfg.key==='workflows'||cfg.key==='roles'?['启用','停用']:[],warehouse:cfg.key==='scans'})+table(masterRows(),cols,r=>rowBtn('查看','view',r.id)+rowBtn('编辑','edit',r.id)+(finance?rowBtn('核销','settle',r.id)+(r.docId?rowBtn('源单据','sourceDoc',r.docId):''):cfg.key==='roles'?rowBtn('菜单预览','rolePreview',r.id):cfg.key==='workflows'?rowBtn('流程预览','flowPreview',r.id):'')+rowBtn('删除','delete',r.id));
}
function stockPage(){return heading('期初库存 + 已审核单据实时计算；草稿和已提交单据不影响库存。预警按各仓货品档案阈值判断。')+`<div class="toolbar">${btn('编辑所选期初','opening')}${btn('导出库存 CSV','export')}${btn('刷新','refresh')}${btn('服务器数据 / 备份','dataPanel','right-tools')}</div>`+filters({status:['正常','库存不足','仓库停用'],warehouse:true,product:true})+table(stockRows(),[{key:'warehouseName',label:'仓库'},{key:'code',label:'货品编码'},{key:'name',label:'货品名称'},{key:'spec',label:'规格'},{key:'unit',label:'单位'},{key:'qty',label:'现存数量',num:true},{key:'value',label:'参考货值',num:true},{key:'min',label:'预警阈值',num:true},{key:'status',label:'库存状态',render:r=>statusPill(r.status)}],r=>rowBtn('流水','stockHistory',r.id)+rowBtn('期初','opening',r.id))}
function movementPage(){return heading('仅显示已审核单据的实际库存变动；调拨有出入两条流水，反审核后对应流水自动撤销。')+`<div class="toolbar">${btn('导出流水 CSV','export')}${btn('刷新','refresh')}</div>`+filters({warehouse:true,dates:true,product:true})+table(movementRows(),[{key:'date',label:'业务日期'},{key:'no',label:'单据编号'},{key:'type',label:'业务类型'},{key:'warehouseName',label:'仓库'},{key:'code',label:'货品编码'},{key:'name',label:'货品名称'},{key:'direction',label:'方向'},{key:'qty',label:'变动数量',num:true},{key:'unit',label:'单位'},{key:'operator',label:'操作人'}],r=>rowBtn('源单据','sourceDoc',r.docId),false)}
function monthlyRows(){const map=new Map();for(const r of movementRows()){const month=r.date.slice(0,7),key=month+'|'+r.warehouse+'|'+r.product;let x=map.get(key);if(!x){x={id:key,month,product:r.product,warehouse:r.warehouse,warehouseName:r.warehouseName,code:r.code,name:r.name,unit:r.unit,inQty:0,outQty:0,count:0};map.set(key,x)}if(r.qty>=0)x.inQty+=r.qty;else x.outQty-=r.qty;x.count++}return [...map.values()].map(r=>({...r,net:r.inQty-r.outQty})).sort((a,b)=>b.month.localeCompare(a.month)||a.code.localeCompare(b.code))}

function homePage(){const st=stockRows(),pending=db.docs.filter(d=>d.status==='已提交').length,low=st.filter(x=>x.status==='库存不足').length,recv=db.receivables.reduce((s,r)=>s+r.amount-r.paid,0),pay=db.payables.reduce((s,r)=>s+r.amount-r.paid,0);const ms=monthlyRows();const max=Math.max(1,...ms.map(x=>Math.max(x.inQty,x.outQty)));return heading('实时读取服务器业务数据，点击卡片或快捷入口进入对应模块。')+`<div class="toolbar">${btn('刷新看板','refresh')}${btn('服务器数据 / 备份','dataPanel')}${btn('紧凑 / 标准行高','compact')}</div><div class="content-scroll"><div class="kpis"><div class="kpi" data-module="其他入库单" style="cursor:pointer">业务单据<strong>${db.docs.length}</strong><div class="hint">待审核 ${pending} 张</div></div><div class="kpi" data-module="总货品库存" style="cursor:pointer">库存预警<strong>${low}</strong><div class="hint">仓库 × 货品组合</div></div><div class="kpi" data-module="应收账款" style="cursor:pointer">应收余额<strong>${money(recv)}</strong></div><div class="kpi" data-module="应付账款" style="cursor:pointer">应付余额<strong>${money(pay)}</strong></div></div><div class="cards"><div class="card"><h2>月度出入库数量</h2><div class="hint">蓝色：入库 / 橙色：出库，按业务日期分组</div>${ms.slice(0,6).map(x=>`<div class="chart-row"><span class="chart-label">${x.month}<br>${esc(x.warehouseName)}<br>${esc(x.name)} / ${esc(x.unit)}</span><div style="flex:1"><div class="chart-track"><div class="chart-bar" style="width:${x.inQty/max*100}%"></div></div><div class="chart-track" style="margin-top:3px"><div class="chart-bar" style="width:${x.outQty/max*100}%;background:#eda854"></div></div></div><span>${number(x.inQty)} / ${number(x.outQty)}</span></div>`).join('')||'<p class="empty">暂无已审核流水</p>'}</div><div class="card"><h2>常用操作</h2><div class="quick-grid">${['采购订单','采购收货单','其他入库单','其他出库单','盘点单','总货品库存','货品档案','应付账款','月度出入库统计'].map(m=>`<button class="btn" data-module="${m}">${m}</button>`).join('')}</div><h2 style="margin-top:20px">待审核单据</h2>${db.docs.filter(d=>d.status==='已提交').slice(0,5).map(d=>`<div class="audit-list"><div>${rowBtn(d.no,'sourceDoc',d.id)} ${esc(d.type)  const count=moduleName==='盘点单',convert=moduleName==='形态转换单';const s=stockMap();h+=`<div class="table-wrap"><table class="list-table" id="lineTable"><thead><tr><th><input type="checkbox" id="allLines" ${lock}></th><th>#</th><th>货品编码</th><th>货品名称</th><th>规格 / 单位</th><th>${count?'账面库存':convert?'源数量 *':'数量 *'}</th><th>${count?'实盘数量 *':'单价'}</th>${convert?'<th>目标货品 *</th><th>目标数量 *</th>':''}<th>${count?'差异':'金额'}</th><th>操作</th></tr></thead><tbody>${d.lines.map((l,i)=>{const p=find('products',l.product),q=count&&d.status==='已审核'?Number(l.actual)-(d.countEffects?.find(e=>e.product===l.product)?.qty||0):(s.get(l.product+'|'+d.warehouse)||0);return `<tr data-line="${l.id}"><td><input type="checkbox" data-line-select="${l.id}" ${lock}></td><td>${i+1}</td><td>${esc(p?.code)}</td><td>${esc(p?.name)}</td><td>${esc(p?.spec)} / ${esc(p?.unit)}</td><td>${count?number(q):`<input type="number" min="0.0001" step="any" data-line-id="${l.id}" data-line-key="qty" value="${l.qty}" ${lock}>`}</td><td><input type="number" min="0" step="any" data-line-id="${l.id}" data-line-key="${count?'actual':'price'}" value="${count?l.actual:l.price}" ${lock}></td>${convert?`<td><select data-line-id="${l.id}" data-line-key="targetProduct" ${lock}>${opts(db.products,l.targetProduct)}</select></td><td><input type="number" min="0.0001" step="any" data-line-id="${l.id}" data-line-key="targetQty" value="${l.targetQty}" ${lock}></td>`:''}<td class="num" data-line-total="${l.id}">${count?number(Number(l.actual)-q):money(l.qty*l.price)}</td><td>${editable?rowBtn('删除','removeLine',l.id):'<span class="hint">已锁定</span>'}</td></tr>`}).join('')||`<tr><td class="empty" colspan="${convert?11:9}">暂无明细，请添加货品或扫描条码。</td></tr>`}</tbody></table></div><div class="pager"><span id="lineSummary">${esc(lineSummary(d))}</span><span>${d.source?'来源：'+esc(d.source):'库存仅在审核后生效'}</span></div>`;return h;

function quantityText(d){const totals=new Map();for(const line of d.lines){const unit=find('products',line.product)?.unit||'未设置单位';totals.set(unit,(totals.get(unit)||0)+Number(d.type==='盘点单'?line.actual:line.qty||0))}return [...totals].map(([unit,qty])=>number(qty)+' '+unit).join(' / ')||'—'}
function lineSummary(d){return `共 ${d.lines.length} 项 · ${d.type==='盘点单'?'实盘':'数量'} ${quantityText(d)}${d.type==='盘点单'?'':' · 金额 '+money(amount(d))}`}
function refreshTotals(){const d=currentDoc();if(!d)return;$('#docAmount').value=money(amount(d));$('#docUpdated').value=new Date(d.updated).toLocaleString('zh-CN');$('#lineSummary').textContent=lineSummary(d);const s=stockMap();d.lines.forEach(l=>{const e=document.querySelector(`[data-line-total="${l.id}"]`);if(e)e.textContent=d.type==='盘点单'?number(Number(l.actual)-(s.get(l.product+'|'+d.warehouse)||0)):money(l.qty*l.price)})}

function newDoc(copy=null,type=moduleName){const wh=db.warehouses.find(w=>w.enabled==='启用');if(!wh)return showToast('请先启用或新增一个仓库');captureTabView();if(!ensureTab(type))return;closeTabPopup(false);const d={id:uid(),type,no:newNo(type),date:today(),warehouse:wh.id,target:db.warehouses.find(w=>w.id!==wh.id&&w.enabled==='启用')?.id||wh.id,partner:'',operator:storage.getStatus().username||'管理员',status:'草稿',remark:'',lines:[],created:new Date().toISOString(),updated:new Date().toISOString()};if(copy){Object.assign(d,{warehouse:copy.warehouse,target:copy.target,partner:copy.partner,remark:copy.remark,lines:copy.lines.map(l=>({...l,id:uid(),sn:[]}))})}db.docs.unshift(d);currentId=d.id;moduleName=type;rememberVisit(type);mode='form';log('新增单据',d.no);persist();render();showToast('已新建草稿，修改会自动保存',true)}
function docValidation(d){const businessError=EzscanWarehouseDomain.documentError(db,d);if(businessError)return businessError;if(!validDate(d.date))return '请选择有效业务日期';if(!d.operator?.trim())return '请填写操作人';if(!find('warehouses',d.warehouse)||find('warehouses',d.warehouse).enabled!=='启用')return '请选择启用的仓库';if((d.type.startsWith('采购')||d.type.startsWith('销售'))&&!d.partner)return '请选择供应商或客户';if(d.type==='库存调拨单'&&(!find('warehouses',d.target)||find('warehouses',d.target).enabled!=='启用'||d.target===d.warehouse))return '请选择不同的启用目标仓库';if(!d.lines.length)return '请至少添加一条货品明细';const seen=new Set();for(const l of d.lines){if(!find('products',l.product))return '明细中存在无效货品';if(d.type==='盘点单'){if(!Number.isFinite(Number(l.actual))||l.actual===''||Number(l.actual)<0)return '实盘数量必须为零或正数';if(seen.has(l.product))return '盘点单中同一货品不可重复';seen.add(l.product)}else if(!Number.isFinite(Number(l.qty))||Number(l.qty)<=0)return '数量必须为正数';if(l.price===''||!Number.isFinite(Number(l.price))||Number(l.price)<0)return '单价不能为负数或空值';if(d.type==='形态转换单'&&(!find('products',l.targetProduct)||l.targetProduct===l.product||!Number.isFinite(Number(l.targetQty))||Number(l.targetQty)<=0))return '转换目标货品必须与源货品不同，目标数量必须为正数'}return ''}
async function saveDoc(){if(!writable())return showToast(writeBlockedMessage());const d=currentDoc();if(!d||d.status!=='草稿')return;const error=docValidation(d);if(error)return showToast(error);d.updated=new Date().toISOString();log('保存单据',d.no);if(await confirmSave('单据已保存到服务器',persist(true)))refreshTotals()}
async function setStatus(action){if(!writable())return showToast(writeBlockedMessage());if(storeError)return showToast('请先重试保存当前修改：'+storeError);const d=currentDoc();if(!d)return;let next=d.status;if(action==='submitDoc'){if(d.status!=='草稿')return;const e=docValidation(d);if(e)return showToast(e);next='已提交'}if(action==='withdrawDoc'){if(d.status!=='已提交')return;next='草稿'}if(action==='approveDoc'){if(d.status!=='已提交')return;const e=docValidation(d);if(e)return showToast(e);const candidate={...d,status:'已审核'};if(d.type==='盘点单'){const s=stockMap();candidate.countEffects=d.lines.map(l=>({product:l.product,warehouse:d.warehouse,qty:Number(l.actual)-(s.get(l.product+'|'+d.warehouse)||0)}))}const m=stockMap();for(const x of effects(candidate)){const k=x.product+'|'+x.warehouse;m.set(k,(m.get(k)||0)+x.qty)}for(const[k,v]of m)if(v< -1e-8)return showToast('库存不足：'+pname(k.split('|')[0])+' / '+wname(k.split('|')[1]));if(!confirm('审核 '+d.no+'？审核后将按该业务规则生效。'))return;d.countEffects=candidate.countEffects;next='已审核';}
 if(action==='unapproveDoc'){if(d.status!=='已审核')return;if(db.docs.some(x=>x.sourceId===d.id))return showToast('该订单已有执行单，请先撤销并删除执行单后再反审核');const m=stockMap(d.id);if([...m.values()].some(v=>v< -1e-8))return showToast('后续业务已消耗该单库存，当前不能反审核');const linked=[...db.receivables,...db.payables].filter(r=>r.docId===d.id);if(linked.some(r=>r.paid>0))return showToast('关联账单已有收付款，请先撤销其核销记录');if(!confirm('反审核将撤销本单库存流水及自动生成的未核销账单，继续？'))return;db.receivables=db.receivables.filter(r=>r.docId!==d.id);db.payables=db.payables.filter(r=>r.docId!==d.id);d.countEffects=null;next='草稿'}d.status=next;d.updated=new Date().toISOString();if(next==='已审核'&&['采购收货单','采购入库单','销售发货单'].includes(d.type)&&amount(d)>0&&d.partner){const key=d.type==='销售发货单'?'receivables':'payables';if(!db[key].some(r=>r.docId===d.id))db[key].unshift({id:uid(),docId:d.id,code:(key==='payables'?'AP-':'AR-')+d.no,source:d.no,partner:d.partner,date:d.date,due:d.date,amount:amount(d),paid:0,payments:[],remark:'由已审核收发货单生成'})}log({'草稿':'撤回 / 反审核','已提交':'提交单据','已审核':'审核单据'}[next],d.no);const saving=persist(true);render();return confirmSave('状态已更新为 '+next+'，已保存到服务器',saving)}
function showDoc(id){const d=find('docs',id);if(!d)return;captureTabView();if(!ensureTab(d.type))return;closeTabPopup(false);moduleName=d.type;currentId=id;mode='form';rememberVisit(d.type);resetFilters();captureTabView();render()}
function addLines(products,qty=1){const d=currentDoc();if(!d||d.status!=='草稿')return;for(const p of products){if(d.type==='盘点单'&&d.lines.some(l=>l.product===p.id))continue;const existing=d.lines.find(l=>l.product===p.id);if(existing&&d.type!=='盘点单'){existing.qty=Number(existing.qty||0)+qty;existing.sn=[];continue}d.lines.push({id:uid(),product:p.id,qty,price:p.price,targetProduct:db.products.find(x=>x.id!==p.id)?.id||p.id,targetQty:qty,actual:stockMap().get(p.id+'|'+d.warehouse)||0,sn:[]})}d.updated=new Date().toISOString();persist();closeModal();render()}
function pickProducts(){openModal('选择货品',`<input id="pickQ" placeholder="查找编码 / 名称" style="width:100%;padding:8px;border:1px solid #cbd5e2;margin-bottom:12px"><table class="list-table"><thead><tr><th>选择</th><th>编码</th><th>名称</th><th>规格 / 单位</th><th>价格</th></tr></thead><tbody>${db.products.map(p=>`<tr class="pick-row" data-pick-search="${esc(p.code+' '+p.name)}"><td><input type="checkbox" name="pickProduct" value="${p.id}"></td><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.spec)} / ${esc(p.unit)}</td><td>${money(p.price)}</td></tr>`).join('')}</tbody></table>`,`${btn('取消','closeModal')}${btn('添加所选','confirmProducts','btn-blue')}`)}
function scanLine(){if(!writable())return showToast(writeBlockedMessage());const d=currentDoc();if(!d||d.status!=='草稿')return;const code=$('#scanInput').value.trim();if(!code)return showToast('请输入货品条码');const p=db.products.find(p=>p.code===code);if(!p)return showToast('未找到条码，请先在货品档案登记');const line=d.lines.find(l=>l.product===p.id);if(line&&d.type!=='盘点单'){line.qty=Number(line.qty)+1;line.sn=[];d.updated=new Date().toISOString();persist();render()}else addLines([p]);db.scans.unshift({id:uid(),code:p.id,warehouse:d.warehouse,qty:1,device:'浏览器扫码',operator:d.operator,time:today()+'T'+new Date().toTimeString().slice(0,5),status:'已同步',remark:'关联 '+d.no});log('扫码添加',code+' → '+d.no);persist();$('#scanInput').focus();showToast('已添加 '+p.name,true)}
function deleteRecord(id,silent=false){if(DOCS.includes(moduleName)){const d=find('docs',id);if(!d)return false;if(d.status!=='草稿'){showToast('仅草稿单据可删除');return false}if(db.docs.some(x=>x.sourceId===id)){showToast('该订单已生成执行单，请先处理执行单');return false}if(!silent&&!confirm('删除草稿 '+d.no+'？'))return false;db.docs=db.docs.filter(x=>x.id!==id);log('删除单据',d.no);if(currentId===id){currentId=null;mode='list'}}else{const cfg=CONFIG[moduleName],r=find(cfg.key,id);if(!r)return false;const ref=referenceError(cfg.key,id);if(ref){showToast(ref);return false}if(!silent&&!confirm('删除 '+(r.name||r.code)+'？'))return false;db[cfg.key]=db[cfg.key].filter(x=>x.id!==id);if(cfg.key==='products')db.opening=db.opening.filter(x=>x.product!==id);if(cfg.key==='warehouses')db.opening=db.opening.filter(x=>x.warehouse!==id);log('删除资料',moduleName+' / '+(r.name||r.code))}selected.delete(id);if(!silent){persist();render()}return true}
function referenceError(key,id){if(key==='products'&&(db.docs.some(d=>d.lines.some(l=>l.product===id||l.targetProduct===id))||db.scans.some(s=>s.code===id)||db.opening.some(x=>x.product===id&&x.qty!==0)))return '货品被单据、扫码记录或非零期初库存引用，不能删除';if(key==='warehouses'&&(db.docs.some(d=>d.warehouse===id||d.target===id)||db.scans.some(s=>s.warehouse===id)||db.opening.some(x=>x.warehouse===id&&x.qty!==0)))return '仓库被单据、扫码记录或非零期初库存引用，不能删除';if(key==='partners'&&(db.docs.some(d=>d.partner===id)||[...db.receivables,...db.payables].some(r=>r.partner===id)))return '往来单位仍被业务单据或资金账单引用，不能删除';if(['receivables','payables'].includes(key)){const r=find(key,id);if(r.docId)return '该账单由业务单据生成，请通过源单反审核撤销';if(r.paid>0)return '账单已有核销记录，请先撤销核销'}return ''}
function openModal(title,body,foot=''){if(modalDirty&&!confirm('放弃当前弹窗中尚未保存的内容？'))return;closeModal();const el=document.createElement('div');el.id='modalMask';el.className='modal-mask';el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="btn btn-link" data-action="closeModal" title="关闭">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot||btn('关闭','closeModal')}</div></div>`;document.body.appendChild(el);modalDirty=false;updateStatus();const f=el.querySelector('input:not([type=checkbox]),select,textarea');f?.focus()}

function optionsFor(f){if(f.options)return f.options.map(x=>({value:x,label:x}));if(f.type==='warehouse')return db.warehouses.map(x=>({value:x.id,label:x.name}));if(f.type==='product')return db.products.map(x=>({value:x.id,label:x.code+' / '+x.name}));if(['supplier','customer'].includes(f.type))return db.partners.filter(p=>p.type.includes(f.type==='supplier'?'供应商':'客户')).map(x=>({value:x.id,label:x.name}));return null}

async function saveMaster(){if(!writable())return showToast(writeBlockedMessage());const form=$('#masterForm'),cfg=CONFIG[moduleName],id=form.dataset.id,r=id?find(cfg.key,id):null,data={...(r||{}),id:id||uid()};for(const f of cfg.fields){const v=form.elements.namedItem(f.key).value.trim();if(f.required&&!v)return $('#formError').textContent='请填写 '+f.label;if(f.type==='number'&&(!Number.isFinite(Number(v))||Number(v)<0))return $('#formError').textContent=f.label+' 必须为非负数';if(v.length>(f.key==='code'?100:f.key==='name'?200:10000))return $('#formError').textContent=f.label+' 超出长度限制';data[f.key]=f.type==='number'?Number(v):v}if(cfg.key!=='scans'&&data.code&&db[cfg.key].some(x=>x.id!==data.id&&x.code===data.code))return $('#formError').textContent='编码已存在，请使用唯一编码';if(cfg.key==='warehouses'&&db.warehouses.some(x=>x.id!==data.id&&x.name===data.name))return $('#formError').textContent='仓库名称不能重复';if(cfg.key==='scans'&&find('warehouses',data.warehouse)?.enabled!=='启用')return $('#formError').textContent='请选择启用的仓库';if(cfg.key==='scans'&&data.qty<=0)return $('#formError').textContent='扫描数量必须大于零';if(['receivables','payables'].includes(cfg.key)){if(data.amount<=0||data.paid>data.amount)return $('#formError').textContent='账单金额必须大于零，核销金额不能超出账单金额';if(data.due<data.date)return $('#formError').textContent='到期日期不能早于账单日期';if(!data.payments)data.payments=[];if(!id&&data.paid>0)data.payments.push({id:uid(),amount:data.paid,time:new Date().toISOString(),remark:'初始核销金额'})}if(['receivables','payables'].includes(cfg.key)&&[data.amount,data.paid].some(v=>Math.abs(v-EzscanWarehouseDomain.roundMoney(v))>1e-8))return $('#formError').textContent='金额最多保留两位小数';if(cfg.key==='products'&&r&&data.unit!==r.unit&&db.docs.some(d=>d.lines.some(l=>l.product===id||l.targetProduct===id)))return $('#formError').textContent='货品已有业务单据，不能修改计量单位；请新建货品档案';const candidate={...db,[cfg.key]:id?db[cfg.key].map(x=>x.id===id?data:x):[...db[cfg.key],data]};const error=EzscanWarehouseDomain.businessError(candidate);if(error)return $('#formError').textContent=error;if(id)db[cfg.key]=db[cfg.key].map(x=>x.id===id?data:x);else db[cfg.key].unshift(data);log(id?'编辑资料':'新增资料',moduleName+' / '+(data.name||data.code));persist();closeModal();render();await confirmSave('已保存到服务器',storage.flush())}
function viewRecord(id){if(DOCS.includes(moduleName))return showDoc(id);if(!CONFIG[moduleName])return;const cfg=CONFIG[moduleName],r=find(cfg.key,id);openModal(moduleName+' · 详情',`<div class="detail-values">${cfg.fields.map(f=>{let v=r[f.key];if(f.type==='warehouse')v=wname(v);if(f.type==='product')v=pname(v);if(['customer','supplier'].includes(f.type))v=partnerName(v);return `<p><b>${esc(f.label)}</b>${esc(v)}</p>`}).join('')}</div>`,`${rowBtn('编辑','edit',id,'btn-blue')}${btn('关闭','closeModal')}`)}

async function confirmSettle(id){const r=find(CONFIG[moduleName].key,id),v=Number($('#settleAmount').value);if(!Number.isFinite(v)||v<=0||Math.abs(v-EzscanWarehouseDomain.roundMoney(v))>1e-8||v>Number((r.amount-r.paid).toFixed(8)))return $('#settleError').textContent='请输入最多两位小数、大于零且不超过余额的金额';r.payments??=[];r.payments.push({id:uid(),amount:v,time:new Date().toISOString(),remark:$('#settleRemark').value});r.paid=EzscanWarehouseDomain.roundMoney(r.paid+v);log('资金核销',r.code+' / '+money(v));persist();closeModal();render();await confirmSave('核销记录已保存到服务器',storage.flush())}

const CODE39={ '0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn','K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn','U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','$':'nwnwnwnnn','/':'nwnwnnnwn','+':'nwnnnwnwn','%':'nnnwnwnwn','*':'nwnnwnwnn'};
function barcode(code){if(!code||[...code].some(c=>c==='*'||!CODE39[c]))return '<div class="error-text">该编码不支持 Code 39，请使用大写字母、数字或 - . 空格 $ / + %</div>';let x=10,bars='';for(const c of '*'+code+'*'){[...CODE39[c]].forEach((p,i)=>{const width=p==='w'?3:1;if(i%2===0)bars+=`<rect x="${x}" y="0" width="${width}" height="50"/>`;x+=width});x++}return `<svg role="img" aria-label="Code 39 条码 ${esc(code)}" viewBox="0 0 ${x+10} 50" preserveAspectRatio="none">${bars}</svg>`}
function labelPage(){return heading('按货品档案生成可扫描的 Code 39 标签；选择货品与打印份数后预览，再调用浏览器打印。')+`<div class="toolbar">${btn('预览所选标签','previewLabels','btn-blue')}${btn('导出档案 CSV','export')}${btn('刷新','refresh')}<label>每种货品份数 <input id="labelCopies" type="number" min="1" max="50" value="1" style="width:70px"></label></div>`+filters()+table(db.products,[{key:'code',label:'条码 / 编码'},{key:'name',label:'名称'},{key:'spec',label:'规格'},{key:'unit',label:'单位'},{key:'category',label:'分类'}],r=>rowBtn('预览','previewLabel',r.id))}
function previewLabels(id=null){const ids=id?[id]:[...selected];if(!ids.length)return showToast('请先选择货品');const n=id?1:Math.floor(Number($('#labelCopies').value));if(!Number.isFinite(n)||n<1||n>50||n*ids.length>300)return showToast('每种货品限 1–50 份，总计不超过 300 份');const labels=ids.flatMap(id=>Array.from({length:n},()=>find('products',id))).filter(Boolean);openModal('条码标签打印预览',`<div class="hint no-print" style="margin-bottom:10px">Code 39 · 使用实际条码尺寸打印，避免缩放过小；自定义纸张在浏览器打印设置中选择。</div><div class="label-preview">${labels.map(p=>`<div class="barcode-label"><h3 style="font-size:14px;margin-bottom:8px">${esc(p.name)}</h3>${barcode(p.code)}<p style="margin:6px 0;font-family:monospace;letter-spacing:1px">${esc(p.code)}</p><div>${esc(p.spec)} / ${esc(p.unit)}</div></div>`).join('')}</div>`,`${btn('关闭','closeModal')}${btn('打印标签','printLabels','btn-blue')}`)}
function generateSN(){const d=currentDoc();if(!d||d.status!=='草稿')return;const e=docValidation(d);if(e)return showToast(e);if(d.lines.some(l=>!Number.isInteger(Number(l.qty))||l.qty>1000))return showToast('序列号生成要求整数数量，每行不超过 1000');d.lines.forEach((l,i)=>{l.sn=Array.from({length:Number(l.qty)},(_,j)=>d.no+'-'+String(i+1).padStart(2,'0')+'-'+String(j+1).padStart(4,'0'))});d.updated=new Date().toISOString();log('生成序列号',d.no);persist();showToast('已生成序列号，可查看或导出清单',true)}

function csvCell(v){let s=String(v??'');if(/^[\s]*[=+@-]/.test(s)&&typeof v!=='number')s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
function exportCSV(name,cols,rows){download(name+'_'+today()+'.csv','\uFEFF'+[cols.map(c=>csvCell(c.label)).join(','),...rows.map(r=>cols.map(c=>csvCell(r[c.key])).join(','))].join('\r\n'),'text/csv;charset=utf-8');showToast('已导出 '+rows.length+' 条记录')}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV 引号未闭合');if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}return rows.filter(r=>r.some(v=>v.trim()))}
function lineCSV(){const d=currentDoc();return d.lines.map(l=>({code:find('products',l.product)?.code,qty:l.qty,price:l.price,actual:l.actual,targetCode:find('products',l.targetProduct)?.code,targetQty:l.targetQty}))}
const LINE_COLS=[{key:'code',label:'货品编码'},{key:'qty',label:'数量'},{key:'price',label:'单价'},{key:'actual',label:'实盘数量'},{key:'targetCode',label:'目标货品编码'},{key:'targetQty',label:'目标数量'}];
async function importLinesFile(file){if(!writable())return showToast(writeBlockedMessage());const d=currentDoc();if(!d||d.status!=='草稿')return;if(file.size>2*1024*1024)return showToast('明细 CSV 文件不得超过 2 MB');try{const rows=parseCSV(await file.text());if(!writable())return showToast(writeBlockedMessage());if(currentDoc()!==d||d.status!=='草稿'||!db.docs.includes(d))return showToast('当前单据已变更，请重新选择文件导入');if(!rows.length)throw Error('文件为空');const headers=rows.shift().map(x=>x.trim());if(new Set(headers).size!==headers.length)throw Error('CSV 表头不能重复');if(!headers.includes('货品编码'))throw Error('请使用下载的明细模板（UTF-8 CSV）');if(rows.length>1000)throw Error('每次最多导入 1000 条明细');if(d.lines.length+rows.length>3000)throw Error('单据明细总数不能超过 3000 条');const imported=rows.map((row,i)=>{const obj=Object.fromEntries(headers.map((h,j)=>[h,(row[j]??'').trim()]));const product=db.products.find(p=>p.code===obj['货品编码']);if(!product)throw Error('第 '+(i+2)+' 行货品编码不存在');const qty=Number(obj['数量']),price=obj['单价']==null||obj['单价']===''?product.price:Number(obj['单价']),actual=Number(obj['实盘数量']),target=db.products.find(p=>p.code===obj['目标货品编码']);return {id:uid(),product:product.id,qty,price,actual:obj['实盘数量']==null||obj['实盘数量']===''?(d.type==='盘点单'?NaN:0):actual,targetProduct:target?.id||'',targetQty:obj['目标数量']==null||obj['目标数量']===''?0:Number(obj['目标数量']),sn:[]}});const check={...d,lines:[...d.lines,...imported]};const error=docValidation(check);if(error)throw Error(error);d.lines.push(...imported);d.updated=new Date().toISOString();log('导入明细',d.no+' / '+imported.length+' 项');persist();render();showToast('已导入 '+imported.length+' 条明细')}catch(e){showToast('导入失败：'+e.message)}}
function askFile(accept,callback){const input=document.createElement('input');input.type='file';input.accept=accept;input.onchange=()=>{if(input.files[0])callback(input.files[0])};input.click()}
function validateBackup(d){const fail=s=>{throw Error('备份数据不合法：'+s)};if(!d||typeof d!=='object'||d.schema!==SCHEMA)fail('仅支持本版本导出的 JSON');for(const key of ['products','warehouses','partners','opening','docs','scans','receivables','payables','workflows','roles','logs'])if(!Array.isArray(d[key])||d[key].length>50000)fail(key+' 不是有效数组或超出限制');if(!d.ui||!Array.isArray(d.ui.tabs)||!d.settings||typeof d.settings.compact!=='boolean')fail('缺少界面配置');if(d.ui.tabs.length>50||d.ui.tabs.some(x=>!MODULES.includes(x)&&!['首页','业务流程图'].includes(x))||new Set(d.ui.tabs).size!==d.ui.tabs.length)fail('标签页配置无效');const ids={};for(const key of ['products','warehouses','partners','docs','scans','receivables','payables','workflows','roles']){ids[key]=new Set();const codes=new Set();for(const r of d[key]){if(!r||typeof r!=='object'||typeof r.id!=='string'||!/^[a-zA-Z0-9_-]{1,100}$/.test(r.id)||ids[key].has(r.id))fail(key+' ID 重复或缺失');ids[key].add(r.id);if(r.code&&key!=='scans'){if(typeof r.code!=='string'||codes.has(r.code))fail(key+' 编码重复或无效');codes.add(r.code)}}}
 const finite=(v,min=0)=>typeof v==='number'&&Number.isFinite(v)&&v>=min;const text=(v,max=10000)=>typeof v==='string'&&v.length<=max;const date=v=>validDate(v);
 for(const r of d.products)if(!text(r.code,100)||!text(r.name,200)||!text(r.spec)||!text(r.unit,50)||!text(r.category)||!finite(r.price)||!finite(r.min))fail('货品字段错误');for(const r of d.warehouses)if(!text(r.code,100)||!text(r.name,200)||!['启用','停用'].includes(r.enabled))fail('仓库字段错误');for(const r of d.partners)if(!text(r.name,200)||!['供应商','客户','供应商/客户'].includes(r.type))fail('往来单位字段错误');const opening=new Set();for(const r of d.opening){const k=r.product+'|'+r.warehouse;if(!ids.products.has(r.product)||!ids.warehouses.has(r.warehouse)||!finite(r.qty)||opening.has(k))fail('期初库存引用或数量错误');opening.add(k)}
 const noSet=new Set();for(const r of d.docs){if(!DOCS.includes(r.type)||!text(r.no,100)||noSet.has(r.no)||(r.status==='草稿'?!text(r.date,10)||r.date!==''&&!date(r.date):!date(r.date))||!ids.warehouses.has(r.warehouse)||!['草稿','已提交','已审核'].includes(r.status)||!text(r.operator,100)||!Array.isArray(r.lines)||r.lines.length>3000||!Number.isFinite(Date.parse(r.created))||!Number.isFinite(Date.parse(r.updated)))fail('单据字段或编号错误');noSet.add(r.no);if(r.partner&&!ids.partners.has(r.partner))fail('单据往来单位不存在');if(r.target&&!ids.warehouses.has(r.target))fail('目标仓库不存在');if(r.sourceId&&!ids.docs.has(r.sourceId))fail('来源订单不存在');const lineIds=new Set(),countProducts=new Set();for(const l of r.lines){if(!l||!text(l.id,100)||!/^[a-zA-Z0-9_-]+$/.test(l.id)||lineIds.has(l.id)||!ids.products.has(l.product)||!(typeof l.qty==='number'&&Number.isFinite(l.qty)||l.qty==='')||!(typeof l.price==='number'&&Number.isFinite(l.price)||l.price==='')||!(typeof l.actual==='number'&&Number.isFinite(l.actual)||l.actual==='')||!Array.isArray(l.sn)||l.sn.length>1000||l.sn.some(x=>!text(x,200)))fail('单据明细错误');lineIds.add(l.id);if(r.type==='盘点单'&&r.status!=='草稿'){if(countProducts.has(l.product))fail('盘点货品重复');countProducts.add(l.product)}if(r.type==='形态转换单'&&r.status!=='草稿'&&(!ids.products.has(l.targetProduct)||l.targetProduct===l.product||!finite(l.targetQty,0.00000001)))fail('转换明细错误');if(r.status!=='草稿'&&(r.lines.length===0||r.type!=='盘点单'&&!finite(l.qty,0.00000001)||!finite(l.price)||r.type==='盘点单'&&!finite(l.actual)))fail('提交/审核单据不能有无效明细')}
 if(r.type==='库存调拨单'&&r.status!=='草稿'&&r.target===r.warehouse)fail('调拨来源与目标相同');if(r.countEffects!=null){if(!Array.isArray(r.countEffects)||r.countEffects.length>3000)fail('盘点变动错误');for(const e of r.countEffects)if(!ids.products.has(e.product)||!ids.warehouses.has(e.warehouse)||!finite(e.qty,-1e12))fail('盘点变动引用错误')}if(r.type==='盘点单'&&r.status==='已审核'&&!Array.isArray(r.countEffects))fail('已审核盘点单缺少库存差额')}
 for(const r of d.scans)if(!ids.products.has(r.code)||!ids.warehouses.has(r.warehouse)||!finite(r.qty,0.00000001)||!['待同步','已同步','异常'].includes(r.status)||!Number.isFinite(Date.parse(r.time)))fail('扫码记录错误');for(const key of ['receivables','payables'])for(const r of d[key]){if(!ids.partners.has(r.partner)||!date(r.date)||!date(r.due)||r.due<r.date||!finite(r.amount,0.00000001)||!finite(r.paid)||r.paid>r.amount||!Array.isArray(r.payments)||r.payments.length>10000||r.docId&&!ids.docs.has(r.docId))fail('资金账单字段错误');for(const p of r.payments)if(!finite(p.amount,0.00000001)||!Number.isFinite(Date.parse(p.time)))fail('核销记录错误')}
 for(const key of ['workflows','roles'])for(const r of d[key])if(!text(r.code,100)||!text(r.name,200)||!['启用','停用'].includes(r.enabled)||key==='workflows'&&!text(r.nodes)||key==='roles'&&!text(r.menus))fail('流程或角色字段错误');if(new Blob([JSON.stringify(d)]).size>20*1024*1024)fail('数据超过 20 MB');const businessError=EzscanWarehouseDomain.businessError(d);if(businessError)fail(businessError);
}
function backup(){const state=storage.getStatus();const content={...db,_serverStorage:{revision:state.revision,tenantId:state.tenantId,updatedAt:state.updatedAt,pending:state.pending,saving:state.saving,conflict:state.conflict,loaded:state.loaded,exportedAt:new Date().toISOString()}};download('Ezscan完整备份_'+today()+'.json',JSON.stringify(content,null,2),'application/json');showToast(state.pending?'已导出当前修改；其中包含尚未保存到服务器的数据':'已导出完整 JSON 备份')}

function migrationPanel(){let storageError='';try{backupRaw=localStorage.getItem(KEY)||''}catch{storageError='浏览器禁止读取本地存储，可使用 JSON 文件导入'}let summary='当前浏览器未检测到旧版数据';if(backupRaw){try{const old=validateRestoredState(JSON.parse(backupRaw));summary='检测到 '+old.products.length+' 个货品、'+old.docs.length+' 张单据'}catch(error){summary='检测到旧数据，但校验未通过：'+error.message}}openModal('迁移浏览器旧数据',`<div class="note">${esc(storageError||summary)}</div><p class="hint">仅能读取当前浏览器、当前网站地址保存的旧数据。localhost、127.0.0.1、内网IP、其他端口和本地HTML文件拥有不同的存储空间。请回到原来使用的浏览器和地址导出完整 JSON，再在此导入。</p><div class="detail-values"><p><b>当前地址</b>${esc(location.origin)}</p><p><b>当前租户</b>${esc(storage.getStatus().tenantId||'尚未加载')}</p><p><b>旧数据键</b>${KEY}</p></div><div class="quick-grid" style="margin:14px 0">${btn('导入检测到的旧数据','migrateLegacy','btn-blue',!backupRaw)}${btn('选择旧版 JSON 文件','restore')}${backupRaw?btn('导出浏览器原始数据','rawBackup'):''}</div><label class="hint" for="legacyJson">也可粘贴旧版完整 JSON：</label><textarea id="legacyJson" style="width:100%;min-height:110px;margin-top:7px;padding:8px;user-select:text" placeholder="粘贴完整 JSON 备份"></textarea><div class="error-text" id="migrationError"></div><div class="note">导入会替换当前仓储数据，执行前会确认并下载当前备份；原浏览器数据保留。只想体验功能，可选择追加测试数据。</div>`,`${btn('追加测试数据','addSamples')}${btn('导入粘贴内容','importLegacyText','btn-blue')}${btn('关闭','closeModal')}`)}
async function importLegacyText(){if(!writable())return showToast(writeBlockedMessage());try{const raw=$('#legacyJson').value;if(new Blob([raw]).size>20*1024*1024)throw Error('数据超过 20 MB');const d=validateRestoredState(JSON.parse(raw));if(!confirm('导入将替换当前服务器仓储数据，是否继续？'))return;modalDirty=false;await replaceState(d,'迁移粘贴的旧数据')}catch(error){if($('#migrationError'))$('#migrationError').textContent=error.message;else showToast(error.message)}}
async function modifySamples(action){if(!writable())return showToast(writeBlockedMessage());if(modalDirty&&!confirm('放弃当前未保存的表单内容并处理测试数据？'))return;if(!confirm(action==='add'?'追加包含全部单据类型、库存预警及账款状态的测试数据，现有记录保留，是否继续？':'仅清理带测试标记的数据；正式记录引用测试档案时将禁止清理。继续？'))return;try{const data=await storage.modifySamples(action);db=data;normalizeTabs();moduleName='首页';db.ui.active='首页';currentId=null;mode='list';resetFilters();closeModal();render();showToast(action==='add'?'测试数据已保存到服务器；重复添加不会创建重复记录':'测试数据已清理，其他记录保留')}catch(error){showToast(error.message)}}

function dataPanel(){if(!db)return;let bytes=0;try{bytes=new Blob([JSON.stringify(db)]).size}catch{}const state=storage.getStatus();openModal('服务器数据与备份',`<div class="note">业务数据保存至当前租户独立的 ezscan-warehouse.db，支持跨设备读取。服务器确认后才显示已保存；切换设备前请等待保存完成。浏览器旧数据仅用于手动迁移。</div><div class="${storeError?'error-text':'hint'}">${esc(saveLabel())}</div><div class="detail-values"><p><b>业务单据</b>${db.docs.length} 张</p><p><b>货品档案</b>${db.products.length} 项</p><p><b>当前数据大小</b>${(bytes/1024).toFixed(1)} KB</p><p><b>服务器版本</b>${state.revision}</p><p><b>最后确认保存</b>${esc(lastSaved||'尚无保存记录')}</p><p><b>当前修改</b>${state.pending?'尚未保存到服务器':'无待保存修改'}</p></div><div class="quick-grid" style="margin-top:12px">${btn('导出当前 JSON 备份','backup','btn-blue')}${btn('下载服务器 SQLite 数据库','downloadDatabase','',!state.loaded||!state.initialized||!state.canWrite)}${btn('恢复 JSON 备份','restore')}${btn('查看操作日志','logs')}${backupRaw?btn('导出浏览器旧数据','rawBackup'):''}${btn('迁移浏览器旧数据','migrationPanel')}${btn('追加测试数据','addSamples')}${btn('清理测试数据','removeSamples')}${storeError&&!state.conflict?btn('重试保存 / 加载','retryStorage'):''}${btn('重新加载服务器数据','reloadStorage')}</div><div class="hint" style="margin-top:16px">JSON 备份包含当前页面数据和服务器保存状态，可能包含待保存修改；SQLite 下载仅包含服务器已经确认保存的数据。恢复与迁移会覆盖当前仓储数据并要求确认，操作前自动下载当前 JSON 备份。数据冲突时请先导出修改，再重新加载比对。</div>${storageNotice?`<div class="note">${esc(storageNotice)}</div>`:''}`);updateStatus()}
function validateRestoredState(data){const backupTenant=data?._serverStorage?.tenantId;if(backupTenant&&backupTenant!==storage.getStatus().tenantId)throw Error('该备份属于其他租户，请切换到备份所属租户后恢复');const d={...data};delete d._serverStorage;validateBackup(d);const previous=db;try{db=d;if([...stockMap().values()].some(v=>v< -1e-8))throw Error('备份计算后存在负库存')}finally{db=previous}return d}
async function replaceState(d,label){if(!writable())return showToast(writeBlockedMessage());backup();db=d;db.revision=storage.getStatus().revision;normalizeTabs();moduleName=db.ui.active||'首页';currentId=null;restoreTabView(moduleName);rememberVisit(moduleName);log(label,'导入 '+d.docs.length+' 张单据、'+d.products.length+' 个货品档案');persist();closeModal();document.body.classList.toggle('compact',db.settings.compact);render();if(await storage.flush())showToast(label+'已保存到服务器');else showToast('服务器尚未确认，请重试保存或导出当前修改')}
async function restoreFile(file){if(!writable())return showToast(writeBlockedMessage());if(file.size>20*1024*1024)return showToast('备份文件超过 20 MB');try{const d=validateRestoredState(JSON.parse(await file.text()));if(!writable())return showToast(writeBlockedMessage());if(!confirm('将恢复 '+d.docs.length+' 张单据、'+d.products.length+' 个货品档案，并覆盖当前服务器仓储数据。继续？'))return;await replaceState(d,'恢复备份')}catch(e){showToast('恢复失败：'+e.message)}}
async function migrateLegacy(){if(!writable())return showToast(writeBlockedMessage());if(!backupRaw)return showToast('当前浏览器没有可迁移的旧数据');try{const d=validateRestoredState(JSON.parse(backupRaw));if(!confirm('迁移浏览器旧数据将覆盖当前服务器仓储数据，共 '+d.docs.length+' 张单据、'+d.products.length+' 个货品档案。浏览器原数据保留，继续？'))return;await replaceState(d,'迁移浏览器旧数据')}catch(e){showToast('迁移失败：'+e.message)}}

 case 'scanLine':scanLine();break;case 'generateSN':generateSN();break;case 'viewSN':viewSN();break;case 'docMore':docMore();break;case 'executeOrder':executeOrder();break;
 case 'importLines':askFile('.csv',importLinesFile);break;
 case 'lineTemplate':exportCSV('单据明细模板',LINE_COLS,[{code:db.products[0]?.code||'',qty:1,price:db.products[0]?.price||0,actual:0,targetCode:db.products[1]?.code||'',targetQty:1}]);break;
 case 'exportLines':exportCSV(currentDoc().no+'_明细',LINE_COLS,lineCSV());break;
 case 'exportSN':exportCSV(currentDoc().no+'_序列号',[{key:'code',label:'货品编码'},{key:'name',label:'货品名称'},{key:'sn',label:'序列号'}],currentDoc().lines.flatMap(l=>(l.sn||[]).map(sn=>({code:find('products',l.product)?.code,name:pname(l.product),sn}))));break;
 case 'export':exportCSV(moduleName,tableColumns,exportRows);break;
 case 'previewLabels':previewLabels();break;case 'previewLabel':previewLabels(id);break;
 case 'print':closeModal();window.print();break;case 'printLabels':document.body.classList.add('printing-labels');window.print();document.body.classList.remove('printing-labels');break;
 case 'stockHistory':{const[p,w]=id.split('|');if(!navigate('出入明细清单'))return;query='';filterProduct=p;filterWarehouse=w;render()}break;
 case 'monthHistory':{const[m,w,product]=id.split('|');if(!navigate('出入明细清单'))return;query='';filterProduct=product||'';filterWarehouse=w;dateFrom=m+'-01';dateTo=m+'-'+String(new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate()).padStart(2,'0');render()}break;
 case 'dataPanel':dataPanel();break;case 'backup':backup();break;case 'restore':askFile('.json',restoreFile);break;
 case 'resetSeed':return resetSeed();
 case 'migrationPanel':migrationPanel();break;case 'importLegacyText':return importLegacyText();case 'addSamples':return modifySamples('add');case 'removeSamples':return modifySamples('remove');case 'migrateLegacy':return migrateLegacy();case 'downloadDatabase':return downloadDatabase();case 'retryStorage':return retryStorage();case 'reloadStorage':reloadStorage();break;
 case 'rawBackup':download('Ezscan原始存储_'+today()+'.json',backupRaw,'application/json');break;case 'logs':logsPanel();break;
 case 'compact':db.settings.compact=!db.settings.compact;document.body.classList.toggle('compact',db.settings.compact);captureTabView();break;
}}
const MUTATIONS=new Set(['new','saveMaster','delete','deleteDoc','deleteSelected','confirmSettle','undoSettle','saveOpening','syncScans','saveDoc','submitDoc','approveDoc','unapproveDoc','withdrawDoc','copyDoc','confirmProducts','removeLine','deleteLines','scanLine','generateSN','executeOrder','importLines','edit','editSelected','settle','opening','addLine','restore','resetSeed','migrateLegacy','importLegacyText','addSamples','removeSamples']);
document.addEventListener('click',e=>{
 document.getElementById('contextMenu')?.remove();const c=e.target.closest('[data-close]');if(c){closeTabs('one',c.dataset.close);return}
 const n=e.target.closest('[data-module],[data-preview-module]');if(n){const fromTab=n.closest('#topTabs');if(navigate(n.dataset.module||n.dataset.previewModule)&&fromTab)tabNode(moduleName)?.querySelector('.tab-main').focus();return}
 const a=e.target.closest('[data-action]');if(a&&!a.disabled){if(!writable()&&MUTATIONS.has(a.dataset.action))return showToast(writeBlockedMessage());try{Promise.resolve(action(a.dataset.action,a.dataset.id,a)).catch(()=>showToast('操作未完成，请重试或导出备份'))}catch(err){showToast('操作未完成：'+err.message)}return}
 const sort=e.target.closest('[data-sort]');if(sort){sortDir=sortKey===sort.dataset.sort?-sortDir:1;sortKey=sort.dataset.sort;render();return}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.select){if(el.checked)selected.add(el.dataset.select);else selected.delete(el.dataset.select);el.closest('tr').classList.toggle('selected',el.checked);const pager=$('.pager>span');if(pager)pager.textContent=`共 ${exportRows.length} 条 · 已选 ${selected.size} 条`;return}if(el.id==='selectAll'){visibleRows.forEach(r=>el.checked?selected.add(r.id):selected.delete(r.id));render();return}if(el.id==='allLines'){document.querySelectorAll('[data-line-select]').forEach(x=>x.checked=el.checked);return}if(el.id==='pageSize'){pageSize=Number(el.value);page=1;render();return}if(el.dataset.doc||el.dataset.lineKey)updateDocumentInput(el);});
function updateDocumentInput(el){if(!writable())return showToast(writeBlockedMessage());const d=currentDoc();if(!d||d.status!=='草稿')return;if(el.dataset.doc){d[el.dataset.doc]=el.value;d.updated=new Date().toISOString();persist();if(el.dataset.doc==='warehouse'){if(d.type==='盘点单')d.lines.forEach(line=>line.actual='');persist();render();}return}const line=d.lines.find(l=>l.id===el.dataset.lineId);if(!line)return;const key=el.dataset.lineKey;if(key==='targetProduct')line[key]=el.value;else line[key]=el.value===''?'':Number(el.value);if(key==='qty')line.sn=[];d.updated=new Date().toISOString();persist();refreshTotals()}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.doc&&el.tagName!=='SELECT'||el.dataset.lineKey&&el.tagName!=='SELECT')updateDocumentInput(el);if(el.closest('#masterForm')||el.matches('#settleAmount,#settleRemark,#openingQty,#legacyJson'))modalDirty=true;if(el.id==='pickQ'){const q=el.value.toLowerCase();document.querySelectorAll('.pick-row').forEach(r=>r.style.display=r.dataset.pickSearch.toLowerCase().includes(q)?'':'none')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('contextMenu')?.remove();if($('#modalMask')){if(modalDirty&&!confirm('放弃未保存的表单内容？'))return;closeModal()}}if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();action('search')}if(e.key==='Enter'&&e.target.id==='scanInput'){e.preventDefault();scanLine()}if(e.key==='Enter'&&e.target.closest('#masterForm')&&e.target.tagName!=='TEXTAREA'){e.preventDefault();saveMaster()}});
document.addEventListener('dblclick',e=>{const row=e.target.closest('[data-row]');if(row&&moduleName!=='总货品库存'&&moduleName!=='条码标签打印'&&moduleName!=='出入明细清单'&&moduleName!=='月度出入库统计')viewRecord(row.dataset.row)});
document.addEventListener('contextmenu',e=>{const row=e.target.closest('[data-row]');if(!row||(!DOCS.includes(moduleName)&&!CONFIG[moduleName]))return;e.preventDefault();document.getElementById('contextMenu')?.remove();const menu=document.createElement('div');menu.id='contextMenu';menu.className='context-menu';const id=row.dataset.row;menu.innerHTML=rowBtn('查看记录','view',id)+rowBtn(DOCS.includes(moduleName)?'复制为草稿':'编辑记录',DOCS.includes(moduleName)?'copyDoc':'edit',id)+rowBtn('删除记录','delete',id);menu.style.left=Math.min(e.clientX,innerWidth-160)+'px';menu.style.top=Math.min(e.clientY,innerHeight-130)+'px';document.body.appendChild(menu)});
window.addEventListener('online',()=>{const state=storage.getStatus();if(state.pending&&state.error&&!state.conflict&&state.canWrite)void retryStorage()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')void storage.flush()});
window.addEventListener('beforeunload',e=>{if(modalDirty||storage.getStatus().pending||storage.getStatus().saving){e.preventDefault();e.returnValue=''}});
$('#topTabs').addEventListener('scroll',updateTabScroll,{passive:true});
window.addEventListener('afterprint',()=>document.body.classList.remove('printing-labels'));
load();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✦ 托特桌宠</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      -webkit-user-select: none;
    }
    .gpet-root {
      position: absolute !important;
      right: 15px !important;
      bottom: 15px !important;
      left: auto !important;
      top: auto !important;
      width: var(--gpet-base) !important;
      height: calc(var(--gpet-base) * 1.385) !important;
    }
    .gpet-root.gpet-left {
      left: 15px !important;
      right: auto !important;
    }
    .gpet-scaling, .gpet-scaling * {
      transition: none !important;
    }
  </style>
  <script src="pet-i18n.js"></script>
  <link rel="stylesheet" href="thoth-theme.css">
</head>
<body>
  <!-- 引入自包含的托特桌宠前端组件 -->
  <script src="thoth-presence.js"></script>
  <script src="thoth-artwork.js"></script>
  <script src="thoth-life.js"></script>
  <script src="quota-view.js"></script>
  <script src="gemini-pet.js"></script>
</body>
</html>

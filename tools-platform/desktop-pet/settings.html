<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>✦ Dragon桌宠设置</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: auto;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .settings-card {
      margin: 8px;
      width: calc(100% - 16px);
      height: calc(100% - 16px);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(20, 125, 122, 0.35);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 16px 36px rgba(20, 125, 122, 0.15), 0 4px 12px rgba(15, 23, 42, 0.12);
      color-scheme: light;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .title-row {
      font-size: 13px;
      font-weight: 800;
      color: #105d61;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .title-text {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .close-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      color: #94a3b8;
      padding: 0 4px;
      line-height: 1;
      font-weight: 700;
      transition: color .15s;
    }
    .close-btn:hover {
      color: #e11d48;
    }
    .menu-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 5px 0;
      color: #334155;
      font-size: 12px;
      white-space: normal;
    }
    .menu-label {
      color: #475569;
      font-size: 12px;
      flex-shrink: 0;
      min-width: 56px;
      font-weight: 500;
    }
    .range-input {
      flex: 1;
      min-width: 0;
      accent-color: #147d7a;
      cursor: pointer;
    }
    .number-badge {
      width: 42px;
      border: 1px solid rgba(20, 125, 122, 0.3);
      border-radius: 6px;
      padding: 2px 4px;
      font-size: 11px;
      color: #105d61;
      background: rgba(230, 244, 235, 0.8);
      text-align: center;
      flex-shrink: 0;
      font-weight: 600;
    }
    .check-label {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #334155;
      font-size: 12px;
      font-weight: 500;
    }
    .check-input {
      width: 15px;
      height: 15px;
      accent-color: #147d7a;
      cursor: pointer;
    }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(20, 125, 122, 0.25), transparent);
      margin: 6px 0;
    }
    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all .15s ease;
    }
    .btn-secondary {
      background: rgba(241, 245, 249, 0.9);
      color: #475569;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
      color: #1e293b;
    }
    .btn-warning {
      background: #fff1f2;
      color: #e11d48;
      border: 1px solid #fecdd3;
    }
    .btn-warning:hover {
      background: #ffe4e6;
    }
    .btn-danger {
      background: #fff5f5;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .btn-danger:hover {
      background: #fee2e2;
    }
    .tip-text {
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
      margin-top: 2px;
    }
  </style>
  <script src="pet-i18n.js"></script>
  <link rel="stylesheet" href="dragon-theme.css">
</head>
<body>
  <div class="settings-card">
    <div class="title-row">
      <div class="title-text">
        <img class="settings-avatar" src="./assets/dragon/idle.png" alt="毛毡小龙 Dragon">
        <span>Dragon桌宠设置</span>
      </div>
      <button class="close-btn" id="closeBtn" title="关闭设置">✕</button>
    </div>

    <!-- 尺寸缩放 -->
    <div class="menu-row">
      <span class="menu-label">体型缩放</span>
      <input type="range" id="scaleRange" class="range-input" min="0.6" max="2.2" step="0.05" value="0.75">
      <span id="scaleBadge" class="number-badge">0.75x</span>
    </div>

    <!-- 音效音量 -->
    <div class="menu-row">
      <span class="menu-label">捏捏音量</span>
      <input type="range" id="volRange" class="range-input" min="0" max="1" step="0.05" value="0.8">
      <span id="volBadge" class="number-badge">80%</span>
    </div>

    <!-- 互动开关 -->
    <div class="menu-row">
      <label class="check-label">
        <input type="checkbox" id="bubbleCheck" class="check-input" checked>
        <span>开启头顶趣味气泡</span>
      </label>
    </div>

    <div class="menu-row">
      <label class="check-label">
        <input type="checkbox" id="typingCheck" class="check-input" checked>
        <span>专注陪伴 (全局键盘联动)</span>
      </label>
    </div>

    <div class="menu-row"><label class="check-label"><input type="checkbox" id="quotaStandaloneCheck" class="check-input"><span>隐藏桌宠时保留额度 HUD</span></label></div>
    <div class="menu-row"><label class="check-label"><input type="checkbox" id="randomMotionCheck" class="check-input" checked><span>随机眨眼与待机动作</span></label></div>
    <div class="menu-row"><label class="check-label"><input type="checkbox" id="proactiveStoriesCheck" class="check-input" checked><span>Dragon 主动讲故事</span></label></div>
    <div class="menu-row"><label class="check-label"><input type="checkbox" id="eyeGazeCheck" class="check-input" checked><span>自然眼神与轻微动效</span></label></div>
    <div class="menu-row"><label for="storyInterval">故事间隔（分钟）</label><input id="storyInterval" type="number" min="1" max="30" value="3" class="number-badge" style="width:50px"></div>

    <!-- macOS 辅助功能权限提示与授权引导 -->
    <div id="macAccessibilityBox" style="display:none;background:rgba(245,158,11,0.08);border:1px dashed rgba(245,158,11,0.3);border-radius:8px;padding:8px 10px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
        <span style="font-size:11px;color:#d97706;font-weight:600;">macOS 系统全局键盘权限</span>
        <button id="authMacBtn" type="button" style="background:#f59e0b;color:#fff;border:none;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-weight:700;">去授权</button>
      </div>
      <div style="font-size:10px;color:#94a3b8;margin-top:4px;line-height:1.4;">
        需要「辅助功能」授权才能在其他应用打字时感知按键
      </div>
    </div>

    <div class="divider"></div>

    <!-- 隐藏与停用操作 -->
    <div class="actions-grid">
      <button class="btn btn-secondary" id="resetPosBtn">
        <span>📍</span>
        <span>重置屏幕坐标 (右下角)</span>
      </button>

      <button class="btn btn-warning" id="hideTempBtn">
        <span>🙈</span>
        <span>本次隐藏桌宠 (下次启动恢复)</span>
      </button>

      <button class="btn btn-danger" id="hidePermBtn">
        <span>🚫</span>
        <span>永久隐藏 (切换为无桌宠模式)</span>
      </button>
    </div>

    <div class="tip-text">永久隐藏后，可在系统右下角托盘随时恢复开启</div>
  </div>

  <script>
    const isElectron = typeof require !== 'undefined';
    let ipcRenderer = null;
    if (isElectron) {
      try { ipcRenderer = require('electron').ipcRenderer; } catch (_) {}
    }

    const scaleRange = document.getElementById('scaleRange');
    const scaleBadge = document.getElementById('scaleBadge');
    const volRange = document.getElementById('volRange');
    const volBadge = document.getElementById('volBadge');
    const bubbleCheck = document.getElementById('bubbleCheck');
    const typingCheck = document.getElementById('typingCheck');
    const quotaStandaloneCheck = document.getElementById('quotaStandaloneCheck');
    quotaStandaloneCheck.addEventListener('change', () => { if (ipcRenderer) ipcRenderer.send('pet-config-changed', { quotaStandalone: quotaStandaloneCheck.checked }); });
    const randomMotionCheck = document.getElementById('randomMotionCheck');
    const proactiveStoriesCheck = document.getElementById('proactiveStoriesCheck');
    const storyInterval = document.getElementById('storyInterval');
    const eyeGazeCheck = document.getElementById('eyeGazeCheck');
    eyeGazeCheck.addEventListener('change', () => { if (ipcRenderer) ipcRenderer.send('pet-config-changed', { eyeGazeOn: eyeGazeCheck.checked }); });
    randomMotionCheck.addEventListener('change', () => { if (ipcRenderer) ipcRenderer.send('pet-config-changed', { randomMotionOn: randomMotionCheck.checked }); });
    proactiveStoriesCheck.addEventListener('change', () => { if (ipcRenderer) ipcRenderer.send('pet-config-changed', { proactiveStoriesOn: proactiveStoriesCheck.checked }); });
    storyInterval.addEventListener('change', () => { const minutes = Math.max(1, Math.min(30, Number(storyInterval.value) || 3)); storyInterval.value = minutes; if (ipcRenderer) ipcRenderer.send('pet-config-changed', { storyIntervalMinutes: minutes }); });

    scaleRange.addEventListener('input', () => {
      const val = parseFloat(scaleRange.value);
      scaleBadge.textContent = val.toFixed(2) + 'x';
      if (ipcRenderer) ipcRenderer.send('pet-set-scale', val);
    });

    volRange.addEventListener('input', () => {
      const val = parseFloat(volRange.value);
      volBadge.textContent = Math.round(val * 100) + '%';
      if (ipcRenderer) ipcRenderer.send('pet-set-volume', val);
    });

    bubbleCheck.addEventListener('change', () => {
      if (ipcRenderer) ipcRenderer.send('pet-config-changed', { bubbleOn: bubbleCheck.checked });
    });

    typingCheck.addEventListener('change', () => {
      if (ipcRenderer) ipcRenderer.send('pet-config-changed', { typingOn: typingCheck.checked });
    });

    document.getElementById('resetPosBtn').addEventListener('click', () => {
      if (ipcRenderer) ipcRenderer.send('pet-reset-position');
    });

    document.getElementById('hideTempBtn').addEventListener('click', () => {
      if (ipcRenderer) ipcRenderer.send('pet-hide-temporary');
    });

    document.getElementById('hidePermBtn').addEventListener('click', () => {
      if (confirm(window.PetI18n.getLanguage() === 'en-US' ? 'Disable the desktop pet? It will no longer start automatically. You can enable it again from the system tray.' : '确定要停用桌面宠物吗？\n停用后将进入无桌宠模式，下次启动不再自动弹出。\n（可在桌面右下角系统托盘菜单中随时勾选重新开启）')) {
        if (ipcRenderer) ipcRenderer.send('pet-set-permanent-hidden', true);
      }
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      if (ipcRenderer) ipcRenderer.send('pet-close-settings');
    });

    async function checkMacPermission() {
      if (ipcRenderer && typeof process !== 'undefined' && process.platform === 'darwin') {
        try {
          const hasPerm = await ipcRenderer.invoke('pet-check-accessibility');
          const box = document.getElementById('macAccessibilityBox');
          if (box) {
            box.style.display = hasPerm ? 'none' : 'block';
          }
        } catch (_) {}
      }
    }

    const authMacBtn = document.getElementById('authMacBtn');
    if (authMacBtn) {
      authMacBtn.addEventListener('click', () => {
        if (ipcRenderer) {
          ipcRenderer.send('pet-request-accessibility');
        }
      });
    }

    // 接收主进程初始配置
    if (ipcRenderer) {
      ipcRenderer.on('pet-init-settings', (event, cfg) => {
        if (!cfg) return;
        if (typeof cfg.scale === 'number') {
          scaleRange.value = cfg.scale;
          scaleBadge.textContent = Number(cfg.scale).toFixed(2) + 'x';
        }
        if (typeof cfg.soundVol === 'number') {
          volRange.value = cfg.soundVol;
          volBadge.textContent = Math.round(cfg.soundVol * 100) + '%';
        }
        if (typeof cfg.bubbleOn === 'boolean') bubbleCheck.checked = cfg.bubbleOn;
        if (typeof cfg.eyeGazeOn === 'boolean') eyeGazeCheck.checked = cfg.eyeGazeOn;
        quotaStandaloneCheck.checked = cfg.quotaStandalone === true;
        if (typeof cfg.randomMotionOn === 'boolean') randomMotionCheck.checked = cfg.randomMotionOn;
        if (typeof cfg.proactiveStoriesOn === 'boolean') proactiveStoriesCheck.checked = cfg.proactiveStoriesOn;
        if (cfg.storyIntervalMinutes !== undefined) storyInterval.value = cfg.storyIntervalMinutes;
        if (typeof cfg.typingOn === 'boolean') typingCheck.checked = cfg.typingOn;
        checkMacPermission();
      });
    }
  </script>
</body>
</html>

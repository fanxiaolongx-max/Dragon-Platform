<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Dragon Platform</title>
  <desc id="d">做好每一个工具：本地 / 内网的智能工具中台</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1c"/>
      <stop offset="1" stop-color="#13183a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#64ffda" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#64ffda" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64ffda"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe0bd"/>
      <stop offset="1" stop-color="#5cbf98"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowB)"/>

  <!-- 星点 -->
  <g fill="#e0f2fe">
    <circle cx="610" cy="60" r="1.6" opacity="0.7"/><circle cx="740" cy="110" r="1.2" opacity="0.5"/>
    <circle cx="1180" cy="70" r="1.8" opacity="0.7"/><circle cx="880" cy="340" r="1.3" opacity="0.5"/>
    <circle cx="1230" cy="250" r="1.2" opacity="0.6"/><circle cx="560" cy="330" r="1.4" opacity="0.4"/>
  </g>
  <path d="M1105 52l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fde68a" opacity="0.85"/>
  <path d="M840 236l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#99f6e4" opacity="0.8"/>

  <!-- 文案 -->
  <text x="72" y="96" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" letter-spacing="4" fill="#64ffda" font-weight="700">TOOLS · DATA · AGENT · DELIVERY</text>
  <text x="68" y="170" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="70" font-weight="800" fill="url(#title)">Dragon Platform</text>
  <text x="72" y="222" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="700" fill="#e2e8f0">做好每一个工具 · 本地 / 内网的智能工具中台</text>
  <text x="72" y="256" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#94a3b8">One home for data capture, SLA control, monthly reports, an AI agent and 40+ handy tools.</text>

  <g font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700">
    <g transform="translate(72 290)">
      <rect width="184" height="36" rx="18" fill="#64ffda" fill-opacity="0.12" stroke="#64ffda" stroke-opacity="0.45"/>
      <text x="92" y="23" text-anchor="middle" fill="#99f6e4">🐉 Dragon Claw 智能体</text>
    </g>
    <g transform="translate(268 290)">
      <rect width="150" height="36" rx="18" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.45"/>
      <text x="75" y="23" text-anchor="middle" fill="#bfdbfe">🧰 40+ 内置工具</text>
    </g>
    <g transform="translate(430 290)">
      <rect width="186" height="36" rx="18" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="93" y="23" text-anchor="middle" fill="#ddd6fe">📊 抓取 → SLA → 月报</text>
    </g>
    <g transform="translate(628 290)">
      <rect width="176" height="36" rx="18" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.45"/>
      <text x="88" y="23" text-anchor="middle" fill="#fde68a">🖥️ Web · 桌面 · 移动</text>
    </g>
  </g>

  <!-- 小龙吉祥物 -->
  <g transform="translate(1010 200) scale(0.93)">
    <ellipse cx="0" cy="150" rx="96" ry="12" fill="#000" opacity="0.28"/>
    <!-- 尾巴 -->
    <path d="M-70 92 C-130 92 -140 40 -112 30" fill="none" stroke="#5cbf98" stroke-width="18" stroke-linecap="round"/>
    <path d="M-118 22 l-16 -6 l6 16 z" fill="#f9a8d4"/>
    <!-- 翅膀 -->
    <path d="M-62 -6 C-118 -40 -138 4 -128 30 C-110 18 -96 26 -84 34 C-80 16 -70 4 -62 -6z" fill="#f5b4d6" stroke="#e48bbd" stroke-width="3"/>
    <path d="M62 -6 C118 -40 138 4 128 30 C110 18 96 26 84 34 C80 16 70 4 62 -6z" fill="#f5b4d6" stroke="#e48bbd" stroke-width="3"/>
    <!-- 身体 -->
    <ellipse cx="0" cy="66" rx="72" ry="78" fill="url(#body)" stroke="#3f9c7a" stroke-width="3"/>
    <ellipse cx="0" cy="80" rx="44" ry="52" fill="#fdf6e3"/>
    <path d="M-28 64 h56 M-30 86 h60 M-26 108 h52" stroke="#eadfc4" stroke-width="3" stroke-linecap="round"/>
    <!-- 脚 -->
    <ellipse cx="-36" cy="140" rx="22" ry="12" fill="#5cbf98" stroke="#3f9c7a" stroke-width="3"/>
    <ellipse cx="36" cy="140" rx="22" ry="12" fill="#5cbf98" stroke="#3f9c7a" stroke-width="3"/>
    <!-- 小爪：挥手 -->
    <ellipse cx="64" cy="34" rx="14" ry="20" transform="rotate(-35 64 34)" fill="#7fd3b0" stroke="#3f9c7a" stroke-width="3"/>
    <ellipse cx="-58" cy="62" rx="12" ry="17" transform="rotate(25 -58 62)" fill="#7fd3b0" stroke="#3f9c7a" stroke-width="3"/>
    <!-- 头 -->
    <path d="M-30 -86 l-10 -34 l26 22 z" fill="#f6a985" stroke="#e08a63" stroke-width="3" stroke-linejoin="round"/>
    <path d="M30 -86 l10 -34 l-26 22 z" fill="#f6a985" stroke="#e08a63" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 -96 l-8 -24 l16 0 z" fill="#f6a985" stroke="#e08a63" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-40" rx="70" ry="60" fill="url(#body)" stroke="#3f9c7a" stroke-width="3"/>
    <ellipse cx="-24" cy="-44" rx="12" ry="14" fill="#1f2937"/>
    <ellipse cx="24" cy="-44" rx="12" ry="14" fill="#1f2937"/>
    <circle cx="-20" cy="-49" r="4.5" fill="#fff"/>
    <circle cx="28" cy="-49" r="4.5" fill="#fff"/>
    <ellipse cx="-44" cy="-20" rx="11" ry="7" fill="#f9a8d4" opacity="0.8"/>
    <ellipse cx="44" cy="-20" rx="11" ry="7" fill="#f9a8d4" opacity="0.8"/>
    <path d="M-10 -18 q10 10 20 0" fill="none" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-6" cy="-30" r="2.2" fill="#3f9c7a"/><circle cx="6" cy="-30" r="2.2" fill="#3f9c7a"/>
  </g>
  <!-- 对话气泡 -->
  <g transform="translate(1082 76)">
    <rect x="0" y="0" width="150" height="46" rx="16" fill="#0f172a" stroke="#64ffda" stroke-opacity="0.6"/>
    <path d="M24 46 l-6 14 l18 -14 z" fill="#0f172a" stroke="#64ffda" stroke-opacity="0.6"/>
    <path d="M22 45 h18" stroke="#0f172a" stroke-width="3"/>
    <text x="75" y="29" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#e6fffa">问我任何事 ✨</text>
  </g>
</svg>

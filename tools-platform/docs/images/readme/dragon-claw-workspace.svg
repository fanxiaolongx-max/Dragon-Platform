<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="dcTitle dcDesc">
  <title id="dcTitle">Dragon Claw Agent Workspace — 全能智能体与本地代码协同工作区</title>
  <desc id="dcDesc">Dragon Claw 智能体双模工作台、多模型 Tool Calling 引擎、本地工程沙箱、实时上下文度量仪表盘与 GitHub PR 自动化流转</desc>
  <defs>
    <linearGradient id="dcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="dcAmbientGlow1" cx="20%" cy="25%" r="40%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.22)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0)"/>
    </radialGradient>
    <radialGradient id="dcAmbientGlow2" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.25)"/>
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0)"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="20" fill="url(#dcBg)"/>
  <rect width="1200" height="520" rx="20" fill="url(#dcAmbientGlow1)"/>
  <rect width="1200" height="520" rx="20" fill="url(#dcAmbientGlow2)"/>
  <rect width="1200" height="520" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <!-- Header Badge & Title -->
    <g transform="translate(48, 40)">
      <rect x="0" y="0" width="128" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#34d399"/>
      <text x="26" y="19" font-size="12" font-weight="700" fill="#6ee7b7" letter-spacing="1">AGENT WORKSPACE</text>

      <text x="0" y="62" font-size="28" font-weight="800" fill="#f8fafc">Dragon Claw 全能智能体与协同工作区</text>
      <text x="0" y="88" font-size="14" fill="#94a3b8">从日常业务只读问答，全面进化为具备本地多模型 Tool Calling、代码沙箱自愈与 GitHub PR 自动化流转的一体化研发工作台</text>
    </g>

    <!-- 3-Column Visual Layout -->
    <!-- Column 1: Left Navigation & Model Switcher -->
    <g transform="translate(48, 148)" filter="url(#shadow)">
      <rect width="250" height="310" rx="14" fill="url(#cardGrad)" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
      
      <!-- Card Header -->
      <path d="M 0 14 Q 0 0 14 0 L 236 0 Q 250 0 250 14 L 250 44 L 0 44 Z" fill="rgba(15, 23, 42, 0.6)"/>
      <circle cx="20" cy="22" r="4" fill="#ef4444"/>
      <circle cx="34" cy="22" r="4" fill="#eab308"/>
      <circle cx="48" cy="22" r="4" fill="#22c55e"/>
      <text x="70" y="26" font-size="12" font-weight="700" fill="#cbd5e1">侧边导航 &amp; 模型编排</text>

      <!-- Search Bar -->
      <rect x="16" y="56" width="218" height="32" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1"/>
      <text x="28" y="77" font-size="12" fill="#94a3b8">⌕ 搜索工具 / 拼音 ygcb</text>
      <rect x="206" y="63" width="18" height="18" rx="4" fill="rgba(255,255,255,0.08)"/>
      <text x="212" y="76" font-size="10" font-weight="700" fill="#cbd5e1">/</text>

      <!-- Model Selector -->
      <text x="16" y="112" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">多模型热切换 (MODEL ROUTING)</text>
      <rect x="16" y="122" width="218" height="36" rx="8" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1"/>
      <circle cx="32" cy="140" r="4" fill="#818cf8"/>
      <text x="44" y="144" font-size="13" font-weight="700" fill="#e0e7ff">Aragon</text>
      <text x="100" y="144" font-size="10" fill="#94a3b8">(Gemini / Claude / OpenAI)</text>
      <path d="M 218 138 L 223 143 L 228 138" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

      <!-- Category Navigation -->
      <text x="16" y="184" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">动态分类与工具市场</text>
      <g transform="translate(16, 196)">
        <rect x="0" y="0" width="218" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="10" y="17" font-size="11" fill="#cbd5e1">📊 SLA 与指标合控</text>
        <rect x="0" y="32" width="218" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="10" y="49" font-size="11" fill="#cbd5e1">📋 通用月报设计器</text>
        <rect x="0" y="64" width="218" height="26" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="10" y="81" font-size="11" fill="#cbd5e1">🛍️ 多源离线工具市场</text>
      </g>
    </g>

    <!-- Column 2: Center Interactive Chat & Tool Calling Engine -->
    <g transform="translate(322, 148)" filter="url(#shadow)">
      <rect width="470" height="310" rx="14" fill="url(#cardGrad)" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
      
      <!-- Card Header -->
      <path d="M 0 14 Q 0 0 14 0 L 456 0 Q 470 0 470 14 L 470 44 L 0 44 Z" fill="rgba(15, 23, 42, 0.6)"/>
      <circle cx="24" cy="22" r="8" fill="rgba(16, 185, 129, 0.2)"/>
      <circle cx="24" cy="22" r="4" fill="#34d399"/>
      <text x="40" y="26" font-size="13" font-weight="700" fill="#f1f5f9">Dragon Claw 会话主画布 (Agent Chat Canvas)</text>
      <rect x="372" y="10" width="84" height="24" rx="6" fill="rgba(255, 255, 255, 0.06)"/>
      <text x="382" y="26" font-size="11" fill="#94a3b8">Mode A 激活</text>

      <!-- Message Bubble 1 (User) -->
      <g transform="translate(20, 58)">
        <rect x="180" y="0" width="250" height="34" rx="8" fill="rgba(99, 102, 241, 0.25)" stroke="rgba(129, 140, 248, 0.3)"/>
        <text x="194" y="21" font-size="12" fill="#e0e7ff">优化一下当前工程的性能并跑通测试</text>
      </g>

      <!-- Message Bubble 2 (Agent & Tool Steps) -->
      <g transform="translate(20, 104)">
        <rect x="0" y="0" width="430" height="126" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(52, 211, 153, 0.25)"/>
        
        <!-- Tool Call Progress Step 1 -->
        <circle cx="20" cy="22" r="5" fill="#34d399"/>
        <text x="34" y="26" font-size="11" font-weight="600" fill="#a7f3d0">tool_search</text>
        <text x="115" y="26" font-size="11" fill="#64748b">检索慢查询与大内存操作 ... 命中 4 处</text>

        <!-- Tool Call Progress Step 2 -->
        <circle cx="20" cy="50" r="5" fill="#34d399"/>
        <text x="34" y="54" font-size="11" font-weight="600" fill="#a7f3d0">tool_edit_file</text>
        <text x="125" y="54" font-size="11" fill="#94a3b8">精确替换 models/app-db.js 缓冲逻辑</text>

        <!-- Tool Call Progress Step 3 -->
        <circle cx="20" cy="78" r="5" fill="#60a5fa"/>
        <text x="34" y="82" font-size="11" font-weight="600" fill="#93c5fd">tool_run_command</text>
        <text x="160" y="82" font-size="11" fill="#94a3b8">npm test (安全命令沙箱验证)</text>

        <!-- Step Output -->
        <rect x="14" y="94" width="402" height="24" rx="5" fill="rgba(0,0,0,0.3)"/>
        <text x="24" y="110" font-size="11" font-family="monospace" fill="#34d399">✔ 166 suites passed, 1079 tests completed in 16.6s</text>
      </g>

      <!-- Composer Bar -->
      <g transform="translate(20, 246)">
        <rect x="0" y="0" width="430" height="48" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(148, 163, 184, 0.3)"/>
        <text x="16" y="28" font-size="12" fill="#64748b">给 Dragon Claw 发消息… (Enter 发送 · Shift+Enter 换行)</text>
        <circle cx="406" cy="24" r="14" fill="url(#accentGreen)"/>
        <path d="M 401 24 L 406 19 L 411 24 M 406 19 L 406 29" stroke="#064e3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>

    <!-- Column 3: Right Agent Workspace Panel -->
    <g transform="translate(816, 148)" filter="url(#shadow)">
      <rect width="336" height="310" rx="14" fill="url(#cardGrad)" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
      
      <!-- Card Header -->
      <path d="M 0 14 Q 0 0 14 0 L 322 0 Q 336 0 336 14 L 336 44 L 0 44 Z" fill="rgba(15, 23, 42, 0.6)"/>
      <text x="18" y="26" font-size="13" font-weight="700" fill="#f8fafc">本地工作区 (Workspace Panel)</text>
      <rect x="250" y="10" width="70" height="24" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(52, 211, 153, 0.4)"/>
      <text x="260" y="26" font-size="11" font-weight="700" fill="#34d399">auto 模式</text>

      <!-- Environment / Path -->
      <g transform="translate(16, 54)">
        <text x="0" y="12" font-size="11" font-weight="600" fill="#64748b">挂载根目录 (WORKSPACE ROOT)</text>
        <rect x="0" y="20" width="304" height="28" rx="6" fill="rgba(0,0,0,0.35)"/>
        <text x="10" y="38" font-size="11" font-family="monospace" fill="#93c5fd">~/06-工具开发/privacy-policy</text>
        <text x="266" y="38" font-size="11" fill="#38bdf8">main</text>
      </g>

      <!-- Context Usage Breakdown -->
      <g transform="translate(16, 118)">
        <text x="0" y="12" font-size="11" font-weight="600" fill="#64748b">TOKEN 上下文用量 (CONTEXT BUDGET)</text>
        <text x="248" y="12" font-size="11" font-weight="700" fill="#a7f3d0">34% 已使用</text>
        
        <!-- Multi-segment meter bar -->
        <rect x="0" y="20" width="304" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
        <rect x="0" y="20" width="56" height="10" rx="5" fill="#38bdf8"/>
        <rect x="58" y="20" width="32" height="10" fill="#818cf8"/>
        <rect x="92" y="20" width="16" height="10" fill="#f59e0b"/>
        <rect x="110" y="20" width="22" height="10" fill="#10b981"/>

        <!-- Legend -->
        <g transform="translate(0, 38)" font-size="10" fill="#94a3b8">
          <circle cx="4" cy="4" r="3" fill="#38bdf8"/><text x="12" y="7">消息</text>
          <circle cx="54" cy="4" r="3" fill="#818cf8"/><text x="62" y="7">目录</text>
          <circle cx="104" cy="4" r="3" fill="#f59e0b"/><text x="112" y="7">系统</text>
          <circle cx="154" cy="4" r="3" fill="#10b981"/><text x="162" y="7">工具</text>
          <circle cx="204" cy="4" r="3" fill="#475569"/><text x="212" y="7">剩余66%</text>
        </g>
      </g>

      <!-- File Changes & Git PR Actions -->
      <g transform="translate(16, 186)">
        <text x="0" y="12" font-size="11" font-weight="600" fill="#64748b">变更追踪 (CHANGES · 2 文件)</text>
        <rect x="0" y="20" width="304" height="42" rx="6" fill="rgba(0,0,0,0.3)"/>
        <text x="10" y="38" font-size="11" fill="#e2e8f0">app-db.js</text>
        <text x="180" y="38" font-size="10" fill="#34d399">+12</text>
        <text x="204" y="38" font-size="10" fill="#f87171">-4</text>
        <text x="226" y="38" font-size="10" fill="#38bdf8">差异</text>
        <text x="260" y="38" font-size="10" fill="#fb7185">撤销</text>
        <text x="10" y="54" font-size="10" fill="#64748b">backend/models/app-db.js</text>

        <!-- GitHub PR Button -->
        <rect x="0" y="72" width="304" height="34" rx="8" fill="url(#accentPurple)"/>
        <text x="86" y="94" font-size="12" font-weight="700" fill="#ffffff">🚀 一键创建 GitHub PR</text>
      </g>
    </g>

    <!-- Bottom Feature Ticker -->
    <g transform="translate(48, 478)" font-size="11" fill="#94a3b8">
      <text x="0" y="16">🛡️ <tspan fill="#cbd5e1" font-weight="600">agent-path-guard</tspan> 路径沙箱</text>
      <text x="240" y="16">⚡ <tspan fill="#cbd5e1" font-weight="600">8 大生产级工具</tspan> (读/搜/编/删/跑)</text>
      <text x="490" y="16">🎯 <tspan fill="#cbd5e1" font-weight="600">单文件原子 Revert</tspan> 冲突防护</text>
      <text x="730" y="16">🌐 <tspan fill="#cbd5e1" font-weight="600">多模型 Tool Calling</tspan> 统一流式规范</text>
      <text x="980" y="16">🤖 <tspan fill="#cbd5e1" font-weight="600">全能智能体</tspan> 人设不设限</text>
    </g>
  </g>
</svg>

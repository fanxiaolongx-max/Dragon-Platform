function clawd(id,o){o=o||{};var w=300,h=Math.round(w*460/399);

  '<div id="'+id+'-sway" style="position:absolute;inset:0;transform-origin:50% 100%">'+
   '<div id="'+id+'-body" style="position:absolute;inset:0;transform-origin:50% 100%">'+

 '</div></div></div>'+

 '</div>';}

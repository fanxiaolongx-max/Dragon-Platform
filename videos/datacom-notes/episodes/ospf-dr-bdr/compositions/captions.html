</style><div data-hf-id="hf-980z" id="root" data-composition-id="ospf-dr-bdr-captions" data-width="1920" data-height="1080"><div data-hf-id="hf-k9w3" id="cap-ospf-dr-bdr-0" class="cap-line">咦，同一个交换机上的五台路由器</div><div data-hf-id="hf-q468" id="cap-ospf-dr-bdr-1" class="cap-line">为什么有的邻居停在 Two Way，却完全正常？</div><div data-hf-id="hf-uzg5" id="cap-ospf-dr-bdr-2" class="cap-line">我是小码</div><div data-hf-id="hf-wxp3" id="cap-ospf-dr-bdr-3" class="cap-line">今天开一场路由器班会，弄懂 D R、备用代表</div><div data-hf-id="hf-pvlz" id="cap-ospf-dr-bdr-4" class="cap-line">还有地图里的神秘伪节点</div><div data-hf-id="hf-i2px" id="cap-ospf-dr-bdr-5" class="cap-line">先把场景放简单：五台路由器，接在同一个广播网段</div><div data-hf-id="hf-a2ia" id="cap-ospf-dr-bdr-6" class="cap-line">大家用 Hello 确认彼此存在</div><div data-hf-id="hf-qcdd" id="cap-ospf-dr-bdr-7" class="cap-line">如果每两台都建立完整邻接</div><div data-hf-id="hf-am6u" id="cap-ospf-dr-bdr-8" class="cap-line">就要维护十组数据库同步关系</div><div data-hf-id="hf-x6kq" id="cap-ospf-dr-bdr-9" class="cap-line">人数越多，这张关系网越密</div><div data-hf-id="hf-bsjm" id="cap-ospf-dr-bdr-10" class="cap-line">于是选出主代表 D R，和备用代表 B D R</div><div data-hf-id="hf-1i8b" id="cap-ospf-dr-bdr-11" class="cap-line">其他成员，称为 D R Other</div><div data-hf-id="hf-h4ea" id="cap-ospf-dr-bdr-12" class="cap-line">大家都与这两位建立 Full</div><div data-hf-id="hf-0c5e" id="cap-ospf-dr-bdr-13" class="cap-line">普通成员彼此保持 Two Way</div><div data-hf-id="hf-0dpa" id="cap-ospf-dr-bdr-14" class="cap-line">五台设备，完整邻接是七组，不是四组</div><div data-hf-id="hf-jdq6" id="cap-ospf-dr-bdr-15" class="cap-line">代表怎么选？</div><div data-hf-id="hf-3g4m" id="cap-ospf-dr-bdr-16" class="cap-line">优先级为零，表示我不参选；不是我不参加通信</div><div data-hf-id="hf-q1kg" id="cap-ospf-dr-bdr-17" class="cap-line">符合条件的候选者，比较接口优先级，数字大者优先</div><div data-hf-id="hf-g356" id="cap-ospf-dr-bdr-18" class="cap-line">相同再比较 Router ID</div><div data-hf-id="hf-tt82" id="cap-ospf-dr-bdr-19" class="cap-line">注意：这是选举规则，不是随时抢位的排行榜</div><div data-hf-id="hf-4ids" id="cap-ospf-dr-bdr-20" class="cap-line">假设代表已经选好</div><div data-hf-id="hf-mmlo" id="cap-ospf-dr-bdr-21" class="cap-line">一台优先级更高的新设备才上线</div><div data-hf-id="hf-1q81" id="cap-ospf-dr-bdr-22" class="cap-line">它不会直接赶走现任</div><div data-hf-id="hf-204e" id="cap-ospf-dr-bdr-23" class="cap-line">选举要考虑 Hello 里大家已经声明的角色</div><div data-hf-id="hf-wf1p" id="cap-ospf-dr-bdr-24" class="cap-line">并非每次都重新选最大值</div><div data-hf-id="hf-457z" id="cap-ospf-dr-bdr-25" class="cap-line">这个不抢占的设计</div><div data-hf-id="hf-luu4" id="cap-ospf-dr-bdr-26" class="cap-line">是为了减少角色和邻接反复震荡</div><div data-hf-id="hf-nn04" id="cap-ospf-dr-bdr-27" class="cap-line">再看一次消息传递</div><div data-hf-id="hf-fwi9" id="cap-ospf-dr-bdr-28" class="cap-line">广播网段上</div><div data-hf-id="hf-bu1f" id="cap-ospf-dr-bdr-29" class="cap-line">普通成员通常把需要泛洪的更新发给组播地址点六</div><div data-hf-id="hf-eilz" id="cap-ospf-dr-bdr-30" class="cap-line">主、备代表都能接收</div><div data-hf-id="hf-cplj" id="cap-ospf-dr-bdr-31" class="cap-line">主代表再向点五传播给所有成员</div><div data-hf-id="hf-v3k3" id="cap-ospf-dr-bdr-32" class="cap-line">这是典型流程；确认、重传等细节</div><div data-hf-id="hf-cv75" id="cap-ospf-dr-bdr-33" class="cap-line">还要按协议状态处理</div><div data-hf-id="hf-v1q7" id="cap-ospf-dr-bdr-34" class="cap-line">接下来换一副眼镜：从同步关系</div><div data-hf-id="hf-zmkb" id="cap-ospf-dr-bdr-35" class="cap-line">切换到计算路径的地图</div><div data-hf-id="hf-6zjg" id="cap-ospf-dr-bdr-36" class="cap-line">D R 生成二类 Network LSA</div><div data-hf-id="hf-9me6" id="cap-ospf-dr-bdr-37" class="cap-line">把这个共享网段画成一个伪节点</div><div data-hf-id="hf-48ys" id="cap-ospf-dr-bdr-38" class="cap-line">所有相关路由器连向它</div><div data-hf-id="hf-a8et" id="cap-ospf-dr-bdr-39" class="cap-line">这个点代表网段，不代表多出来一台真实设备</div><div data-hf-id="hf-9ybi" id="cap-ospf-dr-bdr-40" class="cap-line">最容易混淆的是：地图上的伪节点</div><div data-hf-id="hf-yxn9" id="cap-ospf-dr-bdr-41" class="cap-line">不等于数据转发中心</div><div data-hf-id="hf-7v3e" id="cap-ospf-dr-bdr-42" class="cap-line">看，R3 要发给同一网段的 R4</div><div data-hf-id="hf-1a1r" id="cap-ospf-dr-bdr-43" class="cap-line">数据可以直接交给 R4，并不先绕去 D R</div><div data-hf-id="hf-foii" id="cap-ospf-dr-bdr-44" class="cap-line">代表负责控制平面的协调，实际怎么转发</div><div data-hf-id="hf-mh7g" id="cap-ospf-dr-bdr-45" class="cap-line">仍看路由和下一跳</div><div data-hf-id="hf-3wux" id="cap-ospf-dr-bdr-46" class="cap-line">如果主代表故障，备用代表接任，再选新的备用</div><div data-hf-id="hf-7d6m" id="cap-ospf-dr-bdr-47" class="cap-line">备用平时也与大家保持完整邻接，参与数据库同步</div><div data-hf-id="hf-62yy" id="cap-ospf-dr-bdr-48" class="cap-line">并不是睡着的冷备</div><div data-hf-id="hf-sotw" id="cap-ospf-dr-bdr-49" class="cap-line">接班要先检测故障，再更新相关状态</div><div data-hf-id="hf-ad6g" id="cap-ospf-dr-bdr-50" class="cap-line">不能把它理解成零时间、零丢包的保证</div><div data-hf-id="hf-dlko" id="cap-ospf-dr-bdr-51" class="cap-line">还有两个边界：D R 是具体网段上的接口角色</div><div data-hf-id="hf-68bx" id="cap-ospf-dr-bdr-52" class="cap-line">同一台路由器，可以在这里当代表</div><div data-hf-id="hf-fpa0" id="cap-ospf-dr-bdr-53" class="cap-line">在另一个网段当普通成员</div><div data-hf-id="hf-pla4" id="cap-ospf-dr-bdr-54" class="cap-line">广播和非广播多路访问网络使用这套机制</div><div data-hf-id="hf-ugrd" id="cap-ospf-dr-bdr-55" class="cap-line">点到点网络不选代表</div><div data-hf-id="hf-bdza" id="cap-ospf-dr-bdr-56" class="cap-line">不能只凭线缆是以太网就下结论</div><div data-hf-id="hf-hhaa" id="cap-ospf-dr-bdr-57" class="cap-line">最后来个小测验</div><div data-hf-id="hf-di2u" id="cap-ospf-dr-bdr-58" class="cap-line">两个普通成员之间停在 Two Way</div><div data-hf-id="hf-cb02" id="cap-ospf-dr-bdr-59" class="cap-line">要立刻重启吗？</div><div data-hf-id="hf-2v9b" id="cap-ospf-dr-bdr-60" class="cap-line">不用，先看它们是否都已与主、备代表 Full</div><div data-hf-id="hf-ilxn" id="cap-ospf-dr-bdr-61" class="cap-line">若应当 Full 的邻接长期卡住</div><div data-hf-id="hf-tqch" id="cap-ospf-dr-bdr-62" class="cap-line">再检查参数、网络类型和报文</div><div data-hf-id="hf-axtz" id="cap-ospf-dr-bdr-63" class="cap-line">先辨角色，再查状态</div><div data-hf-id="hf-1j1h" id="cap-ospf-dr-bdr-64" class="cap-line">收好今天的三幅图：第一，邻接图</div><div data-hf-id="hf-n0ko" id="cap-ospf-dr-bdr-65" class="cap-line">主、备代表减少同步关系；第二，拓扑图</div><div data-hf-id="hf-r6m2" id="cap-ospf-dr-bdr-66" class="cap-line">伪节点代表共享网段；第三，转发图</div><div data-hf-i

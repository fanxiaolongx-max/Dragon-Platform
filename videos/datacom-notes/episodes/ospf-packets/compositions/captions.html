.guide{font-size:26px}.guide b{font-size:26px}.tag-strip span{font-size:28px}</style><div id="root" data-composition-id="ospf-packets-captions" data-width="1920" data-height="1080"><div id="cap-ospf-packets-0" class="cap-line">两台路由器刚见面</div><div id="cap-ospf-packets-1" class="cap-line">总不能把整本地图一股脑扔过去吧？</div><div id="cap-ospf-packets-2" class="cap-line">我是小码</div><div id="cap-ospf-packets-3" class="cap-line">今天跟着一次地图交接，认识 OSPF 的五种报文</div><div id="cap-ospf-packets-4" class="cap-line">从打招呼，到比目录、补内容、确认收货</div><div id="cap-ospf-packets-5" class="cap-line">把它们放进同一个故事，缩写就不难记了</div><div id="cap-ospf-packets-6" class="cap-line">先看信封</div><div id="cap-ospf-packets-7" class="cap-line">OSPFv2 直接封装在 IP 里，协议号是八十九</div><div id="cap-ospf-packets-8" class="cap-line">不使用 TCP 或 UDP 端口</div><div id="cap-ospf-packets-9" class="cap-line">每种 OSPF 报文都有二十四字节的公共头</div><div id="cap-ospf-packets-10" class="cap-line">记录版本、报文类型、长度、路由器标识、区域和校验认证信息</div><div id="cap-ospf-packets-11" class="cap-line">类型字段选的是五种报文，不是 LSA 类型</div><div id="cap-ospf-packets-12" class="cap-line">第一种是 Hello</div><div id="cap-ospf-packets-13" class="cap-line">它负责发现和维持邻居，也帮助选举主、备代表</div><div id="cap-ospf-packets-14" class="cap-line">收到 Hello，不等于已经双向通信</div><div id="cap-ospf-packets-15" class="cap-line">只有在对方的邻居列表里看到自己</div><div id="cap-ospf-packets-16" class="cap-line">才确认双向可达</div><div id="cap-ospf-packets-17" class="cap-line">区域、计时器、认证和网络相关参数要相容</div><div id="cap-ospf-packets-18" class="cap-line">检查掩码时，还要考虑网络类型的例外</div><div id="cap-ospf-packets-19" class="cap-line">需要完整邻接的双方</div><div id="cap-ospf-packets-20" class="cap-line">先在 ExStart 协商主从和初始序列号</div><div id="cap-ospf-packets-21" class="cap-line">通常由路由器标识较大的一方作主</div><div id="cap-ospf-packets-22" class="cap-line">然后在 Exchange 交换 DD</div><div id="cap-ospf-packets-23" class="cap-line">也叫数据库描述报文</div><div id="cap-ospf-packets-24" class="cap-line">里面主要是一条条完整的二十字节 LSA 头</div><div id="cap-ospf-packets-25" class="cap-line">就像先比图书目录，不是先搬整座图书馆</div><div id="cap-ospf-packets-26" class="cap-line">比完目录，发现缺书或版本落后，就发第三种报文</div><div id="cap-ospf-packets-27" class="cap-line">链路状态请求，也就是 LSR</div><div id="cap-ospf-packets-28" class="cap-line">请求项只写三样：类型、链路状态标识、通告路由器</div><div id="cap-ospf-packets-29" class="cap-line">它按身份点名，不带序列号</div><div id="cap-ospf-packets-30" class="cap-line">对方会发送当前可提供的实例；收到正文后</div><div id="cap-ospf-packets-31" class="cap-line">仍要按协议检查它的新旧和有效性</div><div id="cap-ospf-packets-32" class="cap-line">第四种是链路状态更新，也就是 LSU</div><div id="cap-ospf-packets-33" class="cap-line">一个更新报文能装一条或多条完整 LSA</div><div id="cap-ospf-packets-34" class="cap-line">所以报文、LSA、数据库，是三个层次</div><div id="cap-ospf-packets-35" class="cap-line">LSA 是一张地图资料卡</div><div id="cap-ospf-packets-36" class="cap-line">LSU 是运输这些卡片的信封</div><div id="cap-ospf-packets-37" class="cap-line">LSDB 是收好卡片的资料库</div><div id="cap-ospf-packets-38" class="cap-line">网络变化时，更新也会通过这套泛洪机制传播</div><div id="cap-ospf-packets-39" class="cap-line">第五种是链路状态确认，也就是 LSAck</div><div id="cap-ospf-packets-40" class="cap-line">它携带被确认 LSA 的头部</div><div id="cap-ospf-packets-41" class="cap-line">让发送方撤下对应的重传项</div><div id="cap-ospf-packets-42" class="cap-line">要注意，有些场合收到对方泛洪来的同一实例</div><div id="cap-ospf-packets-43" class="cap-line">也能形成隐式确认，不一定每次都单独回一包</div><div id="cap-ospf-packets-44" class="cap-line">OSPF 自己维护确认和重传</div><div id="cap-ospf-packets-45" class="cap-line">可靠泛洪不依赖 TCP</div><div id="cap-ospf-packets-46" class="cap-line">把过程串起来：Hello 建立双向认识</div><div id="cap-ospf-packets-47" class="cap-line">DD 对目录，LSR 点名，LSU 补正文</div><div id="cap-ospf-packets-48" class="cap-line">确认让可靠交换收尾</div><div id="cap-ospf-packets-49" class="cap-line">初次同步完成，可以进入 Full</div><div id="cap-ospf-packets-50" class="cap-line">但这不是五步只跑一次：Hello 持续保活</div><div id="cap-ospf-packets-51" class="cap-line">拓扑变化还会继续发送更新和确认</div><div id="cap-ospf-packets-52" class="cap-line">普通成员之间，也可能正常停在 Two Way</div><div id="cap-ospf-packets-53" class="cap-line">如果应当完整邻接的两端</div><div id="cap-ospf-packets-54" class="cap-line">长期卡在 ExStart 或 Exchange</div><div

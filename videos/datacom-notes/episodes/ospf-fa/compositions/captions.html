</style><div data-hf-id="hf-6d4l" id="root" data-composition-id="ospf-fa-captions" data-width="1920" data-height="1080"><div data-hf-id="hf-zay0" id="cap-ospf-fa-0" class="cap-line">假设有人告诉你，快递从旁边的出口送更近</div><div data-hf-id="hf-xfco" id="cap-ospf-fa-1" class="cap-line">你会先绕到告诉你的人家里吗？</div><div data-hf-id="hf-mquz" id="cap-ospf-fa-2" class="cap-line">我是小码</div><div data-hf-id="hf-rzje" id="cap-ospf-fa-3" class="cap-line">今天看懂转发地址 F A：它把谁发布路由</div><div data-hf-id="hf-qfir" id="cap-ospf-fa-4" class="cap-line">和数据应该朝哪里走，分开表达</div><div data-hf-id="hf-9rao" id="cap-ospf-fa-5" class="cap-line">先认识一张外部路由通告</div><div data-hf-id="hf-e6z1" id="cap-ospf-fa-6" class="cap-line">目的前缀，说明业务要去哪里</div><div data-hf-id="hf-nxq1" id="cap-ospf-fa-7" class="cap-line">Advertising Router</div><div data-hf-id="hf-xqs4" id="cap-ospf-fa-8" class="cap-line">记录谁生成这条 LSA</div><div data-hf-id="hf-gfv7" id="cap-ospf-fa-9" class="cap-line">Forwarding Address</div><div data-hf-id="hf-u3k4" id="cap-ospf-fa-10" class="cap-line">提供计算转发方向的地址</div><div data-hf-id="hf-15vt" id="cap-ospf-fa-11" class="cap-line">这三个字段回答不同问题，不能因为发布者是 R3</div><div data-hf-id="hf-sntm" id="cap-ospf-fa-12" class="cap-line">就认为数据必须经过 R3</div><div data-hf-id="hf-rs52" id="cap-ospf-fa-13" class="cap-line">来看这张小地图：R1 是内部观察者</div><div data-hf-id="hf-z7x7" id="cap-ospf-fa-14" class="cap-line">R2、R3 和外部网关，接在同一个以太网</div><div data-hf-id="hf-hqzj" id="cap-ospf-fa-15" class="cap-line">R3 引入外部路由，叫作自治系统边界路由器</div><div data-hf-id="hf-03sm" id="cap-ospf-fa-16" class="cap-line">简称 ASBR</div><div data-hf-id="hf-gb6x" id="cap-ospf-fa-17" class="cap-line">R2 连接两个区域，是区域边界路由器，简称 ABR</div><div data-hf-id="hf-9z5b" id="cap-ospf-fa-18" class="cap-line">外部网关不运行 OSPF</div><div data-hf-id="hf-e3o0" id="cap-ospf-fa-19" class="cap-line">但它所在网段在内部可达</div><div data-hf-id="hf-y1ez" id="cap-ospf-fa-20" class="cap-line">我们比较两种 F A</div><div data-hf-id="hf-795e" id="cap-ospf-fa-21" class="cap-line">第一种，F A 等于零点零点零点零</div><div data-hf-id="hf-on40" id="cap-ospf-fa-22" class="cap-line">它不是丢包地址，而是一个约定：先按内部路由</div><div data-hf-id="hf-9grn" id="cap-ospf-fa-23" class="cap-line">到达发布这条外部路由的边界路由器</div><div data-hf-id="hf-vt3l" id="cap-ospf-fa-24" class="cap-line">于是包从 R1 到 R2，再交给 R3</div><div data-hf-id="hf-opgg" id="cap-ospf-fa-25" class="cap-line">最后由 R3 发给外部网关</div><div data-hf-id="hf-jyx4" id="cap-ospf-fa-26" class="cap-line">在这个共享网段的例子里，多了一次折返</div><div data-hf-id="hf-dyc9" id="cap-ospf-fa-27" class="cap-line">第二种，转发地址填外部网关的地址</div><div data-hf-id="hf-lx3b" id="cap-ospf-fa-28" class="cap-line">R1 先查怎样到达这个地址，下一跳仍是 R2</div><div data-hf-id="hf-rytq" id="cap-ospf-fa-29" class="cap-line">R2 发现网关就在本地网段，可以直接送过去</div><div data-hf-id="hf-t2wt" id="cap-ospf-fa-30" class="cap-line">看，发布者还是 R3，业务流量却绕开了它</div><div data-hf-id="hf-5ae4" id="cap-ospf-fa-31" class="cap-line">这才是这个例子优化路径的关键</div><div data-hf-id="hf-kr11" id="cap-ospf-fa-32" class="cap-line">停一下，这里特别容易背错</div><div data-hf-id="hf-dypw" id="cap-ospf-fa-33" class="cap-line">非零 F A</div><div data-hf-id="hf-wx9v" id="cap-ospf-fa-34" class="cap-line">不等于每台路由器都能直接对它做地址解析</div><div data-hf-id="hf-ojle" id="cap-ospf-fa-35" class="cap-line">R1 离外部网关还远，所以先发给 R2</div><div data-hf-id="hf-zitn" id="cap-ospf-fa-36" class="cap-line">F A 是递归查找的目标，路由表里的直接下一跳</div><div data-hf-id="hf-xrxz" id="cap-ospf-fa-37" class="cap-line">要从到达目标的路径推导出来</div><div data-hf-id="hf-ghnx" id="cap-ospf-fa-38" class="cap-line">如果通告已经收到</div><div data-hf-id="hf-mu1f" id="cap-ospf-fa-39" class="cap-line">可是查不到到达 F A 的区域内或区域间路径呢？</div><div data-hf-id="hf-gulg" id="cap-ospf-fa-40" class="cap-line">这条外部通告就不能据此安装路由</div><div data-hf-id="hf-me1s" id="cap-ospf-fa-41" class="cap-line">只靠另一条外部路由来兜这个 F A</div><div data-hf-id="hf-s9cg" id="cap-ospf-fa-42" class="cap-line">也不满足这条计算规则</div><div data-hf-id="hf-4ers" id="cap-ospf-fa-43" class="cap-line">因此，数据库里有 LSA</div><div data-hf-id="hf-n4db" id="cap-ospf-fa-44" class="cap-line">不代表路由表里一定有对应路由</div><div data-hf-id="hf-gkbs" id="cap-ospf-fa-45" class="cap-line">那发布者什么时候能填非零地址？</div><div data-hf-id="hf-j10b" id="cap-ospf-fa-46" class="cap-line">要看引入路由的下一跳、出接口是否参与 OSPF</div><div data-hf-id="hf-67b3" id="cap-ospf-fa-47" class="cap-line">以及网络类型等条件，具体还要核对设备实现</div><div data-hf-id="hf-bb1m" id="cap-ospf-fa-48" class="cap-line">不要把这个教学例子</div><div data-hf-id="hf-if9c" id="cap-ospf-fa-49" class="cap-line">当成所有外部路由的固定模板</div><div data-hf-id="hf-5ldx" id="cap-ospf-fa-50" class="cap-line">F A 非零，也不保证每张拓扑都能绕过边界路由器</div><div data-hf-id="hf-zyvh" id="cap-ospf-fa-51" class="cap-line">再向前一步</div><div data-hf-id="hf-l4pc" id="cap-ospf-fa-52" class="cap-line">NSSA 是允许本地引入外部路由的一种特殊区域</div><div data-hf-id="hf-zep4" id="cap-ospf-fa-53" class="cap-line">七类通告翻译成五类时</div><div data-hf-id="hf-hxln" id="cap-ospf-fa-54" class="cap-line">发布者会变成执行翻译的边界路由器</div><div data-hf-id="hf-4fmx" id="cap-ospf-fa-55" class="cap-line">保留下来的 F A，继续指明转发目标</div><div data-hf-id="hf-cq4h" id="cap-ospf-fa-56" class="cap-line">普通翻译通常要求 P 位请求传播，且 F A 非零</div><div data-hf-id="hf-t9i2" id="cap-ospf-fa-57" class="cap-line">但这只是资格条件</div><div data-hf-id="hf-m97d" id="cap-ospf-fa-58" class="cap-line">还要满足翻译者与路由处理规则</div><div data-hf-id="hf-67gk" id="cap-ospf-fa-59" class="cap-line">排障可以按三步走</div><div data-hf-id="hf-fhqc" id="cap-ospf-fa-60" class="cap-line">先看外部 LSA，确认前缀、发布者和 F A</div><div data-hf-id="hf-vuux" id="cap-ospf-fa-61" class="cap-line">再查到 F A 的内部路径，以及真正解析出的下一跳</div><div data-hf-id="hf-i8pr" id="cap-ospf-fa-62" class="cap-line">最后核对业务路由和实际转发</div><div data-hf-id="hf-xxty" id="cap-ospf-fa-63" class="cap-line">在 NSSA，还要看 P 位与翻译者状态</div><div data-hf-id="hf-u950" id="cap-ospf-fa-64" class="cap-line">别只盯着一个字段就下结论</div><div data-hf-id="hf-okbd" id="cap-ospf-fa-65" class="cap-line">最后，用两张卡记住它：发布者像名片</div><div data-hf-id="hf-5hfb" id="cap-ospf-fa-66" class="cap-line">告诉你谁提供消息；转发地址像导航卡</div><div data-hf-id="hf-zulp" id="cap-ospf-fa-67" class="cap-line">告诉你沿哪个目标去计算路径</div><div data-hf-id="hf-es5b" id="cap-ospf-fa-68" class="cap-line">为零，先找发布者；非零，先核对内部可达性</div><div data-hf-id="hf-km50" id="cap-ospf-fa-69" class="cap-line">再递归解析</div><div data-hf-id="hf-s0xc" id="cap-ospf-fa-70" class="cap-line">分清消息的来源和数据的方向，F A 就不神秘了</div></div><script>(function(){const tl=gsap.timeline({paused:true});tl.fromTo("#cap-ospf-fa-0",{opacity:0},{opacity:1,duration:.1},0.651);tl.set("#cap-ospf-fa-0",{opacity:0},4.577999999999999);tl.fromTo("#cap-ospf-fa-1",{opacity:0},{opacity:1,duration:.1},5.053);tl.set("#cap-ospf-fa-1",{opacity:0},7.2829999999999995);tl.fromTo("#cap-ospf-fa-2",{opacity:0},{opacity:1,duration:.1},7.757);tl.set("#cap-ospf-fa-2",{opacity:0},8.737);tl.fromTo("#cap-ospf-fa-3",{opacity:0},{opacity:1,duration:.1},9.223);tl.set("#cap-ospf-fa-3",{opacity:0},13.264999999999999);tl.fromTo("#cap-ospf-fa-4",{opacity:0},{opacity:1,duration:.1},13.382);tl.set("#cap-ospf-fa-4",{opacity:0},16.262);tl.fromTo("#cap-ospf-fa-5",{opacity:0},{opacity:1,duration:.1},18.325);tl.set("#cap-ospf-fa-5",{opacity:0},20.504);tl.fromTo("#cap-ospf-fa-6",{opacity:0},{opacity:1,duration:.1},20.992);tl.set("#cap-ospf-fa-6",{opacity:0},23.745);tl.fromTo("#cap-ospf-fa-7",{opacity:0},{opacity:1,duration:.1},24.232);tl.set("#cap-ospf-fa-7",{opacity:0},25.505000000000003);tl.fromTo("#cap-ospf-fa-8",{opacity:0},{opacity:1,duration:.1},25.724);tl.set("#cap-ospf-fa-8",{opacity:0},28.12);tl.fromTo("#cap-ospf-fa-9",{opacity:0},{opacity:1,duration:.1},28.607);tl.set("#cap-ospf-fa-9",{opacity:0},29.995);tl.fromTo("#cap-ospf-fa-10",{opacity:0},{opacity:1,duration:.1},30.176);tl.set("#cap-ospf-fa-10",{opacity:0},32.418);tl.fromTo("#cap-ospf-fa-11",{opacity:0},{opacity:1,duration:.1},32.905);tl.set("#cap-ospf-fa-11",{opacity:0},37.342);tl.fromTo("#cap-ospf-fa-12",{opacity:0},{opacity:1,duration:.1},37.535);tl.set("#cap-ospf-fa-12",{opacity:0},40.186);tl.fromTo("#cap-ospf-fa-13",{opacity:0},{opacity:1,duration:.1},42.239);tl.set("#cap-ospf-fa-13",{opacity:0},45.745000000000005);tl.fromTo("#cap-ospf-fa-14",{opacity:0},{opacity:1,duration:.1},46.22);tl.set("#cap-ospf-fa-14",{opacity:0},50.337);tl.fromTo("#cap-ospf-f

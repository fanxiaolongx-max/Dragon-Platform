.guide{font-size:26px}.guide b{font-size:26px}.tag-strip span{font-size:28px}</style><div id="root" data-composition-id="ospf-areas-captions" data-width="1920" data-height="1080"><div id="cap-ospf-areas-0" class="cap-line">总部地图很大，分支却常常只关心，出门往哪儿走</div><div id="cap-ospf-areas-1" class="cap-line">是不是一定要记住全网每一条外部路由？</div><div id="cap-ospf-areas-2" class="cap-line">我是小码</div><div id="cap-ospf-areas-3" class="cap-line">这一集把区域边界画成一扇有规则的门</div><div id="cap-ospf-areas-4" class="cap-line">看普通区域、末节区域和 NSSA</div><div id="cap-ospf-areas-5" class="cap-line">怎样取舍地图的细节</div><div id="cap-ospf-areas-6" class="cap-line">先画骨架</div><div id="cap-ospf-areas-7" class="cap-line">区域零是骨干</div><div id="cap-ospf-areas-8" class="cap-line">区域一和区域二通过边界路由器与骨干连接</div><div id="cap-ospf-areas-9" class="cap-line">常规区域间路由借助骨干传播</div><div id="cap-ospf-areas-10" class="cap-line">每个区域维护自己的链路状态视图</div><div id="cap-ospf-areas-11" class="cap-line">一二类拓扑资料不会原样跨过去</div><div id="cap-ospf-areas-12" class="cap-line">区域编号只是标识，不表示层级越大越偏远</div><div id="cap-ospf-areas-13" class="cap-line">这里先讲连续骨干的正常设计</div><div id="cap-ospf-areas-14" class="cap-line">普通区域保留区域内的一二类资料</div><div id="cap-ospf-areas-15" class="cap-line">也可以接收三类区域间前缀</div><div id="cap-ospf-areas-16" class="cap-line">以及相关四类和五类外部信息</div><div id="cap-ospf-areas-17" class="cap-line">说可以接收，不是每张网络都一定存在这些类型</div><div id="cap-ospf-areas-18" class="cap-line">比如没有外部引入，就可能没有五类</div><div id="cap-ospf-areas-19" class="cap-line">也不是把所有区域的完整拓扑塞到一起</div><div id="cap-ospf-areas-20" class="cap-line">末节区域，也就是 Stub，不接收五类外部 LSA</div><div id="cap-ospf-areas-21" class="cap-line">也不需要四类的外部发布者路标</div><div id="cap-ospf-areas-22" class="cap-line">三类区域间前缀仍然可以进入</div><div id="cap-ospf-areas-23" class="cap-line">边界路由器向里面发布三类缺省路由</div><div id="cap-ospf-areas-24" class="cap-line">让未匹配的目的地交给边界</div><div id="cap-ospf-areas-25" class="cap-line">标准 Stub 内部不能放一位引入外部路由的 ASBR</div><div id="cap-ospf-areas-26" class="cap-line">区域属性也要在成员间保持一致</div><div id="cap-ospf-areas-27" class="cap-line">如果分支连其他区域的明细也不想保存</div><div id="cap-ospf-areas-28" class="cap-line">常见厂商支持 Totally Stub</div><div id="cap-ospf-areas-29" class="cap-line">它在 Stub 基础上</div><div id="cap-ospf-areas-30" class="cap-line">再抑制普通的三类区域间明细</div><div id="cap-ospf-areas-31" class="cap-line">只留下三类缺省路由；区域内一二类资料仍然保留</div><div id="cap-ospf-areas-32" class="cap-line">这个名称和配置属于实现扩展</div><div id="cap-ospf-areas-33" class="cap-line">部署时要核对设备文档，不能照搬另一家命令</div><div id="cap-ospf-areas-34" class="cap-line">但有个分支，自己还连着一套外部网络</div><div id="cap-ospf-areas-35" class="cap-line">需要把路由引进来</div><div id="cap-ospf-areas-36" class="cap-line">普通 Stub 做不到，于是使用 NSSA</div><div id="cap-ospf-areas-37" class="cap-line">它同样阻挡从外面来的五类</div><div id="cap-ospf-areas-38" class="cap-line">却允许本区 ASBR 发布七类</div><div id="cap-ospf-areas-39" class="cap-line">普通 NSSA 仍可保留三类区域间前缀</div><div id="cap-ospf-areas-40" class="cap-line">符合翻译条件的七类</div><div id="cap-ospf-areas-41" class="cap-line">再由翻译边界转成五类给其他区域</div><div id="cap-ospf-areas-42" class="cap-line">这里最容易背错</div><div id="cap-ospf-areas-43" class="cap-line">NSSA 并不等于所有设备一定自动下发同一种缺省</div><div id="cap-ospf-areas-44" class="cap-line">普通 NSSA 常见使用七类缺省，但是否生成</div><div id="cap-ospf-areas-45" class="cap-line">以及有无条件，要看设备和配置</div><div id="cap-ospf-areas-46" class="cap-line">配置 no-summary 的 Totally NSSA</div><div id="cap-ospf-areas-47" class="cap-line">常见是边界发布三类缺省，同时保留本区七类</div><div id="cap-ospf-areas-48" class="cap-line">最终要查实际 LSA 类型、发布者和路由表</div><div id="cap-ospf-areas-49" class="cap-line">现在看转发</div><div id="cap-ospf-areas-50" class="cap-line">分支路由表里有一条区域内的十点一网段</div><div id="cap-ospf-areas-51" class="cap-line">还有一条零前缀缺省</div><div id="cap-ospf-areas-52" class="cap-line">目的地址属于十点一，就走更具体的路由</div><div id="cap-ospf-areas-53" class="cap-line">如果没有更具体的匹配，才使用缺省交给边界</div><div id="cap-ospf-areas-54" class="cap-line">先做最长前缀匹配</div><div id="cap-ospf-areas-55" class="cap-line">再谈同一前缀候选之间的优先级，不能把顺序颠倒</div><div id="cap-ospf-areas-56" class="cap-line">真正选型时，先问三个问题</div><div id="cap-ospf-areas-57" class="cap-line">分支有没有本地外部路由要引入？</div><div id="cap-ospf-areas-58" class="cap-line">需不需要保留其他区域的明细？</div><div id="cap-ospf-areas-59" class="cap-line">边界通告的缺省</div><div id="cap-ospf-areas-60" class="cap-line">在上游故障时能否仍代表可用出口？</div><div id="cap-ospf-areas-61" class="cap-line">简化数据库能减少信息量</div><div id="cap-ospf-areas-62" class="cap-line">但缺省只是一条方向指示</div><div id="cap-ospf-areas-63" class="cap-line">不会自动修复上游黑洞或错误出口</div><div id="cap-ospf-areas-64" class="cap-line">小测验：分支想阻挡总部的大量外部明细</div><div id="cap-ospf-areas-65" class="cap-line">又要把本地外部网段引进 OSPF</div><div id="cap-ospf-areas-66" class="cap-line">能直接选标准 Stub 吗？</div><div id="cap-ospf-areas-67" class="cap-line">答案是不能，应该评估 NSSA</div><div id="cap-ospf-areas-68" class="cap-line">随后再决定是否需要区域间明细，以及用哪种缺省</div><div id="cap-ospf-areas-69" class="cap-line">区域类型不是越封闭越高级</div><div id="cap-ospf-areas-70" class="cap-line">而是信息取舍要符合业务</div><div id="cap-ospf-areas-71" class="cap-line">最后记住三件事：第一，骨干连接区域</div><div id="cap-ospf-areas-72" class="cap-line">边界隔开拓扑细节</div><div id="cap-ospf-areas-73" class="cap-line">第二，Stub 挡外部，NSSA 允许本地七类</div><div id="cap-ospf-areas-74" class="cap-line">Totally 再减少区域间明细</div><div id="cap-ospf-areas-75" class="cap-line">第三，缺省怎么生成，要看实现和配置</div><div id="cap-ospf-areas-76" class="cap-line">真正转发先做最长前缀匹配</div><div id="cap-ospf-areas-77" class="cap-line">把门的规则和出口的可用性一起检查</div><div id="cap-ospf-areas-78" class="cap-line">才是完整的区域设计</div></div><script>(function(){const tl=gsap.timeline({paused:true});tl.fromTo("#cap-ospf-areas-0",{opacity:0},{opacity:1,duration:.1},0.651);tl.set("#cap-ospf-areas-0",{opacity:0},5.215);tl.fromTo("#cap-ospf-areas-1",{opacity:0},{opacity:1,duration:.1},5.69);tl.set("#cap-ospf-areas-1",{opacity:0},8.953999999999999);tl.fromTo("#cap-ospf-areas-2",{opacity:0},{opacity:1,duration:.1},9.44);tl.set("#cap-ospf-areas-2",{opacity:0},10.42);tl.fromTo("#cap-ospf-areas-3",{opacity:0},{opacity:1,duration:.1},10.907);tl.set("#cap-ospf-areas-3",{opacity:0},14.552999999999999);tl.fromTo("#cap-ospf-areas-4",{opacity:0

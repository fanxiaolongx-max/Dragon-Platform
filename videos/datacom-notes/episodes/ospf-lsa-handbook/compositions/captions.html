.guide{font-size:26px}.guide b{font-size:26px}.tag-strip span{font-size:28px}</style><div id="root" data-composition-id="ospf-lsa-handbook-captions" data-width="1920" data-height="1080"><div id="cap-ospf-lsa-handbook-0" class="cap-line">路由表写着去哪里、从哪儿走</div><div id="cap-ospf-lsa-handbook-1" class="cap-line">可是这些答案怎么来的？</div><div id="cap-ospf-lsa-handbook-2" class="cap-line">我是小码</div><div id="cap-ospf-lsa-handbook-3" class="cap-line">今天把 OSPF 的 LSA 当作一张张资料卡</div><div id="cap-ospf-lsa-handbook-4" class="cap-line">先认卡片，再拼地图，最后计算路径</div><div id="cap-ospf-lsa-handbook-5" class="cap-line">学完你会发现，收到一条消息，和装进一条可用路由</div><div id="cap-ospf-lsa-handbook-6" class="cap-line">中间还隔着好几道判断</div><div id="cap-ospf-lsa-handbook-7" class="cap-line">每张 LSA 都有二十字节的公共头</div><div id="cap-ospf-lsa-handbook-8" class="cap-line">在同一个泛洪作用域里</div><div id="cap-ospf-lsa-handbook-9" class="cap-line">类型、链路状态标识、通告路由器，三元组决定身份</div><div id="cap-ospf-lsa-handbook-10" class="cap-line">序列号、校验和、老化时间</div><div id="cap-ospf-lsa-handbook-11" class="cap-line">帮助比较同一身份的不同实例</div><div id="cap-ospf-lsa-handbook-12" class="cap-line">跨区域查数据库，还要带上区域上下文</div><div id="cap-ospf-lsa-handbook-13" class="cap-line">不能把三元组当作脱离作用域的万能编号</div><div id="cap-ospf-lsa-handbook-14" class="cap-line">先看一类，路由器 LSA</div><div id="cap-ospf-lsa-handbook-15" class="cap-line">每台路由器按它参与的区域</div><div id="cap-ospf-lsa-handbook-16" class="cap-line">描述自己的连接和开销</div><div id="cap-ospf-lsa-handbook-17" class="cap-line">图里 R1 到 R2 的代价是十，到 R3 是三十</div><div id="cap-ospf-lsa-handbook-18" class="cap-line">另一台路由器也会描述自己的方向</div><div id="cap-ospf-lsa-handbook-19" class="cap-line">因此不要先假定双向开销一定相同</div><div id="cap-ospf-lsa-handbook-20" class="cap-line">一类资料留在所属区域，不原样越过区域边界</div><div id="cap-ospf-lsa-handbook-21" class="cap-line">共享广播网段不能简单画成所有路由器之间的独立线路</div><div id="cap-ospf-lsa-handbook-22" class="cap-line">主代表用二类 LSA 描述这个网络和与它完整邻接的路由器</div><div id="cap-ospf-lsa-handbook-23" class="cap-line">包含自己</div><div id="cap-ospf-lsa-handbook-24" class="cap-line">计算图里，路由器连到网段，代价来自接口</div><div id="cap-ospf-lsa-handbook-25" class="cap-line">网段连回路由器的代价是零</div><div id="cap-ospf-lsa-handbook-26" class="cap-line">这个伪节点用来表达拓扑</div><div id="cap-ospf-lsa-handbook-27" class="cap-line">不代表数据必须绕主代表走</div><div id="cap-ospf-lsa-handbook-28" class="cap-line">到了区域边界</div><div id="cap-ospf-lsa-handbook-29" class="cap-line">边界路由器不会把另一片区域的全部细节原样搬进来</div><div id="cap-ospf-lsa-handbook-30" class="cap-line">它用三类 LSA 告诉你，某个前缀可达，代价是多少</div><div id="cap-ospf-lsa-handbook-31" class="cap-line">内部设备把到边界的开销，加上这张路标的开销</div><div id="cap-ospf-lsa-handbook-32" class="cap-line">注意，名字里有 summary</div><div id="cap-ospf-lsa-handbook-33" class="cap-line">并不表示它必然合并多个前缀</div><div id="cap-ospf-lsa-handbook-34" class="cap-line">地址聚合还要另外配置</div><div id="cap-ospf-lsa-handbook-35" class="cap-line">再看外部路由</div><div id="cap-ospf-lsa-handbook-36" class="cap-line">自治系统边界路由器用五类 LSA 宣告外部前缀</div><div id="cap-ospf-lsa-handbook-37" class="cap-line">其他区域还可能需要四类 LSA</div><div id="cap-ospf-lsa-handbook-38" class="cap-line">知道怎样到达这位边界路由器</div><div id="cap-ospf-lsa-handbook-39" class="cap-line">四类找发布者，五类说目的地</div><div id="cap-ospf-lsa-handbook-40" class="cap-line">若五类里的转发地址非零</div><div id="cap-ospf-lsa-handbook-41" class="cap-line">则还要按规则求到转发地址的内部路径</div><div id="cap-ospf-lsa-handbook-42" class="cap-line">两种字段别混在一起</div><div id="cap-ospf-lsa-handbook-43" class="cap-line">如果外部路由来自 NSSA</div><div id="cap-ospf-lsa-handbook-44" class="cap-line">区域内先用七类 LSA 表达</div><div id="cap-ospf-lsa-handbook-45" class="cap-line">符合翻译条件时，由翻译边界路由器生成五类</div><div id="cap-ospf-lsa-handbook-46" class="cap-line">传播到允许接收的其他区域</div><div id="cap-ospf-lsa-handbook-47" class="cap-line">不是所有七类都必然翻译</div><div id="cap-ospf-lsa-handbook-48" class="cap-line">还要看传播位、转发地址、翻译者和路由选择等条件</div><div id="cap-ospf-lsa-handbook-49" class="cap-line">七类本身仍留在 NSSA 里</div><div id="cap-ospf-lsa-handbook-50" class="cap-line">现在动手算一小段区域内路径</div><div id="cap-ospf-lsa-handbook-51" class="cap-line">R1 直达 R3 的开销是三十</div><div id="cap-ospf-lsa-handbook-52" class="cap-line">先到 R2 花十，再从 R2 到 R3 花五，总共十五</div><div id="cap-ospf-lsa-handbook-53" class="cap-line">于是去 R3 的更短路径经过 R2</div><div id="cap-ospf-lsa-handbook-54" class="cap-line">它们可以拥有一致的区域拓扑资料</div><div id="cap-ospf-lsa-handbook-55" class="cap-line">但每台设备以自己为根算树</div><div id="cap-ospf-lsa-handbook-56" class="cap-line">所以最后的下一跳并不相同</div><div id="cap-ospf-lsa-handbook-57" class="cap-line">外部路径又多一层</div><div id="cap-ospf-lsa-handbook-58" class="cap-line">拿相同外部前缀、相同外部路由类型的候选来比</div><div id="cap-ospf-lsa-handbook-59" class="cap-line">图里两个出口的外部代价分别是二十和十</div><div id="cap-ospf-lsa-handbook-60" class="cap-line">内部到出口的代价是五和三十</div><div id="cap-ospf-lsa-handbook-61" class="cap-line">E1 会相加，分别是二十五和四十</div><div id="cap-ospf-lsa-handbook-62" class="cap-line">E2 先比外部代价，因此更偏向外部十的出口</div><div id="cap-ospf-lsa-handbook-63" class="cap-line">若 E2 外部代价相同，再比较内部代价等规则</div><div id="cap-ospf-lsa-handbook-64" class="cap-line">同一身份的两份 LSA，先比较有符号序列号</div><div id="cap-ospf-lsa-handbook-65" class="cap-line">数值大的更新；相同，再比较校验和，大的更新</div><div id="cap-ospf-lsa-handbook-66" class="cap-line">还相同，如果只有一份达到最大老化时间</div><div id="cap-ospf-lsa-handbook-67" class="cap-line">它优先用于撤销</div><div id="cap-ospf-lsa-handbook-68" class="cap-line">否则年龄差超过九百秒时，较年轻的更新</div><div id="cap-ospf-lsa-handbook-69" class="cap-line">差距没有超过，就视为同一实例</div><div id="cap-ospf-lsa-handbook-70" class="cap-line">不能简单说，年龄小的永远胜出</div><div id="cap-ospf-lsa-handbook-71" class="cap-line">普通情况下，即使内容不变</div><div id="cap-ospf-lsa-handbook-72" class="cap-line">始发者也会在三十分钟左右刷新自己的 LSA</div><div id="cap-ospf-lsa-handbook-73" class="cap-line">更新序列号</div><div id="cap-ospf-lsa-handbook-74" class="cap-line">最大老化时间是一小时</div><div id="cap-ospf-lsa-handbook-75" class="cap-line">主动撤销时，也能把年龄设为最大值，再泛洪出去</div><div id="cap-ospf-lsa-handbook-76" class="cap-line">达到最大年龄并不是立刻无条件删除</div><div id="cap-ospf-lsa-handbook-77" class="cap-line">还要满足确认、同步等清理条件</div><div id="cap-ospf-lsa-handbook-78" class="cap-line">刷新、变化和撤销，是三件不同的事</div><div id="cap-ospf-lsa-handbook-79" class="cap-line">来个小测</div><div id="cap-ospf-lsa-handbook-80" class="cap-line">同一区域的路由器同步了相同的拓扑资料</div><div id="cap-ospf-lsa-handbook-81" class="cap-line">下一跳就必须完全一样吗？</div><div id="cap-ospf-lsa-handbook-82" class="cap-line">答案是不必</div><div id="cap-ospf-lsa-handbook-83" class="cap-line">每台设备以自己为根计算，所处位置不同</div><div id="cap-ospf-lsa-handbook-84" class="cap-line">下一跳当然可以不同</div><div id="cap-ospf-lsa-handbook-85" class="cap-line">还要检查发布信息是否有效、内部路径是否可达</div><div id="cap-ospf-lsa-handbook-86" class="cap-line">以及是否被其他候选路由优先选中</div><div id="cap-ospf-lsa-handbook-87" class="cap-line">把今天的知识折成三层：第一，识别资料卡</div><div id="cap-ospf-lsa-handbook-88" class="cap-line">分清身份、版本和作用域</div><div id="cap-ospf-lsa-handbook-89" class="cap-line">第二，一二类拼本区拓扑，三四类提供跨区路标</div><div id="cap-ospf-lsa-handbook-90" class="cap-line">五七类带来外部前缀</div><div id="cap-ospf-lsa-handbook-91" class="cap-line">第三，算出路径，再完成路由选择</div><div id="cap-ospf-lsa-handbook-92" class="cap-line">先分清资料和结果，面对一大屏数据库</div><div id="cap-ospf-lsa-handbook-93" class="cap-line">就能知道从哪里读起</div></div><script>(function(){const tl=gsap.timeline({paused:true});tl.fromTo("#cap-ospf-lsa-handbook-0",{opacity:0},{opacity:1,duration:.1},0.651);tl.set("#cap-ospf-lsa-handbook-0",{opacity:0},3.532);tl.fromTo("#cap-ospf-lsa-handbook-1",{opacity:0},{opacity:1,duration:.1},3.738);tl.set("#cap-ospf-lsa-handbook-1",{opacity:0},5.444999999999999);tl.fromTo("#cap-ospf-lsa-handbook-2",{opacity:0},{opacity:1,duration:.1},5.92);tl.set("#cap-ospf-lsa-handbook-2",{opacity:0},6.8999999999999995);tl.fromTo("#cap-ospf-lsa-handbook-3",{opacity:0},{opacity:1,duration:.1},7.387);tl.set("#cap-ospf-lsa-handbook-3",{opacity:0},11.9);tl.fromTo("#cap-ospf-lsa-handbook-4",{opacity:0},{opacity:1,duration:.1},12.068);tl.set("#cap-ospf-lsa-handbook-4",{opacity:0},15.599);tl.fromTo("#cap-ospf-lsa-handbook-5",{opacity:0},{opacity:1,duration:.1},16.086);tl.set("#cap-ospf-lsa-handbook-5",{opacity:0},20.701);tl.fromTo("#cap-ospf-lsa-handbook-6",{opacity:0},{opacity:1,durat

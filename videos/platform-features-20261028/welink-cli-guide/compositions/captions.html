<template><style>@font-face{font-family:GuideSans;src:url('assets/NotoSansSC.ttf')}#root{position:absolute;inset:0;pointer-events:none}.caption{position:absolute;left:165px;right:165px;top:899px;height:92px;display:flex;align-items:center;justify-content:center;z-index:30;font:500 42px/1.45 GuideSans;color:#fff}.caption span{background:#183047;padding:10px 28px;border-radius:12px;text-align:center}</style><div data-hf-id="hf-jn2k" id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div data-hf-id="hf-b8ad" id="cap-0-0" class="clip caption" data-start="0.452" data-duration="4.321" data-track-index="2"><span data-hf-id="hf-gdfg">开会前，你在聊天里找通知，在邮件里找附件</span></div><div data-hf-id="hf-ixsp" id="cap-0-1" class="clip caption" data-start="4.897" data-duration="3.524" data-track-index="2"><span data-hf-id="hf-2p7p">又去云空间翻材料。窗口越开越多</span></div><div data-hf-id="hf-j05e" id="cap-0-2" class="clip caption" data-start="8.610" data-duration="2.711" data-track-index="2"><span data-hf-id="hf-rd9z">真正要准备的内容还没整理好</span></div><div data-hf-id="hf-tezm" id="cap-0-3" class="clip caption" data-start="11.780" data-duration="2.028" data-track-index="2"><span data-hf-id="hf-0fb6">WeLink CLI 要解决的</span></div><div data-hf-id="hf-r59g" id="cap-0-4" class="clip caption" data-start="13.984" data-duration="2.195" data-track-index="2"><span data-hf-id="hf-gns4">就是这段反复找信息的路</span></div><div data-hf-id="hf-0r4p" id="cap-1-0" class="clip caption" data-start="17.652" data-duration="1.550" data-track-index="2"><span data-hf-id="hf-q91s">先分清两个能力</span></div><div data-hf-id="hf-e11n" id="cap-1-1" class="clip caption" data-start="19.365" data-duration="3.226" data-track-index="2"><span data-hf-id="hf-kvpt">WeLink SDK 是把平台助手接进 </span></div><div data-hf-id="hf-62cm" id="cap-1-2" class="clip caption" data-start="22.471" data-duration="2.465" data-track-index="2"><span data-hf-id="hf-84bn">WeLink；这一集的 CLI</span></div><div data-hf-id="hf-nbi1" id="cap-1-3" class="clip caption" data-start="25.076" data-duration="2.298" data-track-index="2"><span data-hf-id="hf-ipiz">是让电脑上的 Dragon Claw</span></div><div data-hf-id="hf-ghjz" id="cap-1-4" class="clip caption" data-start="27.524" data-duration="2.015" data-track-index="2"><span data-hf-id="hf-o07r">通过你已授权的个人身份</span></div><div data-hf-id="hf-rltr" id="cap-1-5" class="clip caption" data-start="29.650" data-duration="3.561" data-track-index="2"><span data-hf-id="hf-kees">查询 WeLink 办公信息。它看到什么</span></div><div data-hf-id="hf-2hh3" id="cap-1-6" class="clip caption" data-start="33.439" data-duration="2.981" data-track-index="2"><span data-hf-id="hf-t9ns">取决于这个账号本来就能访问什么</span></div><div data-hf-id="hf-pgyx" id="cap-2-0" class="clip caption" data-start="37.952" data-duration="3.947" data-track-index="2"><span data-hf-id="hf-i8sm">管理员进入全局设置、频道对接、WeLink</span></div><div data-hf-id="hf-pnjo" id="cap-2-1" class="clip caption" data-start="42.075" data-duration="4.052" data-track-index="2"><span data-hf-id="hf-pshq">找到个人身份卡片。检测本机 CLI</span></div><div data-hf-id="hf-cu1g" id="cap-2-2" class="clip caption" data-start="46.291" data-duration="3.625" data-track-index="2"><span data-hf-id="hf-bbwj">按页面提示扫码登录，再启用办公能力</span></div><div data-hf-id="hf-josj" id="cap-2-3" class="clip caption" data-start="50.389" data-duration="3.071" data-track-index="2"><span data-hf-id="hf-tjdd">邮件与日历还需要完成邮箱发现</span></div><div data-hf-id="hf-hg29" id="cap-2-4" class="clip caption" data-start="53.932" data-duration="3.716" data-track-index="2"><span data-hf-id="hf-fb2t">当前这项能力仅供默认租户管理员使用</span></div><div data-hf-id="hf-ifl1" id="cap-3-0" class="clip caption" data-start="59.152" data-duration="3.393" data-track-index="2"><span data-hf-id="hf-ydq0">在首页对话里使用办公技能，比如</span></div><div data-hf-id="hf-h17v" id="cap-3-1" class="clip caption" data-start="62.721" data-duration="4.012" data-track-index="2"><span data-hf-id="hf-72vr">查今天的会议，把我要准备的议题和材料列出来</span></div><div data-hf-id="hf-swdw" id="cap-3-2" class="clip caption" data-start="67.194" data-duration="3.690" data-track-index="2"><span data-hf-id="hf-w4rv">你不必记命令，助手会按可用工具查询</span></div><div data-hf-id="hf-ybbm" id="cap-3-3" class="clip caption" data-start="71.344" data-duration="3.561" data-track-index="2"><span data-hf-id="hf-1uk3">需要读邮件时，说明主题或时间范围</span></div><div data-hf-id="hf-y5ln" id="cap-3-4" class="clip caption" data-start="75.120" data-duration="3.431" data-track-index="2"><span data-hf-id="hf-qsoz">比一句查一下邮件更容易得到有用结果</span></div><div data-hf-id="hf-lunn" id="cap-4-0" class="clip caption" data-start="80.052" data-duration="2.259" data-track-index="2"><span data-hf-id="hf-u9k2">它可以查会议详情和议题</span></div><div data-hf-id="hf-ka95" id="cap-4-1" class="clip caption" data-start="82.487" data-duration="3.239" data-track-index="2"><span data-hf-id="hf-zv4p">找聊天记录、联系人与云空间文件</span></div><div data-hf-id="hf-80q1" id="cap-4-2" class="clip caption" data-start="85.889" data-duration="1.873" data-track-index="2"><span data-hf-id="hf-dx1j">也能读取邮件和日历</span></div><div data-hf-id="hf-1wf2" id="cap-4-3" class="clip caption" data-start="88.236" data-duration="3.432" data-track-index="2"><span data-hf-id="hf-a9qi">需要的附件可以下载到指定的固定目录</span></div><div data-hf-id="hf-0cnz" id="cap-4-4" class="clip caption" data-start="92.141" data-duration="2.130" data-track-index="2"><span data-hf-id="hf-uloo">这一页演示的是整理方法</span></div><div data-hf-id="hf-30x9" id="cap-4-5" class="clip caption" data-start="94.499" data-duration="3.947" data-track-index="2"><span data-hf-id="hf-jasq">具体结果以你账号和实际查询返回为准</span></div><div data-hf-id="hf-bu1e" id="cap-5-0" class="clip caption" data-start="99.952" data-duration="3.895" data-track-index="2"><span data-hf-id="hf-p2vj">查资料和替你发消息，是两件不同的事</span></div><div data-hf-id="hf-lhv7" id="cap-5-1" class="clip caption" data-start="104.309" data-duration="3.483" data-track-index="2"><span data-hf-id="hf-3zfb">若要发送消息、创建会议或发邮件</span></div><div data-hf-id="hf-8zzr" id="cap-5-2" class="clip caption" data-start="108.007" data-duration="3.870" data-track-index="2"><span data-hf-id="hf-ietx">管理员还要开启写操作；随后每一条操作</span></div><div data-hf-id="hf-to1j" id="cap-5-3" class="clip caption" data-start="111.989" data-duration="2.839" data-track-index="2"><span data-hf-id="hf-4slu">都需要你在对话审批卡上点允许</span></div><div data-hf-id="hf-sw4p" id="cap-5-4" class="clip caption" data-start="115.288" data-duration="4.128" data-track-index="2"><span data-hf-id="hf-6do7">先检查收件人、内容和时间，再让它执行</span></div><div data-hf-id="hf-fwca" id="cap-6-0" class="clip caption" data-start="120.919" data-duration="3.199" data-track-index="2"><span data-hf-id="hf-2c4q">执行后，看工具返回和执行日志</span></div><div data-hf-id="hf-ze2r" id="cap-6-1" class="clip caption" data-start="124.346" data-duration="2.376" data-track-index="2"><span data-hf-id="hf-n2yv">确认操作到底有没有成功</span></div><div data-hf-id="hf-3l44" id="cap-6-2" class="clip caption" data-start="127.183" data-duration="2.800" data-track-index="2"><span data-hf-id="hf-cs22">不是看到一句已安排就算完成</span></div><div data-hf-id="hf-1nbv" id="cap-6-3" class="clip caption" data-start="130.443" data-duration="4.476" data-track-index="2"><span data-hf-id="hf-hygy">电脑环境、个人登录状态和企业权限都会影响</span></div><div data-hf-id="hf-a9uf" id="cap-6-4" class="clip caption" data-start="134.825" data-duration="2.259" data-track-index="2"><span data-hf-id="hf-wau2">可用性；会话失效时</span></div><div data-hf-id="hf-yr5x" id="cap-6-5" class="clip caption" data-start="137.209" data-duration="2.620" data-track-index="2"><span data-hf-id="hf-61pi">回到个人身份卡片重新登录</span></div><div data-hf-id="hf-wxur" id="cap-7-0" class="clip caption" data-start="141.319" data-duration="4.256" data-track-index="2"><span data-hf-id="hf-a9k0">第一次试用，先做一个只读任务：查今天的会议</span></div><div data-hf-id="hf-u2vc" id="cap-7-1" class="clip caption" data-start="145.687" data-duration="3.936" data-track-index="2"><span data-hf-id="hf-yt66">并列出材料清单。确认查得到、对得上</span></div><div data-hf-id="hf-l25g" id="cap-7-2" class="clip caption" data-start="149.825" data-duration="2.646" data-track-index="2"><span data-hf-id="hf-1beu">再逐步使用需要审批的操作</span></div><div data-hf-id="hf-nrar" id="cap-7-3" class="clip caption" data-start="152.944" data-duration="4.024" data-track-index="2"><span data-hf-id="hf-mqg0">让助手帮你找齐信息，把决定权留在你手里</span></div></div><script>window.__timelines.captions=gsap.timeline({paused:true});</script></template>

<template><style>@font-face{font-family:GuideSans;src:url('assets/NotoSansSC.ttf')}#root{position:absolute;inset:0;pointer-events:none}.caption{position:absolute;left:165px;right:165px;top:899px;height:92px;display:flex;align-items:center;justify-content:center;z-index:30;font:500 42px/1.45 GuideSans;color:#fff}.caption span{background:#183047;padding:10px 28px;border-radius:12px;text-align:center}</style><div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div id="cap-0-0" class="clip caption" data-start="0.452" data-duration="3.457" data-track-index="2"><span>每个月换数字、重画图、再改总结</span></div><div id="cap-0-1" class="clip caption" data-start="4.124" data-duration="2.246" data-track-index="2"><span>最累的不是写那几句话</span></div><div id="cap-0-2" class="clip caption" data-start="6.598" data-duration="3.833" data-track-index="2"><span>而是同一套报表一遍遍重做。这次</span></div><div id="cap-0-3" class="clip caption" data-start="10.595" data-duration="1.692" data-track-index="2"><span>我们拿一张整改详单</span></div><div id="cap-0-4" class="clip caption" data-start="12.502" data-duration="3.342" data-track-index="2"><span>看看 AI 月报怎么让这份工作留下来</span></div><div id="cap-1-0" class="clip caption" data-start="17.319" data-duration="2.955" data-track-index="2"><span>打开月报页面，先选报告月份</span></div><div id="cap-1-1" class="clip caption" data-start="20.748" data-duration="3.277" data-track-index="2"><span>你可以从模板开始，按章节安排内容</span></div><div id="cap-1-2" class="clip caption" data-start="24.485" data-duration="2.208" data-track-index="2"><span>每个格子就是一块工作区</span></div><div id="cap-1-3" class="clip caption" data-start="26.921" data-duration="3.444" data-track-index="2"><span>告诉它用什么数据、怎么算、怎么展示</span></div><div id="cap-1-4" class="clip caption" data-start="30.477" data-duration="3.960" data-track-index="2"><span>系统再把要求整理成可以反复运行的配方</span></div><div id="cap-2-0" class="clip caption" data-start="35.952" data-duration="4.411" data-track-index="2"><span>比如：统计本月整改详单，按严重级别分组</span></div><div id="cap-2-1" class="clip caption" data-start="40.500" data-duration="5.122" data-track-index="2"><span>用柱状图加明细表。系统先查平台已有的数据源</span></div><div id="cap-2-2" class="clip caption" data-start="46.095" data-duration="4.656" data-track-index="2"><span>口径不清楚时会给出选项让你点；来源找不到时</span></div><div id="cap-2-3" class="clip caption" data-start="50.824" data-duration="2.955" data-track-index="2"><span>需要补数据，不能把空白当成零</span></div><div id="cap-3-0" class="clip caption" data-start="55.285" data-duration="4.746" data-track-index="2"><span>看这份演示数据：高、中、低三级加起来五条</span></div><div id="cap-3-1" class="clip caption" data-start="60.505" data-duration="3.844" data-track-index="2"><span>图表让你看到分布，明细让你回到记录核对</span></div><div id="cap-3-2" class="clip caption" data-start="64.809" data-duration="3.458" data-track-index="2"><span>需要时，还能要求生成可下钻的图表</span></div><div id="cap-3-3" class="clip caption" data-start="68.456" data-duration="4.463" data-track-index="2"><span>或让同格的表格跟着图表筛选。先看趋势</span></div><div id="cap-3-4" class="clip caption" data-start="73.018" data-duration="1.318" data-track-index="2"><span>再找具体问题</span></div><div id="cap-4-0" class="clip caption" data-start="75.819" data-duration="3.290" data-track-index="2"><span>觉得标题太长，或者只想看高风险？</span></div><div id="cap-4-1" class="clip caption" data-start="79.583" data-duration="2.053" data-track-index="2"><span>在格子的对话里继续说</span></div><div id="cap-4-2" class="clip caption" data-start="81.851" data-duration="2.852" data-track-index="2"><span>最终提示词会把要求留下来</span></div><div id="cap-4-3" class="clip caption" data-start="85.163" data-duration="4.476" data-track-index="2"><span>也可以双击改显示文字。重做效果不满意时</span></div><div id="cap-4-4" class="clip caption" data-start="89.763" data-duration="3.162" data-track-index="2"><span>用撤回回到上一版，不必从头再聊</span></div><div id="cap-5-0" class="clip caption" data-start="94.419" data-duration="3.560" data-track-index="2"><span>真正省力的地方在这里：切换报告月份</span></div><div id="cap-5-1" class="clip caption" data-start="98.156" data-duration="3.779" data-track-index="2"><span>已配置的格子会重新读取对应月份的数据</span></div><div id="cap-5-2" class="clip caption" data-start="102.062" data-duration="4.811" data-track-index="2"><span>再计算、再展示。复用的是取数和计算规则</span></div><div id="cap-5-3" class="clip caption" data-start="107.075" data-duration="2.736" data-track-index="2"><span>不是把上个月的数字换个标题</span></div><div id="cap-5-4" class="clip caption" data-start="110.284" data-duration="3.470" data-track-index="2"><span>新月份仍要先有数据，口径也要核对</span></div><div id="cap-6-0" class="clip caption" data-start="115.252" data-duration="3.303" data-track-index="2"><span>一格验证好，再逐步做完整个章节</span></div><div id="cap-6-1" class="clip caption" data-start="119.029" data-duration="4.179" data-track-index="2"><span>整体风格、章节样式和报头也能继续调整</span></div><div id="cap-6-2" class="clip caption" data-start="123.681" data-duration="0.790" data-track-index="2"><span>保存后</span></div><div id="cap-6-3" class="clip caption" data-start="124.596" data-duration="3.986" data-track-index="2"><span>可以导出 HTML、PDF 或邮件文件</span></div><div id="cap-6-4" class="clip caption" data-start="129.055" data-duration="3.135" data-track-index="2"><span>AI 帮你完成制作，正式发出前</span></div><div id="cap-6-5" class="clip caption" data-start="132.315" data-duration="2.800" data-track-index="2"><span>仍由你核对数据、口径和结论</span></div><div id="cap-7-0" class="clip caption" data-start="136.619" data-duration="3.431" data-track-index="2"><span>第一次使用，不用一下子做完整本月报</span></div><div id="cap-7-1" class="clip caption" data-start="140.512" data-duration="2.594" data-track-index="2"><span>先挑一个每月都要汇报的指标</span></div><div id="cap-7-2" class="clip caption" data-start="143.321" data-duration="4.759" data-track-index="2"><span>明确来源、分组和展示方式，验证无误后再扩展</span></div><div id="cap-7-3" class="clip caption" data-start="148.540" data-duration="2.027" data-track-index="2"><span>让每个月都要重做的事</span></div><div id="cap-7-4" class="clip caption" data-start="150.731" data-duration="2.272" data-track-index="2"><span>变成每个月只需核对的事</span></div></div><script>window.__timelines.captions=gsap.timeline({paused:true});</script></template>

<template><style>@font-face{font-family:GuideSans;src:url('assets/NotoSansSC.ttf')}#root{position:absolute;inset:0;pointer-events:none}.caption{position:absolute;left:165px;right:165px;top:899px;height:92px;display:flex;align-items:center;justify-content:center;z-index:30;font:500 42px/1.45 GuideSans;color:#fff}.caption span{background:#183047;padding:10px 28px;border-radius:12px;text-align:center}</style><div data-hf-id="hf-jn2k" id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div data-hf-id="hf-hwm8" id="cap-0-0" class="clip caption" data-start="0.452" data-duration="3.457" data-track-index="2"><span data-hf-id="hf-1eur">每个月换数字、重画图、再改总结</span></div><div data-hf-id="hf-n6gv" id="cap-0-1" class="clip caption" data-start="4.124" data-duration="2.221" data-track-index="2"><span data-hf-id="hf-lys6">最累的不是写那几句话</span></div><div data-hf-id="hf-xdd0" id="cap-0-2" class="clip caption" data-start="6.573" data-duration="3.781" data-track-index="2"><span data-hf-id="hf-so1z">而是同一套报表一遍遍重做。这次</span></div><div data-hf-id="hf-v0qw" id="cap-0-3" class="clip caption" data-start="10.518" data-duration="1.692" data-track-index="2"><span data-hf-id="hf-7tnn">我们拿一张整改详单</span></div><div data-hf-id="hf-rdjz" id="cap-0-4" class="clip caption" data-start="12.425" data-duration="3.341" data-track-index="2"><span data-hf-id="hf-rqkv">看看 AI 月报怎么让这份工作留下来</span></div><div data-hf-id="hf-0vtb" id="cap-1-0" class="clip caption" data-start="17.252" data-duration="2.955" data-track-index="2"><span data-hf-id="hf-pi71">打开月报页面，先选报告月份</span></div><div data-hf-id="hf-cevm" id="cap-1-1" class="clip caption" data-start="20.681" data-duration="3.277" data-track-index="2"><span data-hf-id="hf-dgse">你可以从模板开始，按章节安排内容</span></div><div data-hf-id="hf-5nbm" id="cap-1-2" class="clip caption" data-start="24.418" data-duration="2.208" data-track-index="2"><span data-hf-id="hf-7xgi">每个格子就是一块工作区</span></div><div data-hf-id="hf-u7hq" id="cap-1-3" class="clip caption" data-start="26.854" data-duration="3.444" data-track-index="2"><span data-hf-id="hf-xc1v">告诉它用什么数据、怎么算、怎么展示</span></div><div data-hf-id="hf-06w3" id="cap-1-4" class="clip caption" data-start="30.410" data-duration="3.960" data-track-index="2"><span data-hf-id="hf-worh">系统再把要求整理成可以反复运行的配方</span></div><div data-hf-id="hf-lyjx" id="cap-2-0" class="clip caption" data-start="35.885" data-duration="4.411" data-track-index="2"><span data-hf-id="hf-erlg">比如：统计本月整改详单，按严重级别分组</span></div><div data-hf-id="hf-v3gd" id="cap-2-1" class="clip caption" data-start="40.433" data-duration="5.122" data-track-index="2"><span data-hf-id="hf-otlh">用柱状图加明细表。系统先查平台已有的数据源</span></div><div data-hf-id="hf-hoqf" id="cap-2-2" class="clip caption" data-start="46.028" data-duration="4.656" data-track-index="2"><span data-hf-id="hf-3rn0">口径不清楚时会给出选项让你点；来源找不到时</span></div><div data-hf-id="hf-buwc" id="cap-2-3" class="clip caption" data-start="50.757" data-duration="2.955" data-track-index="2"><span data-hf-id="hf-5y91">需要补数据，不能把空白当成零</span></div><div data-hf-id="hf-h65w" id="cap-3-0" class="clip caption" data-start="55.219" data-duration="4.746" data-track-index="2"><span data-hf-id="hf-f50u">看这份演示数据：高、中、低三级加起来五条</span></div><div data-hf-id="hf-xy4z" id="cap-3-1" class="clip caption" data-start="60.439" data-duration="3.844" data-track-index="2"><span data-hf-id="hf-93mx">图表让你看到分布，明细让你回到记录核对</span></div><div data-hf-id="hf-rgtb" id="cap-3-2" class="clip caption" data-start="64.743" data-duration="3.458" data-track-index="2"><span data-hf-id="hf-pwp0">需要时，还能要求生成可下钻的图表</span></div><div data-hf-id="hf-q5br" id="cap-3-3" class="clip caption" data-start="68.390" data-duration="4.463" data-track-index="2"><span data-hf-id="hf-2h7m">或让同格的表格跟着图表筛选。先看趋势</span></div><div data-hf-id="hf-449x" id="cap-3-4" class="clip caption" data-start="72.952" data-duration="1.318" data-track-index="2"><span data-hf-id="hf-ipvy">再找具体问题</span></div><div data-hf-id="hf-q8i8" id="cap-4-0" class="clip caption" data-start="75.752" data-duration="3.290" data-track-index="2"><span data-hf-id="hf-tppw">觉得标题太长，或者只想看高风险？</span></div><div data-hf-id="hf-ye9n" id="cap-4-1" class="clip caption" data-start="79.516" data-duration="2.053" data-track-index="2"><span data-hf-id="hf-f55f">在格子的对话里继续说</span></div><div data-hf-id="hf-3ddz" id="cap-4-2" class="clip caption" data-start="81.784" data-duration="2.852" data-track-index="2"><span data-hf-id="hf-rji0">最终提示词会把要求留下来</span></div><div data-hf-id="hf-r84g" id="cap-4-3" class="clip caption" data-start="85.096" data-duration="4.476" data-track-index="2"><span data-hf-id="hf-2yye">也可以双击改显示文字。重做效果不满意时</span></div><div data-hf-id="hf-m0lw" id="cap-4-4" class="clip caption" data-start="89.696" data-duration="3.162" data-track-index="2"><span data-hf-id="hf-l55m">用撤回回到上一版，不必从头再聊</span></div><div data-hf-id="hf-i7gc" id="cap-5-0" class="clip caption" data-start="94.352" data-duration="3.573" data-track-index="2"><span data-hf-id="hf-daje">真正省力的地方在这里：切换报告月份</span></div><div data-hf-id="hf-jlpk" id="cap-5-1" class="clip caption" data-start="98.102" data-duration="3.779" data-track-index="2"><span data-hf-id="hf-ausg">已配置的格子会重新读取对应月份的数据</span></div><div data-hf-id="hf-siwl" id="cap-5-2" class="clip caption" data-start="102.008" data-duration="4.810" data-track-index="2"><span data-hf-id="hf-702u">再计算、再展示。复用的是取数和计算规则</span></div><div data-hf-id="hf-8wpl" id="cap-5-3" class="clip caption" data-start="107.021" data-duration="2.736" data-track-index="2"><span data-hf-id="hf-o0k3">不是把上个月的数字换个标题</span></div><div data-hf-id="hf-pj5r" id="cap-5-4" class="clip caption" data-start="110.229" data-duration="3.471" data-track-index="2"><span data-hf-id="hf-evm9">新月份仍要先有数据，口径也要核对</span></div><div data-hf-id="hf-hnd8" id="cap-6-0" class="clip caption" data-start="115.219" data-duration="3.303" data-track-index="2"><span data-hf-id="hf-dzvb">一格验证好，再逐步做完整个章节</span></div><div data-hf-id="hf-dsae" id="cap-6-1" class="clip caption" data-start="118.996" data-duration="4.179" data-track-index="2"><span data-hf-id="hf-wld1">整体风格、章节样式和报头也能继续调整</span></div><div data-hf-id="hf-fwqe" id="cap-6-2" class="clip caption" data-start="123.648" data-duration="0.790" data-track-index="2"><span data-hf-id="hf-kke6">保存后</span></div><div data-hf-id="hf-e4ri" id="cap-6-3" class="clip caption" data-start="124.563" data-duration="3.986" data-track-index="2"><span data-hf-id="hf-uj5w">可以导出 HTML、PDF 或邮件文件</span></div><div data-hf-id="hf-46y6" id="cap-6-4" class="clip caption" data-start="129.022" data-duration="3.135" data-track-index="2"><span data-hf-id="hf-2qeh">AI 帮你完成制作，正式发出前</span></div><div data-hf-id="hf-d8cf" id="cap-6-5" class="clip caption" data-start="132.282" data-duration="2.800" data-track-index="2"><span data-hf-id="hf-jr01">仍由你核对数据、口径和结论</span></div><div data-hf-id="hf-kjjw" id="cap-7-0" class="clip caption" data-start="136.585" data-duration="3.431" data-track-index="2"><span data-hf-id="hf-d32e">第一次使用，不用一下子做完整本月报</span></div><div data-hf-id="hf-fexq" id="cap-7-1" class="clip caption" data-start="140.478" data-duration="2.594" data-track-index="2"><span data-hf-id="hf-xfjp">先挑一个每月都要汇报的指标</span></div><div data-hf-id="hf-ooyx" id="cap-7-2" class="clip caption" data-start="143.287" data-duration="4.759" data-track-index="2"><span data-hf-id="hf-fe4l">明确来源、分组和展示方式，验证无误后再扩展</span></div><div data-hf-id="hf-7nur" id="cap-7-3" class="clip caption" data-start="148.506" data-duration="2.027" data-track-index="2"><span data-hf-id="hf-wcfr">让每个月都要重做的事</span></div><div data-hf-id="hf-eniu" id="cap-7-4" class="clip caption" data-start="150.697" data-duration="2.272" data-track-index="2"><span data-hf-id="hf-8y88">变成每个月只需核对的事</span></div></div><script>window.__timelines.captions=gsap.timeline({paused:true});</script></template>

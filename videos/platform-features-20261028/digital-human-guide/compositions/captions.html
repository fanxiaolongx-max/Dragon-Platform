<template><style>@font-face{font-family:GuideSans;src:url('assets/NotoSansSC.ttf')}#root{position:absolute;inset:0;pointer-events:none}.caption{position:absolute;left:165px;right:165px;top:899px;height:92px;display:flex;align-items:center;justify-content:center;z-index:30;font:500 42px/1.45 GuideSans;color:#fff}.caption span{background:#183047;padding:10px 28px;border-radius:12px;text-align:center}</style><div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div id="cap-0-0" class="clip caption" data-start="0.452" data-duration="3.522" data-track-index="2"><span>收到一个运营问题，打开数据库却发现</span></div><div id="cap-0-1" class="clip caption" data-start="4.150" data-duration="2.646" data-track-index="2"><span>表名看不懂，日期格式不一样</span></div><div id="cap-0-2" class="clip caption" data-start="6.883" data-duration="4.734" data-track-index="2"><span>同一个区域还有不同编码。难点不是写一句查询</span></div><div id="cap-0-3" class="clip caption" data-start="11.832" data-duration="3.213" data-track-index="2"><span>而是先弄清这张表到底代表什么</span></div><div id="cap-0-4" class="clip caption" data-start="15.518" data-duration="3.522" data-track-index="2"><span>数字人基座对接，就是从这里帮你开始</span></div><div id="cap-1-0" class="clip caption" data-start="20.552" data-duration="3.792" data-track-index="2"><span>这里的数字人，指运营数据基座的接入能力</span></div><div id="cap-1-1" class="clip caption" data-start="24.819" data-duration="2.259" data-track-index="2"><span>平台直接调用基座接口</span></div><div id="cap-1-2" class="clip caption" data-start="27.215" data-duration="2.053" data-track-index="2"><span>提供 NetCare 数据探查</span></div><div id="cap-1-3" class="clip caption" data-start="29.380" data-duration="4.450" data-track-index="2"><span>也让管理员在首页通过自然语言进行只读查询</span></div><div id="cap-1-4" class="clip caption" data-start="34.303" data-duration="1.705" data-track-index="2"><span>它不是视频虚拟人</span></div><div id="cap-1-5" class="clip caption" data-start="36.146" data-duration="3.174" data-track-index="2"><span>也不是把内网数据库直接复制到电脑</span></div><div id="cap-2-0" class="clip caption" data-start="40.819" data-duration="3.212" data-track-index="2"><span>管理员进入频道对接的数字人标签</span></div><div id="cap-2-1" class="clip caption" data-start="44.246" data-duration="3.638" data-track-index="2"><span>导入配置或逐项填写，再测试连接</span></div><div id="cap-2-2" class="clip caption" data-start="48.346" data-duration="4.347" data-track-index="2"><span>页面会分步骤检查数据源、业务库和应用库</span></div><div id="cap-2-3" class="clip caption" data-start="53.165" data-duration="2.556" data-track-index="2"><span>先看哪一步通过、哪一步失败</span></div><div id="cap-2-4" class="clip caption" data-start="55.962" data-duration="3.316" data-track-index="2"><span>连接确实可用之后，再进入数据探查</span></div><div id="cap-3-0" class="clip caption" data-start="60.752" data-duration="2.980" data-track-index="2"><span>表目录会读取基座的实时表清单</span></div><div id="cap-3-1" class="clip caption" data-start="63.973" data-duration="2.981" data-track-index="2"><span>并叠加盘点种子和管理员标注</span></div><div id="cap-3-2" class="clip caption" data-start="67.415" data-duration="3.986" data-track-index="2"><span>新增表、空表、未核对的表都能筛出来</span></div><div id="cap-3-3" class="clip caption" data-start="71.861" data-duration="2.968" data-track-index="2"><span>点进一张表，先看它的业务含义</span></div><div id="cap-3-4" class="clip caption" data-start="75.019" data-duration="1.949" data-track-index="2"><span>再看字段画像和样例</span></div><div id="cap-3-5" class="clip caption" data-start="77.145" data-duration="2.942" data-track-index="2"><span>核对日期、区域和数据粒度</span></div><div id="cap-4-0" class="clip caption" data-start="81.585" data-duration="3.315" data-track-index="2"><span>例如：按月看各区域的风险记录数</span></div><div id="cap-4-1" class="clip caption" data-start="85.362" data-duration="4.862" data-track-index="2"><span>先确认日期和区域字段，再做结构化筛选与聚合</span></div><div id="cap-4-2" class="clip caption" data-start="90.697" data-duration="5.094" data-track-index="2"><span>统计前要检查分区是否重复、占位值是否需要排除</span></div><div id="cap-4-3" class="clip caption" data-start="95.993" data-duration="3.999" data-track-index="2"><span>区域编码是否需要关联。查询能跑出来</span></div><div id="cap-4-4" class="clip caption" data-start="100.130" data-duration="2.233" data-track-index="2"><span>不代表口径就一定正确</span></div><div id="cap-5-0" class="clip caption" data-start="103.852" data-duration="3.238" data-track-index="2"><span>管理员在首页选择 NetCare 数据技能</span></div><div id="cap-5-1" class="clip caption" data-start="107.215" data-duration="2.311" data-track-index="2"><span>就能让助手找表、看字段</span></div><div id="cap-5-2" class="clip caption" data-start="109.663" data-duration="4.271" data-track-index="2"><span>、做结构化查询或只读 SQL。可以这样问</span></div><div id="cap-5-3" class="clip caption" data-start="114.137" data-duration="3.380" data-track-index="2"><span>先找风险相关的表，解释日期字段</span></div><div id="cap-5-4" class="clip caption" data-start="117.680" data-duration="4.309" data-track-index="2"><span>再统计本月分区域的数量。让助手一步步查</span></div><div id="cap-5-5" class="clip caption" data-start="122.101" data-duration="1.550" data-track-index="2"><span>也让你一步步核对</span></div><div id="cap-6-0" class="clip caption" data-start="125.152" data-duration="2.388" data-track-index="2"><span>当前功能只向管理员开放</span></div><div id="cap-6-1" class="clip caption" data-start="127.742" data-duration="4.400" data-track-index="2"><span>真实基座还需要内网连通。业务库只读</span></div><div id="cap-6-2" class="clip caption" data-start="132.395" data-duration="3.394" data-track-index="2"><span>应用库在人工确认后支持受限写入</span></div><div id="cap-6-3" class="clip caption" data-start="135.978" data-duration="4.463" data-track-index="2"><span>建表改表不在这里做。模型只提供只读工具</span></div><div id="cap-6-4" class="clip caption" data-start="140.913" data-duration="3.187" data-track-index="2"><span>基座离线时会提示回退种子目录</span></div><div id="cap-6-5" class="clip caption" data-start="144.303" data-duration="1.756" data-track-index="2"><span>种子不是实时数据</span></div><div id="cap-7-0" class="clip caption" data-start="147.585" data-duration="4.696" data-track-index="2"><span>第一次不要急着跨几十张表。先选一张业务表</span></div><div id="cap-7-1" class="clip caption" data-start="152.457" data-duration="2.865" data-track-index="2"><span>补上中文名和口径，核对样例</span></div><div id="cap-7-2" class="clip caption" data-start="155.473" data-duration="3.444" data-track-index="2"><span>再做一个简单统计。把不知道查什么</span></div><div id="cap-7-3" class="clip caption" data-start="159.145" data-duration="4.154" data-track-index="2"><span>逐步变成知道数据从哪来、数字怎么算出来</span></div></div><script>window.__timelines.captions=gsap.timeline({paused:true});</script></template>
